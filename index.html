<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Luau Quest: Learn Roblox Scripting</title>
<meta name="description" content="Interactive Roblox Luau course with a live sandbox, predict-run-modify exercises, puzzles, quizzes and spaced review. Updated for Roblox Studio, November 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' rx='18' fill='%233d9bff' transform='rotate(-8 50 50)'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<style>
/* ===== Luau Quest: "baseplate" design system ===== */
:root{
  --plate:#E9EDF3; --plate-dot:#D7DDE7; --card:#FFFFFF; --card2:#F5F7FB; --line:#DCE2EC; --line2:#C9D1DE;
  --ink:#1C2333; --muted:#5E6880; --dim:#8A93A8;
  --blue:#2E6BF0; --blue-e:#1F4FBF; --blue-soft:#E3ECFF;
  --green:#22B35E; --green-e:#178A47; --green-soft:#DDF6E7;
  --yellow:#FFC531; --yellow-e:#D89B00; --yellow-soft:#FFF4D1;
  --lava:#FF5B37; --lava-e:#CC3D1F; --lava-soft:#FFE6E0;
  --violet:#7B5CF0; --violet-e:#5A3FC4; --violet-soft:#EEE9FF;
  --code:#1D2230; --code2:#252B3B; --code-line:#2F3647;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,Menlo,monospace;
  --r:16px;
}
html[data-theme="dark"]{
  --plate:#141925; --plate-dot:#1E2535; --card:#1D2434; --card2:#232B3D; --line:#2C3549; --line2:#38435B;
  --ink:#E9EDF5; --muted:#A5AEC2; --dim:#7D869C;
  --blue-soft:#1E2B4D; --green-soft:#17352A; --yellow-soft:#3A3115; --lava-soft:#40211B; --violet-soft:#2A2448;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{overflow-x:hidden}
.output .ob,.ed-wrap,.codeview,.p-foot .msg .md,.tracewrap{overscroll-behavior:contain}
body{background-color:var(--plate);background-image:radial-gradient(circle at 12px 12px,var(--plate-dot) 3.2px,transparent 3.6px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
b,strong{font-weight:700}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.1;letter-spacing:-.005em;margin:0}
code{font-family:var(--mono);font-size:.84em;background:var(--blue-soft);color:var(--ink);padding:.1em .38em;border-radius:6px;white-space:nowrap}
pre code,.codeview code{white-space:pre}
kbd{font-family:var(--mono);font-size:.8em;background:var(--card);border:1px solid var(--line2);border-bottom-width:3px;border-radius:6px;padding:0 .4em}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.12rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- brick buttons ---------- */
.bb{--c:var(--blue);--e:var(--blue-e);--t:#fff;appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.01em;color:var(--t);background:var(--c);border-radius:14px;padding:.62em 1.3em .55em;box-shadow:0 5px 0 var(--e);transform:translateY(0);transition:transform .06s,box-shadow .06s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:.5em;text-decoration:none;line-height:1.2;user-select:none}
.bb:hover{filter:brightness(1.06)}
.bb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--e)}
.bb:disabled{--c:var(--line);--e:var(--line2);--t:var(--dim);cursor:not-allowed;filter:none}
.bb.green{--c:var(--green);--e:var(--green-e)}
.bb.yellow{--c:var(--yellow);--e:var(--yellow-e);--t:#3b2a00}
.bb.lava{--c:var(--lava);--e:var(--lava-e)}
.bb.ghost{--c:var(--card);--e:var(--line2);--t:var(--ink);border:2px solid var(--line2)}
.bb.sm{font-size:.9rem;padding:.45em .95em .4em;border-radius:12px;box-shadow:0 4px 0 var(--e)}
.bb.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--e)}
.bb.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;padding:.4em .6em;border-radius:8px}
.linkbtn:hover{color:var(--ink);background:var(--card2)}

/* ---------- app shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--plate) 88%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.topbar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.35rem}
.logo .mk{width:36px;height:36px}
.logo .nm{white-space:nowrap}
@media (max-width:1240px){.logo span.nm{display:none}}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid transparent}
.tab:hover{background:var(--card);color:var(--ink)}
.tab.on{color:var(--blue);background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.tab .ti{font-size:1.15rem}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.05rem;padding:4px 10px;border-radius:12px;background:var(--card);border:2px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.fire{color:#E56A00}
.chip.fire.cold{color:var(--dim)}
.chip.xp{color:#B07A00}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:1.1rem;color:var(--ink);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--line2)}
.botnav{display:none}
.page{max-width:1120px;margin:0 auto;padding:28px 20px 120px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
.rail{position:sticky;top:84px;display:grid;gap:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{font-size:1.2rem;margin-bottom:8px}

/* ---------- home: hero + path ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:0;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:34px}
.hero .copy{padding:26px 26px 24px}
.hero h1{font-size:2.35rem;margin-bottom:10px}
.hero p{margin:0 0 18px;color:var(--muted)}
.demo{background:var(--code);color:#E6E9F0;display:flex;flex-direction:column}
.demo pre{margin:0;padding:16px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.65;white-space:pre}
.demo .stage{position:relative;flex:1;min-height:150px;background:linear-gradient(#1a2c48,#2a4a6e);overflow:hidden}
.demo .ground{position:absolute;left:0;right:0;bottom:0;height:30px;background-color:#5c6170;background-image:radial-gradient(circle at 8px 8px,#6d7282 3px,transparent 3.5px);background-size:16px 16px}
.demo .brick{position:absolute;left:50%;bottom:30px;width:84px;height:34px;margin-left:-42px;border-radius:5px;background:var(--bc,#FF5B37);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.demo .brick::before,.demo .brick::after{content:"";position:absolute;top:-7px;width:20px;height:8px;border-radius:4px 4px 0 0;background:inherit;filter:brightness(1.05)}
.demo .brick::before{left:14px}.demo .brick::after{right:14px}
.demo .brick.drop{animation:drop .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-140px)}100%{transform:translateY(0)}}
.demo .ctrl{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--code2);flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:8px;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.sw.on{border-color:#fff}

.world-head{display:flex;gap:16px;align-items:center;border-radius:20px;padding:18px 20px;color:#fff;margin:8px 0 26px;box-shadow:0 6px 0 var(--wh-e)}
.world-head h2{font-size:1.65rem}
.world-head p{margin:2px 0 0;opacity:.92;font-size:.98rem}
.world-head .wp{margin-left:auto;text-align:right;font-family:var(--display);font-weight:800;font-size:1.1rem;white-space:nowrap}
.w1{background:var(--green);--wh-e:var(--green-e)}
.w2{background:var(--blue);--wh-e:var(--blue-e)}
.w3{background:var(--violet);--wh-e:var(--violet-e)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;margin-bottom:46px;padding-top:44px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;width:200px}
.node{position:relative;width:78px;height:70px;border-radius:20px;border:0;cursor:pointer;background:var(--card);box-shadow:0 7px 0 var(--line2);display:grid;place-items:center;font-size:1.9rem;transition:transform .06s,box-shadow .06s}
.node::before,.node::after{content:"";position:absolute;top:-8px;width:20px;height:10px;border-radius:6px 6px 0 0;background:inherit;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.node::before{left:15px}.node::after{right:15px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line2)}
.node.done{background:var(--green);box-shadow:0 7px 0 var(--green-e)}
.node.cur{background:var(--blue);box-shadow:0 7px 0 var(--blue-e)}
.node.boss{width:96px;border-radius:24px}
.node .ck{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#3b2a00;font-size:.95rem;display:grid;place-items:center;font-weight:900;border:3px solid var(--plate)}
.node-label{margin-top:12px;font-weight:700;font-size:.92rem;text-align:center;line-height:1.25;color:var(--ink)}
.node-label small{display:block;color:var(--muted);font-weight:400}
.start-bubble{position:absolute;top:-50px;background:var(--card);border:2px solid var(--line2);color:var(--blue);font-family:var(--display);font-weight:800;padding:4px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.ring{position:absolute;inset:-12px;border-radius:28px;border:4px solid color-mix(in srgb,var(--blue) 35%,transparent);pointer-events:none}

.goal{display:flex;align-items:center;gap:14px}
.goal svg{flex:none}
.goal .gt{font-family:var(--display);font-weight:800;font-size:1.15rem}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge{width:46px;height:46px;border-radius:14px;background:var(--yellow);box-shadow:0 4px 0 var(--yellow-e);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:#3b2a00;flex:none}
.bar{height:12px;border-radius:99px;background:var(--card2);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.3,1.2,.5,1);box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.bar.y>i{background:var(--yellow)}
.mini-badges{display:flex;flex-wrap:wrap;gap:8px}
.mb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--card2);border:2px solid var(--line);filter:grayscale(1);opacity:.45}
.mb.got{filter:none;opacity:1;background:var(--yellow-soft);border-color:var(--yellow)}
.quick{display:grid;gap:8px}
.quick a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;background:var(--card)}
.quick a:hover{border-color:var(--line2);background:var(--card2)}
.quick a span{font-size:1.25rem}

/* ---------- lesson player ---------- */
.player{min-height:100vh;display:flex;flex-direction:column}
.p-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--plate) 90%,transparent);backdrop-filter:blur(8px)}
.p-top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 20px}
.xbtn{background:none;border:0;font-size:1.6rem;color:var(--dim);cursor:pointer;line-height:1;padding:4px 8px;border-radius:10px}
.xbtn:hover{color:var(--ink);background:var(--card)}
.p-top .bar{flex:1;height:18px}
.p-top .bar>i{background:var(--green)}
.combo{font-family:var(--display);font-weight:800;color:#E56A00;white-space:nowrap;min-width:64px;text-align:right}
.p-body{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 20px 200px}
.screen{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen h2.st{font-size:1.75rem;margin:6px 0 14px}
.screen h3{font-size:1.35rem;margin:18px 0 8px}
.screen p{margin:.55em 0}
.screen ul,.screen ol{padding-left:1.3em}
.screen li{margin:.3em 0}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.kicker .dot{width:10px;height:10px;border-radius:3px;background:var(--kc,var(--blue))}
.surface{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px}
.p-foot{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:2px solid var(--line);background:var(--card);transition:background .2s}
.p-foot .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:16px 20px 18px;min-height:88px}
.p-foot .msg{flex:1;min-width:0}
.p-foot .msg .mt{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.15}
.p-foot .msg .md{font-size:.98rem;max-height:30vh;overflow:auto;margin-top:2px}
.p-foot.ok{background:var(--green-soft);border-top-color:var(--green)}
.p-foot.ok .mt{color:var(--green-e)}
.p-foot.no{background:var(--lava-soft);border-top-color:var(--lava)}
.p-foot.no .mt{color:var(--lava-e)}
.p-foot.info{background:var(--violet-soft);border-top-color:var(--violet)}
.p-foot.info .mt{color:var(--violet-e)}
html[data-theme="dark"] .p-foot.ok .mt{color:#6EE7A4} html[data-theme="dark"] .p-foot.no .mt{color:#FF9A85} html[data-theme="dark"] .p-foot.info .mt{color:#B9A6FF}
.p-foot .face{width:56px;height:56px;flex:none}
.xp-float{position:fixed;z-index:60;font-family:var(--display);font-weight:800;font-size:1.4rem;color:#B07A00;pointer-events:none;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}

/* intro / end */
.intro,.endcard{text-align:center;padding-top:20px}
.intro .bitbig,.endcard .bitbig{width:120px;height:120px;margin:0 auto 10px;display:block}
.intro h1,.endcard h1{font-size:2.3rem}
.intro .sub{color:var(--muted);margin:6px 0 20px}
.facts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 26px}
.fact{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px}
.fact .fv{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.fact .fl{font-size:.85rem;color:var(--muted)}
.fact.y{border-color:var(--yellow);background:var(--yellow-soft)} .fact.g{border-color:var(--green);background:var(--green-soft)} .fact.b{border-color:var(--blue);background:var(--blue-soft)}
.unlock{display:flex;gap:12px;align-items:center;justify-content:center;background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:14px;padding:10px 16px;margin:8px auto;max-width:420px;text-align:left;animation:in .4s}
.unlock .ui{font-size:1.8rem}

/* asides */
.aside{border-radius:14px;padding:12px 16px;margin:14px 0;border:2px solid;background:var(--ac-s);border-color:var(--ac)}
.aside .at{font-family:var(--display);font-weight:800;font-size:1.08rem;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.aside.why{--ac:var(--blue);--ac-s:var(--blue-soft)}
.aside.tip{--ac:var(--green);--ac-s:var(--green-soft)}
.aside.warn{--ac:var(--lava);--ac-s:var(--lava-soft)}
.aside.new{--ac:var(--violet);--ac-s:var(--violet-soft)}
.aside.analogy{--ac:var(--yellow);--ac-s:var(--yellow-soft)}
.aside.studio{--ac:var(--line2);--ac-s:var(--card)}
.aside p:first-of-type{margin-top:.2em}
details.deep{margin:14px 0;border:2px dashed var(--line2);border-radius:14px;background:var(--card)}
details.deep summary{cursor:pointer;list-style:none;padding:12px 16px;font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;gap:10px;align-items:center}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary .tg{margin-left:auto;font-family:var(--body);font-weight:700;font-size:.85rem;color:var(--muted)}
details.deep[open] summary .tg{display:none}
details.deep .dc{padding:0 18px 14px}
pre.mini{font-family:var(--mono);font-size:.84rem;background:var(--code);color:#E6E9F0;border-radius:10px;padding:10px 14px;overflow:auto;line-height:1.55;white-space:pre;margin:.6em 0}
.tbl{border-collapse:separate;border-spacing:0;width:100%;margin:.8em 0;font-size:.95rem;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tbl th,.tbl td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--card2);font-weight:700;font-size:.88rem;color:var(--muted)}

/* code display */
.codeview{font-family:var(--mono);font-size:14px;background:var(--code);color:#E6E9F0;border-radius:14px;overflow:auto;line-height:1.65;margin:12px 0}
.codeview table{border-collapse:collapse;width:100%}
.codeview td{padding:0;vertical-align:top}
.codeview .ln{width:1%;padding:0 12px 0 14px;color:#56607A;text-align:right;user-select:none;white-space:nowrap}
.codeview .src{white-space:pre;padding-right:16px;tab-size:4}
.codeview tr:first-child td{padding-top:10px}
.codeview tr.has-note{cursor:pointer}
.codeview tr.has-note .ln{color:var(--yellow)}
.codeview tr.has-note:hover td{background:#ffffff08}
.codeview .note{white-space:normal;font-family:var(--body);font-size:15px;color:#DCE2F0;padding:6px 16px 10px 50px;background:#272E40;border-left:4px solid var(--yellow)}
.codeview .simple{padding:12px 16px;white-space:pre;tab-size:4}
.notes-hidden .note{display:none}
.hk{color:#FF7A8A}.hs{color:#A8E890}.hn{color:#FFC94A}.hc{color:#6F7A93;font-style:italic}.hb{color:#7FD3FF}.hf{color:#FFF3A3}.ho{color:#D9DEEA}.hp{color:#D4A8FF}.hbo{color:#FF9F6E}

/* editor */
.editor{position:relative;display:flex;background:var(--code);border-radius:14px;overflow:hidden;font-family:var(--mono);font-size:14px;line-height:1.65;border:2px solid var(--code);color:#E6E9F0}
.editor:focus-within{border-color:var(--blue)}
.ed-gutter{padding:12px 10px 12px 14px;color:#56607A;text-align:right;user-select:none;white-space:pre;min-width:42px;background:#1A1F2C}
.ed-wrap{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta{margin:0;padding:12px 16px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;border:0;min-height:100%}
.ed-hl{pointer-events:none;position:relative}
.ed-hl code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:#fff;outline:none;overflow:hidden;-webkit-text-fill-color:transparent}
.ed-ta::selection{background:#2E6BF066;-webkit-text-fill-color:transparent}
.ed-hint{position:absolute;right:12px;bottom:6px;font-size:11px;color:#56607A;font-family:var(--body);pointer-events:none}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.task{background:var(--green-soft);border:2px solid var(--green);border-radius:14px;padding:12px 16px;margin:4px 0 12px}
.task.bug{background:var(--lava-soft);border-color:var(--lava)}
.task ul,.task ol{margin:.3em 0}

/* output */
.outwrap{margin-top:14px;display:grid;gap:12px}
.output{background:#12161F;border-radius:14px;font-family:var(--mono);font-size:13px;overflow:hidden;color:#E6E9F0}
.output .oh{display:flex;justify-content:space-between;align-items:center;background:#1A1F2C;padding:7px 14px;font-family:var(--body);font-size:.85rem;color:#9AA3B8;font-weight:700}
.output .oh button{background:none;border:0;color:#9AA3B8;cursor:pointer;font:inherit}
.output .ob{padding:8px 0;max-height:300px;overflow:auto}
.oline{display:flex;gap:12px;padding:1px 14px;white-space:pre-wrap;word-break:break-word;animation:in .18s}
.oline .ts{color:#56607A;flex:none;user-select:none}
.oline.warn{color:#FFB065}.oline.error{color:#FF7B6B}.oline.sim{color:#7FE3F0;font-style:italic}
.oline.sim .tx::before{content:"🎮 ";font-style:normal}
.oline.tip{color:#FFD86B}.oline.tip .tx::before{content:"💡 "}
.oline.stop,.oline.empty{color:#6F7A93;font-style:italic}
.errtip{background:var(--lava-soft);border:2px solid var(--lava);border-radius:14px;padding:10px 14px;font-size:.95rem}
.world{background:#12161F;border-radius:14px;overflow:hidden}
.world .oh{background:#1A1F2C;padding:7px 14px;font-size:.85rem;color:#9AA3B8;font-weight:700;display:flex;justify-content:space-between}
.world svg{display:block;width:100%;height:auto}
.lb{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;font-size:.95rem;max-width:380px;justify-self:end;width:100%}
.lb table{width:100%;border-collapse:collapse}
.lb th{background:var(--card2);font-size:.85rem;color:var(--muted);padding:6px 12px;text-align:left}
.lb td{padding:6px 12px;border-top:1px solid var(--line)}
.lb .v{text-align:right;font-weight:700;font-family:var(--mono)}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.97rem}
.checks .ci{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px;background:var(--card2);border:2px solid var(--line);color:var(--dim);font-weight:900}
.checks li.pass .ci{background:var(--green);border-color:var(--green);color:#fff}
.checks li.fail .ci{background:var(--lava);border-color:var(--lava);color:#fff}
.hints{display:grid;gap:8px;margin-top:12px}
.hint{background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:12px;padding:9px 14px;font-size:.96rem;animation:in .25s}
.solution{margin-top:12px;border:2px dashed var(--violet);border-radius:14px;padding:10px 14px;background:var(--violet-soft)}
.tabs-ed{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs-ed button{font:inherit;font-size:.88rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:5px 12px;cursor:pointer}
.tabs-ed button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* options */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line2);color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;font:inherit;transition:transform .05s,box-shadow .05s,border-color .1s}
.opt:hover:not(:disabled){background:var(--card2)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.opt .lt{width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;color:var(--muted)}
.opt .ot{font-family:var(--mono);font-size:.92rem}
.opt.prose .ot{font-family:var(--body);font-size:1rem}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue)}
.opt.sel .lt{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.opt.right .lt{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--lava);background:var(--lava-soft);box-shadow:0 4px 0 var(--lava)}
.opt.wrong .lt{background:var(--lava);border-color:var(--lava);color:#fff}
.opt:disabled{cursor:default}

/* parsons */
.pz{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.pz-col{background:var(--card2);border:2px dashed var(--line2);border-radius:14px;padding:10px;min-height:130px}
.pz-col h4{font-family:var(--body);font-size:.88rem;color:var(--muted);margin:2px 4px 8px}
.pz-line{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;background:var(--code);color:#E6E9F0;border-radius:9px;padding:7px 9px;margin-bottom:7px;cursor:pointer;white-space:pre;overflow:hidden;user-select:none;box-shadow:0 3px 0 #0b0e14;transition:transform .05s}
.pz-line:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e14}
.pz-line .code{flex:1;overflow:hidden;text-overflow:ellipsis}
.pz-line .mv{display:flex;gap:3px;flex:none}
.pz-line .mv button{background:#2F3647;border:0;color:#AEB6C8;border-radius:5px;cursor:pointer;padding:0 7px;font-size:12px;line-height:22px}
.pz-line .num{color:#56607A;width:18px;text-align:right;flex:none}
.pz-empty{color:var(--dim);font-size:.9rem;padding:10px}
textarea.refl{width:100%;min-height:120px;background:var(--card);border:2px solid var(--line2);border-radius:14px;color:var(--ink);font:inherit;padding:12px 14px;resize:vertical}
textarea.refl:focus{outline:none;border-color:var(--violet)}
.mission{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 16px;border-radius:14px;border:2px solid var(--line2);background:var(--card);cursor:pointer;font-weight:700}
.mission input{width:22px;height:22px;accent-color:var(--green)}

/* dictionary / pages */
.pagehead{margin:4px 0 22px}
.pagehead h1{font-size:2.3rem}
.pagehead p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.search{width:100%;font:inherit;font-size:1.05rem;padding:12px 16px;border-radius:14px;border:2px solid var(--line2);background:var(--card);color:var(--ink)}
.search:focus{outline:none;border-color:var(--blue)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}
.cats button{font:inherit;font-size:.88rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:4px 12px;cursor:pointer}
.cats button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.dent{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dent>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.dent>summary::-webkit-details-marker{display:none}
.dent .dn{font-family:var(--mono);font-weight:700;font-size:.95rem;color:var(--blue)}
.dent .dw{grid-column:1;font-size:.93rem;color:var(--muted);line-height:1.4}
.dent .dc{grid-row:1/3;grid-column:2;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--card2);border-radius:99px;padding:2px 10px}
.dent[open]>summary{border-bottom:2px solid var(--line)}
.dent .body{padding:12px 16px 16px}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bdg{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.bdg .bi{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--card2);filter:grayscale(1);opacity:.5;flex:none}
.bdg.got{border-color:var(--yellow)}
.bdg.got .bi{filter:none;opacity:1;background:var(--yellow-soft)}
.bdg b{display:block;font-family:var(--display);font-size:1.08rem;line-height:1.2}
.bdg span{font-size:.88rem;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.settings label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.settings select{font:inherit;padding:4px 8px;border-radius:8px;border:2px solid var(--line2);background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:in .3s}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

@media (max-width:980px){
  .home{grid-template-columns:1fr}
  .rail{position:static;order:-1}
  .rail .hide-m{display:none}
  .hero{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{font-size:16px}
  .tabs{display:none}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);justify-content:space-around;padding:6px 4px 10px}
  .botnav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:10px}
  .botnav a span{font-size:1.35rem}
  .botnav a.on{color:var(--blue)}
  .topbar .in{padding:8px 14px;gap:10px}
  .logo span.nm{display:none}
  .page{padding:18px 14px 110px}
  .hero h1{font-size:1.8rem}
  .pz{grid-template-columns:1fr}
  .p-foot .in{flex-wrap:wrap}
  .p-foot .face{display:none}
  .p-foot .bb{flex:1}
  .screen h2.st{font-size:1.45rem}
}

/* trace tables & fill-in */
.tracewrap{overflow-x:auto;margin:12px 0}
table.trace{border-collapse:separate;border-spacing:0;background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:100%}
table.trace th,table.trace td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.trace th{background:var(--card2);font-size:.9rem}
table.trace td.tl{text-align:left;font-size:.92rem;color:var(--muted);white-space:nowrap}
table.trace td.given{font-family:var(--mono);color:var(--muted);background:var(--card2)}
table.trace td.na{color:var(--dim)}
table.trace tr:last-child td{border-bottom:0}
.tin,.fin{font-family:var(--mono);font-size:15px;border:2px solid var(--line2);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink);text-align:center;min-width:3ch}
.tin{width:7ch}
.fin{background:#2A3142;color:#FFF3A3;border-color:#3A4258;padding:1px 4px;font-size:14px;text-align:left}
.tin:focus,.fin:focus{outline:none;border-color:var(--blue)}
.tin.ok,.fin.ok{border-color:var(--green);background:var(--green-soft)}
.fin.ok{background:#1E3A2C;color:#A8E890}
.tin.bad,.fin.bad{border-color:var(--lava);background:var(--lava-soft)}
.fin.bad{background:#40211B;color:#FFB3A3}
.tin.shown,.fin.shown{border-color:var(--violet)}
.fillcode .simple{line-height:2.1}
.codeview tr.goalrow td{padding:10px 12px 2px}
.goal-tag{display:inline-block;font-family:var(--body);font-weight:700;font-size:.82rem;color:#1C2333;background:#FFC531;border-radius:8px;padding:2px 10px}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.idea{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.idea h3{font-size:1.25rem}
.idea .lvlpill{align-self:flex-start;font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px}
.idea .lvlpill.s{background:var(--green-soft);color:var(--green-e)} .idea .lvlpill.b{background:var(--blue-soft);color:var(--blue-e)} .idea .lvlpill.p{background:var(--violet-soft);color:var(--violet-e)}
html[data-theme="dark"] .idea .lvlpill{color:var(--ink)}
.idea .uses{display:flex;flex-wrap:wrap;gap:6px}
.idea .uses a{font-size:.8rem;font-weight:700;text-decoration:none;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:1px 8px}
.idea ol{margin:0;padding-left:1.2em;font-size:.95rem}
.idea .stretch{font-size:.9rem;color:var(--muted)}
@media (max-width:720px){.editor{font-size:16px}input,textarea,select{font-size:16px}.tin,.fin{font-size:16px}}

</style>
</head>

f c then return c end\n  local co, isMain = coroutine.running()\n  local waited = 0\n  while not c do\n    if waited >= (timeout or 5) then\n      if timeout then return nil end\n      emit(\"warn\", \"Infinite yield possible on '\" .. fullName(self) .. ':WaitForChild(\"' .. tostr(name) .. '\")\\'', __clock)\n      timeout = 1e9\n    end\n    if isMain then return nil end\n    task.wait(0.1); waited = waited + 0.1\n    c = methods.FindFirstChild(self, name)\n  end\n  return c\nend\nfunction methods.GetChildren(self)\n  checkSelf(self, \"GetChildren\")\n  local t = {}\n  for i, c in ipairs(data[self].children) do t[i] = c end\n  return t\nend\nfunction methods.GetDescendants(self)\n  checkSelf(self, \"GetDescendants\")\n  local t = {}\n  local function walk(o) for _, c in ipairs(data[o].children) do t[#t + 1] = c; walk(c) end end\n  walk(self)\n  return t\nend\nfunction methods.IsA(self, cls) checkSelf(self, \"IsA\") return isA(data[self].class, cls) end\nfunction methods.IsDescendantOf(self, anc)\n  local p = data[self].parent\n  while p do if p == anc then return true end p = data[p].parent end\n  return false\nend\nfunction methods.GetFullName(self) return fullName(self) end\nfunction methods.Destroy(self)\n  checkSelf(self, \"Destroy\")\n  local r = data[self]\n  if r.destroyed then return end\n  fire(r.events.Destroying)\n  for _, c in ipairs(methods.GetChildren(self)) do methods.Destroy(c) end\n  setParent(self, nil)\n  r.locked = true\n  r.destroyed = true\n  for _, e in pairs(r.events) do e.__handlers = {} end\nend\nfunction methods.ClearAllChildren(self)\n  for _, c in ipairs(methods.GetChildren(self)) do methods.Destroy(c) end\nend\nfunction methods.Clone(self)\n  checkSelf(self, \"Clone\")\n  local r = data[self]\n  local copy = newInstance(r.class, r.props.Name)\n  local cr = data[copy]\n  for k, v in pairs(r.props) do cr.props[k] = v end\n  for k, v in pairs(r.attrs) do cr.attrs[k] = v end\n  for _, c in ipairs(r.children) do setParent(methods.Clone(c), copy) end\n  return copy\nend\nfunction methods.GetPropertyChangedSignal(self, prop)\n  local r = data[self]\n  r.propSignals[prop] = r.propSignals[prop] or newSignal(prop .. \"Changed\")\n  return r.propSignals[prop]\nend\nfunction methods.SetAttribute(self, name, value)\n  data[self].attrs[name] = value\n  fire(data[self].events.AttributeChanged, name)\nend\nfunction methods.GetAttribute(self, name) return data[self].attrs[name] end\nfunction methods.GetAttributes(self) local t = {} for k, v in pairs(data[self].attrs) do t[k] = v end return t end\nfunction methods.GetService(self, name)\n  local svc = methods.FindFirstChildOfClass(self, name)\n  if not svc then error(\"'\" .. tostr(name) .. \"' is not a valid Service name\", 2) end\n  return svc\nend\nmethods.FindService = methods.GetService\nfunction methods.GetPlayers(self)\n  local t = {}\n  for _, c in ipairs(data[self].children) do if data[c].class == \"Player\" then t[#t + 1] = c end end\n  return t\nend\nfunction methods.GetPlayerFromCharacter(self, char)\n  for _, c in ipairs(data[self].children) do\n    if data[c].class == \"Player\" and char ~= nil and data[c].props.Character == char then return c end\n  end\n  return nil\nend\nfunction methods.GetPlayerByUserId(self, id)\n  for _, c in ipairs(data[self].children) do if data[c].class == \"Player\" and data[c].props.UserId == id then return c end end\n  return nil\nend\nfunction methods.LoadCharacter(self) simlog(data[self].props.Name .. \" respawns\") end\nfunction methods.TakeDamage(self, amount)\n  if data[self].class ~= \"Humanoid\" then memberError(self, \"TakeDamage\") end\n  self.Health = data[self].props.Health - amount\nend\nfunction methods.Kick(self, msg) simlog(data[self].props.Name .. \" was kicked: \" .. tostr(msg or \"\")) setParent(self, nil) end\nfunction methods.Play(self, fade, weight, speed)\n  local r = data[self]\n  if r.class == \"Sound\" then\n    if r.props.SoundId == \"\" then emit(\"warn\", \"Sound \" .. r.props.Name .. \" has no SoundId, so nothing will be heard\", __clock) end\n    simlog(\"\\u{1F50A} Sound '\" .. r.props.Name .. \"' plays\")\n    r.props.Playing = true\n    fire(r.events.Played, r.props.SoundId)\n    r.playToken = (r.playToken or 0) + 1\n    local tok = r.playToken\n    if not r.props.Looped then task.delay(r.props.TimeLength / math.max(r.props.PlaybackSpeed, 0.01), function() if r.playToken == tok and r.props.Playing then r.props.Playing = false fire(r.events.Ended, r.props.SoundId) end end) end\n    return\n  end\n  if r.class == \"AnimationTrack\" then\n    if speed then r.props.Speed = speed end\n    r.props.IsPlaying = true\n    local owner = r.animOwner and data[r.animOwner] and data[r.animOwner].parent\n    local who = owner and data[owner] and data[owner].parent and data[data[owner].parent].props.Name or \"Rig\"\n    simlog(\"\\u{1F3AC} \" .. who .. \" plays animation '\" .. r.props.Name .. \"'\" .. (r.props.Looped and \" (looped)\" or \"\"))\n    if r.animOwner then fire(data[r.animOwner].events.AnimationPlayed, self) end\n    r.playToken = (r.playToken or 0) + 1\n    local tok = r.playToken\n    if not r.props.Looped then\n      task.delay(r.props.Length / math.max(math.abs(r.props.Speed), 0.01), function()\n        if r.playToken == tok and r.props.IsPlaying then r.props.IsPlaying = false fire(r.events.Stopped) fire(r.events.Ended) end\n      end)\n    end\n    return\n  end\n  if r.class == \"Tween\" then return end\n  memberError(self, \"Play\")\nend\nfunction methods.Stop(self)\n  local r = data[self]\n  if r.class == \"AnimationTrack\" then\n    if r.props.IsPlaying then r.props.IsPlaying = false r.playToken = (r.playToken or 0) + 1 fire(r.events.Stopped) end\n    return\n  end\n  r.props.Playing = false\nend\nfunction methods.AdjustSpeed(self, sp) data[self].props.Speed = sp end\nfunction methods.LoadAnimation(self, anim)\n  local r = data[self]\n  if r.class == \"Humanoid\" then emit(\"tip\", \"Humanoid:LoadAnimation is deprecated: use the Animator inside the Humanoid (humanoid.Animator:LoadAnimation)\", __clock) end\n  if r.class ~= \"Animator\" and r.class ~= \"Humanoid\" and r.class ~= \"AnimationController\" then memberError(self, \"LoadAnimation\") end\n  if anim == nil or data[anim] == nil or data[anim].class ~= \"Animation\" then error(\"LoadAnimation requires an Animation object\", 2) end\n  if data[anim].props.AnimationId == \"\" then error(\"Animation '\" .. data[anim].props.Name .. \"' has no AnimationId\", 2) end\n  local track = newInstance(\"AnimationTrack\", data[anim].props.Name)\n  data[track].animOwner = self\n  data[track].props.Animation = anim\n  local len = methods.GetAttribute(anim, \"Length\")\n  if len then data[track].props.Length = len end\n  return track\nend\nfunction methods.GetPlayingAnimationTracks(self) return {} end\nfunction methods.Emit(self, n)\n  local r = data[self]\n  if r.class ~= \"ParticleEmitter\" then memberError(self, \"Emit\") end\n  simlog(\"\\u{2728} \" .. (r.parent and data[r.parent].props.Name or \"?\") .. \" bursts \" .. tostr(n or 16) .. \" particles\")\nend\nfunction methods.PivotTo(self, cf)\n  local r = data[self]\n  if r.props.Position then self.CFrame = cf return end\n  local pp = r.props.PrimaryPart or methods.FindFirstChildWhichIsA(self, \"BasePart\", true)\n  if not pp then return end\n  local offset = cf * methods.GetPivot(self):Inverse()\n  for _, d in ipairs(methods.GetDescendants(self)) do\n    if data[d].props.Position then d.CFrame = offset * d.CFrame end\n  end\nend\nfunction methods.GetPivot(self)\n  local r = data[self]\n  if r.props.Position then return cfnew(r.props.Position, r.rot) end\n  local pp = r.props.PrimaryPart or methods.FindFirstChildWhichIsA(self, \"BasePart\", true)\n  if pp then return pp.CFrame end\n  return CFrame.new(0, 0, 0)\nend\nfunction methods.AddItem(self, item, t)\n  task.delay(t or 10, function() if data[item] and not data[item].destroyed then methods.Destroy(item) end end)\nend\nfunction methods.Create(self, inst, info, goals)\n  if data[self].class ~= \"TweenService\" then memberError(self, \"Create\") end\n  local tw = { Completed = newSignal(\"Completed\") }\n  function tw:Play()\n    simlog(\"Tween started on \" .. data[inst].props.Name .. \" (\" .. tostr(info and info.Time or 1) .. \"s)\")\n    task.delay(info and info.Time or 1, function()\n      for k, v in pairs(goals) do inst[k] = v end\n      fire(tw.Completed, Enum.PlaybackState.Completed)\n    end)\n  end\n  function tw:Cancel() end\n  return tw\nend\nfunction methods.Connect(self) error(\"Connect is a method of events, like part.Touched:Connect(...). Did you forget the event name?\", 2) end\n\nInstance = {}\nlocal creatable = {\n  Part = true, MeshPart = false, WedgePart = true, SpawnLocation = true, TrussPart = true, Model = true, Folder = true,\n  Configuration = true, IntValue = true, NumberValue = true, StringValue = true, BoolValue = true, ObjectValue = true,\n  Humanoid = true, Script = true, LocalScript = true, ModuleScript = true, Sound = true, PointLight = true,\n  Fire = true, Sparkles = true, Smoke = true, ParticleEmitter = true, ClickDetector = true, ProximityPrompt = true,\n  Decal = true, Attachment = true,\n  InputContext = true, InputAction = true, InputBinding = true, Animation = true, Animator = true, AnimationController = true,\n  Highlight = true, BillboardGui = true, SurfaceGui = true,\n  RemoteEvent = true, UnreliableRemoteEvent = true, RemoteFunction = true, BindableEvent = true, BindableFunction = true,\n  ScreenGui = true, Frame = true, TextLabel = true, TextButton = true, TextBox = true, ImageLabel = true, ImageButton = true,\n  UICorner = true, UIListLayout = true, UIStroke = true, Tool = true, Team = true,\n}\nfunction Instance.new(cls, parent)\n  if rawtype(cls) ~= \"string\" then error(\"invalid argument #1 to 'new' (string expected, got \" .. typeof(cls) .. \")\", 2) end\n  if not creatable[cls] then\n    if classes[cls] then error('Unable to create an Instance of type \"' .. cls .. '\"', 2) end\n    error('Unable to create an Instance of type \"' .. cls .. '\" (check the spelling and capital letters!)', 2)\n  end\n  local obj = newInstance(cls)\n  if parent ~= nil then setParent(obj, parent) end\n  return obj\nend\n\n-- ---------- The DataModel ----------\ngame = newInstance(\"DataModel\", \"Game\")\nworkspace = newInstance(\"Workspace\", \"Workspace\")\nsetParent(workspace, game)\nWorkspace = workspace\nfor _, svc in ipairs({ \"Players\", \"ServerScriptService\", \"ReplicatedStorage\", \"ServerStorage\", \"Lighting\", \"StarterGui\", \"StarterPlayer\", \"RunService\", \"TweenService\", \"Debris\", \"CollectionService\", \"DataStoreService\", \"HttpService\", \"Teams\", \"MarketplaceService\", \"SoundService\", \"UserInputService\", \"ContextActionService\", \"PathfindingService\", \"BadgeService\", \"StarterPack\" }) do\n  setParent(newInstance(svc, svc), game)\nend\nlocal Players = methods.GetService(game, \"Players\")\nlocal baseplate = newInstance(\"Part\", \"Baseplate\")\ndata[baseplate].props.Anchored = true\ndata[baseplate].props.Size = v3(512, 16, 512)\ndata[baseplate].props.Position = v3(0, -8, 0)\ndata[baseplate].props.Color = c3(91 / 255, 93 / 255, 105 / 255)\ndata[baseplate].props.Locked = true\nsetParent(baseplate, workspace)\nlocal spawn = newInstance(\"SpawnLocation\", \"SpawnLocation\")\ndata[spawn].props.Position = v3(0, 0.5, 0); data[spawn].props.Size = v3(12, 1, 12)\nsetParent(spawn, workspace)\n\nscript = newInstance(\"Script\", \"Script\")\nsetParent(script, methods.GetService(game, \"ServerScriptService\"))\n\n-- ---------- Advanced services & methods ----------\nlocal RunService = methods.GetService(game, \"RunService\")\nlocal CollectionService = methods.GetService(game, \"CollectionService\")\nlocal function argsToString(...)\n  local t = {}\n  for i = 1, select(\"#\", ...) do local v = select(i, ...) t[i] = rawtype(v) == \"string\" and ('\"' .. v .. '\"') or tostr(v) end\n  return table.concat(t, \", \")\nend\n-- give every player a PlayerGui + Backpack\ndata[Players].events.ChildAdded:Connect(function() end)\n\n-- RemoteEvents / RemoteFunctions / Bindables\nfunction methods.FireServer(self, ...)\n  local r = data[self]\n  if not r.events.OnServerEvent then memberError(self, \"FireServer\") end\n  local lp = data[Players].props.LocalPlayer\n  if not lp then error(\"FireServer can only be called from the client\", 2) end\n  simlog(\"\ud83d\udce1 \" .. data[lp].props.Name .. \"'s client \u2192 server: \" .. r.props.Name .. \":FireServer(\" .. argsToString(...) .. \")\")\n  fire(r.events.OnServerEvent, lp, ...)\nend\nfunction methods.FireClient(self, player, ...)\n  local r = data[self]\n  if not r.events.OnClientEvent then memberError(self, \"FireClient\") end\n  if player == nil or data[player] == nil or data[player].class ~= \"Player\" then error(\"FireClient: player argument must be a Player object\", 2) end\n  simlog(\"\ud83d\udce1 server \u2192 \" .. data[player].props.Name .. \"'s client: \" .. r.props.Name .. \"(\" .. argsToString(...) .. \")\")\n  local lp = data[Players].props.LocalPlayer\n  if lp == player then fire(r.events.OnClientEvent, ...) end\nend\nfunction methods.FireAllClients(self, ...)\n  local r = data[self]\n  if not r.events.OnClientEvent then memberError(self, \"FireAllClients\") end\n  simlog(\"\ud83d\udce1 server \u2192 ALL clients: \" .. r.props.Name .. \"(\" .. argsToString(...) .. \")\")\n  if data[Players].props.LocalPlayer then fire(r.events.OnClientEvent, ...) end\nend\nfunction methods.InvokeServer(self, ...)\n  local r = data[self]\n  if r.class ~= \"RemoteFunction\" then memberError(self, \"InvokeServer\") end\n  local lp = data[Players].props.LocalPlayer\n  if not lp then error(\"InvokeServer can only be called from the client\", 2) end\n  local cb = r.props.OnServerInvoke\n  if not cb then error(\"OnServerInvoke is not set on \" .. r.props.Name, 2) end\n  return cb(lp, ...)\nend\nfunction methods.Fire(self, ...)\n  local r = data[self]\n  if r.class ~= \"BindableEvent\" then memberError(self, \"Fire\") end\n  fire(r.events.Event, ...)\nend\nfunction methods.Invoke(self, ...)\n  local r = data[self]\n  if r.class ~= \"BindableFunction\" then memberError(self, \"Invoke\") end\n  if not r.props.OnInvoke then error(\"OnInvoke is not set\", 2) end\n  return r.props.OnInvoke(...)\nend\n\n-- Tags (CollectionService)\nlocal tagAdded, tagRemoved = {}, {}\nlocal function tagSig(tbl, tag) tbl[tag] = tbl[tag] or newSignal(\"Tag \" .. tag) return tbl[tag] end\nlocal function addTag(inst, tag) local r = data[inst] if not r.tags[tag] then r.tags[tag] = true fire(tagSig(tagAdded, tag), inst) end end\nlocal function removeTag(inst, tag) local r = data[inst] if r.tags[tag] then r.tags[tag] = nil fire(tagSig(tagRemoved, tag), inst) end end\nfunction methods.AddTag(self, a, b) if data[self].class == \"CollectionService\" then addTag(a, b) else addTag(self, a) end end\nfunction methods.RemoveTag(self, a, b) if data[self].class == \"CollectionService\" then removeTag(a, b) else removeTag(self, a) end end\nfunction methods.HasTag(self, a, b) if data[self].class == \"CollectionService\" then return data[a].tags[b] == true end return data[self].tags[a] == true end\nfunction methods.GetTags(self, a) local inst = data[self].class == \"CollectionService\" and a or self local t = {} for k in pairs(data[inst].tags) do t[#t + 1] = k end table.sort(t) return t end\nfunction methods.GetTagged(self, tag)\n  local out = {}\n  local function walk(o) for _, c in ipairs(data[o].children) do if data[c].tags[tag] then out[#out + 1] = c end walk(c) end end\n  walk(game)\n  return out\nend\nfunction methods.GetInstanceAddedSignal(self, tag) return tagSig(tagAdded, tag) end\nfunction methods.GetInstanceRemovedSignal(self, tag) return tagSig(tagRemoved, tag) end\n\n-- Heartbeat driver (30 fps in the sandbox)\nlocal hbRunning = false\nlocal function startHeartbeat()\n  if hbRunning then return end\n  hbRunning = true\n  task.defer(function()\n    local hb, st = data[RunService].events.Heartbeat, data[RunService].events.Stepped\n    local dt = 1 / 30\n    while #hb.__handlers > 0 or #st.__handlers > 0 do\n      fire(st, __clock, dt)\n      fire(hb, dt)\n      local co = coroutine.running()\n      schedule(co, __clock + dt)\n      coroutine.yield()\n    end\n    hbRunning = false\n  end)\nend\ndata[RunService].events.Heartbeat.__onConnect = startHeartbeat\ndata[RunService].events.Stepped.__onConnect = startHeartbeat\nfunction methods.IsServer() return data[Players].props.LocalPlayer == false end\nfunction methods.IsClient() return data[Players].props.LocalPlayer ~= false end\nfunction methods.IsStudio() return true end\n\n-- Raycasting (axis-aligned boxes; rotation ignored in this sandbox)\nlocal RRMT = { __tostring = function(r) return \"RaycastResult{\" .. tostr(r.Instance) .. \" @ \" .. tostr(r.Position) .. \"}\" end }\ntypeOfTag[RRMT] = \"RaycastResult\"\nlocal RPMT = { __tostring = function() return \"RaycastParams\" end }\ntypeOfTag[RPMT] = \"RaycastParams\"\nRaycastParams = { new = function() return setmt({ FilterDescendantsInstances = {}, FilterType = Enum.RaycastFilterType.Exclude, IgnoreWater = false, RespectCanCollide = false }, RPMT) end }\nlocal function inList(inst, list)\n  for _, f in ipairs(list) do if inst == f or methods.IsDescendantOf(inst, f) then return true end end\n  return false\nend\nfunction methods.Raycast(self, origin, dir, params)\n  if getmt(origin) ~= V3 or getmt(dir) ~= V3 then error(\"Raycast needs (origin: Vector3, direction: Vector3)\", 2) end\n  local filter = params and params.FilterDescendantsInstances or {}\n  local include = params and params.FilterType and params.FilterType.Name == \"Include\"\n  local bestT, bestInst, bestN = math.huge, nil, nil\n  for _, d in ipairs(methods.GetDescendants(self)) do\n    local r = data[d]\n    if isA(r.class, \"BasePart\") and r.props.CanQuery ~= false and not (params and params.RespectCanCollide and not r.props.CanCollide) then\n      local listed = inList(d, filter)\n      if (include and listed) or (not include and not listed) then\n        local p, s = r.props.Position, r.props.Size\n        local tmin, tmax, nrm = 0, 1, nil\n        local hit = true\n        for _, ax in ipairs({ \"X\", \"Y\", \"Z\" }) do\n          local o, dd, lo, hi = origin[ax], dir[ax], p[ax] - s[ax] / 2, p[ax] + s[ax] / 2\n          if math.abs(dd) < 1e-12 then\n            if o < lo or o > hi then hit = false break end\n          else\n            local t1, t2 = (lo - o) / dd, (hi - o) / dd\n            local n1 = -1\n            if t1 > t2 then t1, t2 = t2, t1; n1 = 1 end\n            if t1 > tmin then tmin = t1; nrm = { ax, n1 } end\n            if t2 < tmax then tmax = t2 end\n            if tmin > tmax then hit = false break end\n          end\n        end\n        if hit and tmin < bestT and nrm then bestT, bestInst, bestN = tmin, d, nrm end\n      end\n    end\n  end\n  if not bestInst then return nil end\n  local n = { X = 0, Y = 0, Z = 0 }; n[bestN[1]] = bestN[2]\n  local pos = origin + dir * bestT\n  return setmt({ Instance = bestInst, Position = pos, Normal = v3(n.X, n.Y, n.Z), Distance = dir.Magnitude * bestT, Material = data[bestInst].props.Material }, RRMT)\nend\n\n-- DataStores (in-memory, with optional simulated failures)\nlocal dsStores, dsFail, dsCalls = {}, 0, 0\nlocal function deepcopy(v, seen)\n  if rawtype(v) ~= \"table\" then return v end\n  if data[v] then error(\"Cannot store Instance in data store. Data stores can only accept valid UTF-8 characters.\", 4) end\n  local t = {}\n  for k, x in pairs(v) do\n    if rawtype(x) == \"function\" then error(\"Cannot store function in data store\", 4) end\n    t[deepcopy(k)] = deepcopy(x)\n  end\n  return t\nend\nlocal function dsRequest(store, what, key)\n  task.wait(0.1)\n  dsCalls = dsCalls + 1\n  if dsFail > 0 then\n    dsFail = dsFail - 1\n    simlog(\"\ud83d\udcbe \" .. what .. \"('\" .. tostr(key) .. \"') FAILED (simulated Roblox server hiccup)\")\n    error(\"502: API Services rejected request with error. HTTP 500 (Internal Server Error)\", 3)\n  end\n  simlog(\"\ud83d\udcbe \" .. store.__name .. \":\" .. what .. \"('\" .. tostr(key) .. \"')\")\nend\nlocal DSMT = { __index = {} }\ntypeOfTag[DSMT] = \"Instance\"\nDSMT.__tostring = function(s) return s.__name end\nfunction DSMT.__index:GetAsync(key)\n  dsRequest(self, \"GetAsync\", key)\n  return deepcopy(dsStores[self.__name][tostr(key)])\nend\nfunction DSMT.__index:SetAsync(key, value)\n  local copy = deepcopy(value)\n  dsRequest(self, \"SetAsync\", key)\n  dsStores[self.__name][tostr(key)] = copy\nend\nfunction DSMT.__index:UpdateAsync(key, fn)\n  dsRequest(self, \"UpdateAsync\", key)\n  local new = fn(deepcopy(dsStores[self.__name][tostr(key)]))\n  if new ~= nil then dsStores[self.__name][tostr(key)] = deepcopy(new) end\n  return deepcopy(new)\nend\nfunction DSMT.__index:IncrementAsync(key, delta)\n  dsRequest(self, \"IncrementAsync\", key)\n  local v = (dsStores[self.__name][tostr(key)] or 0) + (delta or 1)\n  dsStores[self.__name][tostr(key)] = v\n  return v\nend\nfunction DSMT.__index:RemoveAsync(key)\n  dsRequest(self, \"RemoveAsync\", key)\n  local old = dsStores[self.__name][tostr(key)]\n  dsStores[self.__name][tostr(key)] = nil\n  return old\nend\nfunction methods.GetDataStore(self, name, scope)\n  if data[self].class ~= \"DataStoreService\" then memberError(self, \"GetDataStore\") end\n  name = tostr(name) .. (scope and (\"/\" .. scope) or \"\")\n  dsStores[name] = dsStores[name] or {}\n  return setmt({ __name = name }, DSMT)\nend\nmethods.GetGlobalDataStore = function(self) return methods.GetDataStore(self, \"Global\") end\nfunction methods.GetRequestBudgetForRequestType() return 60 end\n\n-- BindToClose\nlocal closeFns = {}\nfunction methods.BindToClose(self, fn) closeFns[#closeFns + 1] = fn end\n\n-- HttpService JSON\nlocal function jsonEncode(v, depth)\n  depth = depth or 0\n  if depth > 50 then error(\"JSONEncode: table too deep\", 3) end\n  local t = rawtype(v)\n  if v == nil then return \"null\"\n  elseif t == \"boolean\" then return v and \"true\" or \"false\"\n  elseif t == \"number\" then return fmtnum(v)\n  elseif t == \"string\" then return '\"' .. v:gsub('[%c\"\\\\]', function(c) return string.format(\"\\\\u%04x\", c:byte()) end) .. '\"'\n  elseif t == \"table\" then\n    if #v > 0 or next(v) == nil then\n      local out = {}\n      for i = 1, #v do out[i] = jsonEncode(v[i], depth + 1) end\n      return \"[\" .. table.concat(out, \",\") .. \"]\"\n    end\n    local keys = {}\n    for k in pairs(v) do keys[#keys + 1] = tostr(k) end\n    table.sort(keys)\n    local out = {}\n    for _, k in ipairs(keys) do out[#out + 1] = '\"' .. k .. '\":' .. jsonEncode(v[k] ~= nil and v[k] or v[tonumber(k)], depth + 1) end\n    return \"{\" .. table.concat(out, \",\") .. \"}\"\n  end\n  error(\"JSONEncode: cannot encode \" .. t, 3)\nend\nfunction methods.JSONEncode(self, v) return jsonEncode(v) end\nfunction methods.JSONDecode(self, s)\n  local pos = 1\n  local function ws() pos = s:find(\"[^%s]\", pos) or #s + 1 end\n  local val\n  local function str()\n    local out, i = {}, pos + 1\n    while true do\n      local c = s:sub(i, i)\n      if c == \"\" then error(\"JSONDecode: unterminated string\", 4) end\n      if c == '\"' then pos = i + 1 break end\n      if c == \"\\\\\" then\n        local e = s:sub(i + 1, i + 1)\n        if e == \"u\" then out[#out + 1] = utf8.char(tonumber(s:sub(i + 2, i + 5), 16)) i = i + 6\n        else out[#out + 1] = ({ n = \"\\n\", t = \"\\t\", r = \"\\r\", b = \"\\b\", f = \"\\f\" })[e] or e i = i + 2 end\n      else out[#out + 1] = c i = i + 1 end\n    end\n    return table.concat(out)\n  end\n  function val()\n    ws()\n    local c = s:sub(pos, pos)\n    if c == \"{\" then\n      pos = pos + 1; local t = {}\n      ws(); if s:sub(pos, pos) == \"}\" then pos = pos + 1 return t end\n      while true do ws(); local k = str(); ws(); pos = pos + 1; t[k] = val(); ws()\n        local d = s:sub(pos, pos); pos = pos + 1\n        if d == \"}\" then return t end\n      end\n    elseif c == \"[\" then\n      pos = pos + 1; local t = {}\n      ws(); if s:sub(pos, pos) == \"]\" then pos = pos + 1 return t end\n      while true do t[#t + 1] = val(); ws()\n        local d = s:sub(pos, pos); pos = pos + 1\n        if d == \"]\" then return t end\n      end\n    elseif c == '\"' then return str()\n    elseif s:sub(pos, pos + 3) == \"true\" then pos = pos + 4 return true\n    elseif s:sub(pos, pos + 4) == \"false\" then pos = pos + 5 return false\n    elseif s:sub(pos, pos + 3) == \"null\" then pos = pos + 4 return nil\n    else\n      local n = s:match(\"^-?%d+%.?%d*[eE]?[-+]?%d*\", pos)\n      if not n or n == \"\" then error(\"JSONDecode: invalid JSON at position \" .. pos, 4) end\n      pos = pos + #n\n      return tonumber(n)\n    end\n  end\n  return val()\nend\nlocal guidN = 0\nfunction methods.GenerateGUID(self, braces)\n  guidN = guidN + 1\n  local g = string.format(\"%08X-0000-4000-8000-%012X\", 305419896 + guidN, guidN)\n  if braces == false then return g end\n  return \"{\" .. g .. \"}\"\nend\n\n-- ModuleScripts\nlocal realRequire = require\nfunction require(mod)\n  local r = mod ~= nil and data[mod]\n  if not r or r.class ~= \"ModuleScript\" then error(\"Attempted to call require with invalid argument(s).\", 2) end\n  if r.loaded then return r.value end\n  if r.loading then error(\"Recursive require detected for \" .. fullName(mod), 2) end\n  if not r.loader then error(\"Requested module was empty or broken: \" .. fullName(mod), 2) end\n  r.loading = true\n  local res = table.pack(r.loader())\n  r.loading = false\n  if res.n ~= 1 then error(\"Module code did not return exactly one value\", 2) end\n  r.loaded, r.value = true, res[1]\n  return res[1]\nend\n\n-- ---------- Input (UserInputService, ContextActionService, Input Action System) ----------\nlocal UIS = methods.GetService(game, \"UserInputService\")\nlocal keysDown = {}\nlocal casBinds = {}\nlocal InputObjMT = { __tostring = function(i) return \"InputObject(\" .. tostr(i.KeyCode) .. \")\" end }\ntypeOfTag[InputObjMT] = \"Instance\"\nfunction methods.IsKeyDown(self, kc) return keysDown[kc and kc.Name or \"\"] == true end\nfunction methods.GetKeysPressed(self) local t = {} for k in pairs(keysDown) do t[#t + 1] = { KeyCode = Enum.KeyCode[k] } end return t end\nfunction methods.GetMouseLocation() return Vector2.new(400, 300) end\nfunction methods.BindAction(self, name, fn, touchButton, ...)\n  if data[self].class ~= \"ContextActionService\" then memberError(self, \"BindAction\") end\n  casBinds[name] = { fn = fn, keys = { ... } }\nend\nfunction methods.UnbindAction(self, name) casBinds[name] = nil end\nfunction methods.GetState(self)\n  local r = data[self]\n  if r.class ~= \"InputAction\" then memberError(self, \"GetState\") end\n  return r.state or false\nend\nlocal function contextOf(inst)\n  local p = data[inst].parent\n  while p do if data[p].class == \"InputContext\" then return p end p = data[p].parent end\n  return nil\nend\nlocal function setActionState(action, on)\n  local r = data[action]\n  if not r.props.Enabled then return end\n  local ctx = contextOf(action)\n  if ctx and not data[ctx].props.Enabled then return end\n  if (r.state or false) == on then return end\n  r.state = on\n  if on then fire(r.events.Pressed) else fire(r.events.Released) end\n  fire(r.events.StateChanged, on)\nend\nlocal function pressKey(keyName, down, gp)\n  local kc = Enum.KeyCode[keyName]\n  local input = setmt({ KeyCode = kc, UserInputType = Enum.UserInputType.Keyboard, UserInputState = down and Enum.UserInputState.Begin or Enum.UserInputState.End, Position = v3(0, 0, 0) }, InputObjMT)\n  keysDown[keyName] = down or nil\n  fire(data[UIS].events[down and \"InputBegan\" or \"InputEnded\"], input, gp or false)\n  if not gp then\n    for name, b in pairs(casBinds) do\n      for _, k in ipairs(b.keys) do\n        if k == kc then\n          local co = coroutine.create(b.fn)\n          __resume(co, name, down and Enum.UserInputState.Begin or Enum.UserInputState.End, input)\n        end\n      end\n    end\n    for _, d in ipairs(methods.GetDescendants(game)) do\n      local r = data[d]\n      if r.class == \"InputBinding\" and r.props.KeyCode == kc and r.parent and data[r.parent].class == \"InputAction\" then\n        setActionState(r.parent, down)\n      end\n    end\n  end\nend\n\n-- ---------- Movement & pathfinding ----------\nlocal function charRoot(hum)\n  local char = data[hum].parent\n  return char, char and methods.FindFirstChild(char, \"HumanoidRootPart\")\nend\nlocal function moveModel(char, offset)\n  for _, d in ipairs(methods.GetDescendants(char)) do\n    if data[d].props.Position then data[d].props.Position = data[d].props.Position + offset end\n  end\nend\nfunction methods.MoveTo(self, pos, part)\n  local r = data[self]\n  if r.class ~= \"Humanoid\" then memberError(self, \"MoveTo\") end\n  if part and data[part] then pos = data[part].props.Position end\n  if getmt(pos) ~= V3 then error(\"MoveTo expects a Vector3 position\", 2) end\n  local char, root = charRoot(self)\n  if not root then return end\n  r.props.WalkToPoint = pos\n  r.moveId = (r.moveId or 0) + 1\n  local myId = r.moveId\n  local startP = data[root].props.Position\n  local flat = v3(pos.X - startP.X, 0, pos.Z - startP.Z)\n  local dist = flat.Magnitude\n  local speed = r.props.WalkSpeed\n  if speed <= 0 then return end\n  local t = dist / speed\n  local finishT = math.min(t, 8)\n  fire(r.events.Running, speed)\n  task.delay(finishT, function()\n    if r.moveId ~= myId or r.dead or not data[root].parent then return end\n    local frac = t > 0 and math.min(finishT / t, 1) or 1\n    local cur = data[root].props.Position\n    local target = v3(startP.X + flat.X * frac, frac >= 1 and (pos.Y + 3) or cur.Y, startP.Z + flat.Z * frac)\n    moveModel(char, target - cur)\n    if frac < 1 then simlog(data[char].props.Name .. \"'s MoveTo timed out after 8 seconds (didn't arrive)\") end\n    fire(r.events.MoveToFinished, frac >= 1)\n  end)\nend\nfunction methods.Move(self, dir) end\nfunction methods.ChangeState(self, st) simlog(data[data[self].parent].props.Name .. \" changes state to \" .. tostr(st)) end\n\nlocal WaypointMT = { __tostring = function(w) return \"PathWaypoint(\" .. tostr(w.Position) .. \")\" end }\ntypeOfTag[WaypointMT] = \"PathWaypoint\"\nfunction methods.CreatePath(self, params)\n  if data[self].class ~= \"PathfindingService\" then memberError(self, \"CreatePath\") end\n  local p = newInstance(\"Path\", \"Path\")\n  data[p].params = params or {}\n  return p\nend\nlocal function rayClear(a, b, exclude)\n  local rp = RaycastParams.new()\n  rp.FilterDescendantsInstances = exclude\n  local res = methods.Raycast(workspace, a, b - a, rp)\n  return res == nil, res\nend\nfunction methods.ComputeAsync(self, start, goal)\n  local r = data[self]\n  if r.class ~= \"Path\" then memberError(self, \"ComputeAsync\") end\n  if getmt(start) ~= V3 or getmt(goal) ~= V3 then error(\"ComputeAsync expects (start: Vector3, goal: Vector3)\", 2) end\n  task.wait(0.05)\n  local exclude = {}\n  for _, c in ipairs(data[workspace].children) do if methods.FindFirstChildOfClass(c, \"Humanoid\") then exclude[#exclude + 1] = c end end\n  local h = math.max(start.Y, 1.5)\n  local a, b = v3(start.X, h, start.Z), v3(goal.X, h, goal.Z)\n  local pts = { a }\n  local clear, hit = rayClear(a, b, exclude)\n  if not clear then\n    local obs = hit.Instance\n    local op, os_ = data[obs].props.Position, data[obs].props.Size\n    local dir = (b - a).Unit\n    local perp = v3(-dir.Z, 0, dir.X)\n    local margin = math.sqrt((os_.X / 2) ^ 2 + (os_.Z / 2) ^ 2) + (r.params.AgentRadius or 2) + 1\n    local best\n    for _, sgn in ipairs({ 1, -1 }) do\n      local mid = v3(op.X, h, op.Z) + perp * (margin * sgn)\n      local c1 = rayClear(a, mid, exclude)\n      local c2 = rayClear(mid, b, exclude)\n      if c1 and c2 then\n        local len = (mid - a).Magnitude + (b - mid).Magnitude\n        if not best or len < best.len then best = { p = mid, len = len } end\n      end\n    end\n    if not best then\n      r.props.Status = Enum.PathStatus.NoPath\n      r.waypoints = {}\n      return\n    end\n    pts[#pts + 1] = best.p\n  end\n  pts[#pts + 1] = b\n  local wps = {}\n  local function add(p) wps[#wps + 1] = setmt({ Position = v3(p.X, goal.Y, p.Z), Action = Enum.PathWaypointAction.Walk, Label = \"\" }, WaypointMT) end\n  add(pts[1])\n  for i = 2, #pts do\n    local s0, s1 = pts[i - 1], pts[i]\n    local n = math.max(1, math.ceil((s1 - s0).Magnitude / 4))\n    for k = 1, n do add(s0 + (s1 - s0) * (k / n)) end\n  end\n  r.waypoints = wps\n  r.props.Status = Enum.PathStatus.Success\nend\nfunction methods.GetWaypoints(self)\n  local r = data[self]\n  if r.class ~= \"Path\" then memberError(self, \"GetWaypoints\") end\n  local t = {}\n  for i, w in ipairs(r.waypoints or {}) do t[i] = w end\n  return t\nend\n\n-- ---------- Marketplace & badges ----------\nlocal MPS = methods.GetService(game, \"MarketplaceService\")\nlocal ownedPasses, pendingReceipts, receiptHandlers = {}, {}, {}\nfunction methods.UserOwnsGamePassAsync(self, userId, passId)\n  if data[self].class ~= \"MarketplaceService\" then memberError(self, \"UserOwnsGamePassAsync\") end\n  task.wait(0.05)\n  return (ownedPasses[userId] and ownedPasses[userId][passId]) == true\nend\nfunction methods.PromptGamePassPurchase(self, player, passId)\n  simlog(\"\\u{1F6D2} Purchase prompt for Game Pass \" .. tostr(passId) .. \" shown to \" .. data[player].props.Name)\nend\nfunction methods.PromptProductPurchase(self, player, productId)\n  simlog(\"\\u{1F6D2} Purchase prompt for Developer Product \" .. tostr(productId) .. \" shown to \" .. data[player].props.Name)\nend\nfunction methods.BindReceiptHandler(self, rtype, fn, filter)\n  receiptHandlers[#receiptHandlers + 1] = { fn = fn, filter = filter }\n  return setmt({ Connected = true, Disconnect = function() end }, ConnMT)\nend\nfunction methods.GetProductInfoAsync(self, id) return { Name = \"Product \" .. tostr(id), PriceInRobux = 25, ProductId = id } end\nfunction methods.AwardBadgeAsync(self, userId, badgeId)\n  task.wait(0.05)\n  simlog(\"\\u{1F3C5} Badge \" .. tostr(badgeId) .. \" awarded to user \" .. tostr(userId))\n  return true\nend\nfunction methods.UserHasBadgeAsync() task.wait(0.05) return false end\nlocal function deliverReceipt(receipt)\n  local co = coroutine.create(function()\n    local handler\n    for _, h in ipairs(receiptHandlers) do\n      if not h.filter or table.find(h.filter, receipt.ProductId) then handler = h.fn break end\n    end\n    local decision\n    if handler then\n      local ok, res = pcall(handler, receipt)\n      if not ok then emit(\"error\", tostr(res), __clock) end\n      decision = ok and res or nil\n    elseif data[MPS].props.ProcessReceipt then\n      local ok, res = pcall(data[MPS].props.ProcessReceipt, receipt)\n      if not ok then emit(\"error\", tostr(res), __clock) end\n      decision = ok and res or nil\n    else\n      simlog(\"No ProcessReceipt callback is set, so the purchase can't complete!\")\n    end\n    local granted = decision ~= nil and (decision.Name == \"PurchaseGranted\" or decision.Name == \"Processed\")\n    if granted then\n      simlog(\"\\u{2705} Roblox received \" .. tostr(decision) .. \" for purchase \" .. receipt.PurchaseId)\n    else\n      simlog(\"\\u{23F3} Not granted (\" .. tostr(decision) .. \"). Roblox will deliver this receipt again later.\")\n      pendingReceipts[#pendingReceipts + 1] = receipt\n    end\n  end)\n  __resume(co)\nend\n\n-- ---------- Tools ----------\nlocal StarterPack = methods.GetService(game, \"StarterPack\")\n\n-- ---------- Simulation helpers (used by lesson setups) ----------\n__sim = {}\nlocal nextUserId = 1000\nfunction __sim.part(name, props, parent)\n  local p = newInstance(\"Part\", name)\n  for k, v in pairs(props or {}) do data[p].props[k] = v end\n  if not (props and props.Anchored ~= nil) then data[p].props.Anchored = true end\n  setParent(p, parent or workspace)\n  return p\nend\nfunction __sim.scriptIn(obj) setParent(script, obj) end\nfunction __sim.addPlayer(name)\n  __sim.ids = __sim.ids or {}\n  if not __sim.ids[name] then nextUserId = nextUserId + 1; __sim.ids[name] = nextUserId end\n  local plr = newInstance(\"Player\", name)\n  data[plr].props.UserId = __sim.ids[name]\n  setParent(newInstance(\"PlayerGui\", \"PlayerGui\"), plr)\n  setParent(newInstance(\"Backpack\", \"Backpack\"), plr)\n  local bpk = methods.FindFirstChild(plr, \"Backpack\")\n  for _, t in ipairs(data[methods.GetService(game, \"StarterPack\")].children) do setParent(methods.Clone(t), bpk) end\n  local pg = methods.FindFirstChild(plr, \"PlayerGui\")\n  for _, g in ipairs(data[methods.GetService(game, \"StarterGui\")].children) do setParent(methods.Clone(g), pg) end\n  data[plr].props.DisplayName = name\n  simlog(name .. \" joined the game\")\n  setParent(plr, Players)\n  fire(data[Players].events.PlayerAdded, plr)\n  __sim.makeCharacter(plr)\n  return plr\nend\nfunction __sim.makeCharacter(plr)\n  local name = data[plr].props.Name\n  local char = newInstance(\"Model\", name)\n  for _, partName in ipairs({ \"Head\", \"UpperTorso\", \"LowerTorso\", \"LeftFoot\", \"RightFoot\", \"LeftHand\", \"RightHand\", \"HumanoidRootPart\" }) do\n    local bp = newInstance(\"Part\", partName)\n    data[bp].props.Size = v3(1, 1, 1)\n    local rl = data[plr].props.RespawnLocation\n    if rl and data[rl] and data[rl].props.Position and methods.IsDescendantOf(rl, workspace) then\n      data[bp].props.Position = data[rl].props.Position + v3(0, 3, 0)\n    else\n      data[bp].props.Position = v3(#methods.GetPlayers(Players) * 4 - 4, 3, 0)\n    end\n    setParent(bp, char)\n  end\n  local hum = newInstance(\"Humanoid\", \"Humanoid\")\n  data[hum].props.DisplayName = name\n  setParent(newInstance(\"Animator\", \"Animator\"), hum)\n  setParent(hum, char)\n  data[char].props.PrimaryPart = methods.FindFirstChild(char, \"HumanoidRootPart\")\n  data[plr].props.Character = char\n  setParent(char, workspace)\n  fire(data[plr].events.CharacterAdded, char)\n  return char\nend\nfunction __sim.getPlayer(name) return methods.FindFirstChild(Players, name) end\nfunction __sim.touch(part, who, limb)\n  if data[part] == nil or data[part].destroyed then simlog(\"(touch skipped, part no longer exists)\") return end\n  local toucher\n  if rawtype(who) == \"string\" then\n    local plr = methods.FindFirstChild(Players, who)\n    local char = plr and data[plr].props.Character\n    toucher = char and methods.FindFirstChild(char, limb or \"LeftFoot\")\n    if not toucher then simlog(who .. \" has no character\") return end\n    simlog(who .. \"'s \" .. (limb or \"LeftFoot\") .. \" touches \" .. data[part].props.Name)\n  else\n    toucher = who\n    simlog(data[toucher].props.Name .. \" touches \" .. data[part].props.Name)\n  end\n  if data[part].props.CanTouch == false then return end\n  fire(data[part].events.Touched, toucher)\nend\nfunction __sim.leave(name)\n  local plr = methods.FindFirstChild(Players, name)\n  if not plr then return end\n  simlog(name .. \" left the game\")\n  fire(data[Players].events.PlayerRemoving, plr)\n  local char = data[plr].props.Character\n  if char then methods.Destroy(char) end\n  setParent(plr, nil)\nend\nfunction __sim.click(obj, who)\n  local plr = methods.FindFirstChild(Players, who)\n  simlog(who .. \" clicks \" .. data[data[obj].parent].props.Name)\n  fire(data[obj].events.MouseClick, plr)\nend\nfunction __sim.prompt(obj, who)\n  local plr = methods.FindFirstChild(Players, who)\n  simlog(who .. \" uses the prompt on \" .. data[data[obj].parent].props.Name)\n  fire(data[obj].events.Triggered, plr)\nend\nfunction __sim.at(t, fn) task.delay(t, fn) end\nfunction __sim.where(name)\n  local plr = methods.FindFirstChild(Players, name)\n  local char = plr and data[plr].props.Character\n  local root = char and methods.FindFirstChild(char, \"HumanoidRootPart\")\n  return root and data[root].props.Position\nend\nfunction __sim.module(parent, name, loader)\n  local m = newInstance(\"ModuleScript\", name)\n  data[m].loader = loader\n  setParent(m, parent)\n  return m\nend\nfunction __sim.asClient(name)\n  local plr = methods.FindFirstChild(Players, name) or __sim.addPlayer(name)\n  data[Players].props.LocalPlayer = plr\n  return plr\nend\nfunction __sim.clientFire(remote, who, ...)\n  local plr = methods.FindFirstChild(Players, who)\n  simlog(\"\ud83d\udce1 \" .. who .. \"'s client \u2192 server: \" .. data[remote].props.Name .. \":FireServer(\" .. argsToString(...) .. \")\")\n  fire(data[remote].events.OnServerEvent, plr, ...)\nend\nfunction __sim.clientInvoke(remote, who, ...)\n  local plr = methods.FindFirstChild(Players, who)\n  simlog(\"\ud83d\udce1 \" .. who .. \"'s client \u2192 server: \" .. data[remote].props.Name .. \":InvokeServer(\" .. argsToString(...) .. \")\")\n  local cb = data[remote].props.OnServerInvoke\n  if not cb then simlog(\"(no OnServerInvoke set, so the client would wait forever!)\") return end\n  local res = table.pack(pcall(cb, plr, ...))\n  if res[1] then simlog(\"\ud83d\udce1 server \u2192 \" .. who .. \": returned \" .. argsToString(table.unpack(res, 2, res.n)))\n  else emit(\"error\", tostr(res[2]), __clock) end\nend\nfunction __sim.clickButton(btn, who)\n  simlog((who or \"Player\") .. \" clicks \" .. data[btn].props.Name)\n  fire(data[btn].events.MouseButton1Click)\n  fire(data[btn].events.Activated)\nend\nfunction __sim.failDataStore(n) dsFail = n end\nfunction __sim.key(keyName, hold, gp)\n  simlog(\"\\u{2328}\\u{FE0F} Player presses \" .. keyName .. (gp and \" (while typing in chat)\" or \"\"))\n  pressKey(keyName, true, gp)\n  task.delay(hold or 0.2, function() pressKey(keyName, false, gp) end)\nend\nfunction __sim.typeText(box, text)\n  simlog(\"Player types '\" .. text .. \"' and presses Enter\")\n  data[box].props.Text = text\n  fire(data[box].events.FocusLost, true)\nend\nfunc LESSONS.push({
  id: "l6", num: 6, title: "Functions", subtitle: "Packaging code you can reuse: parameters and return",

    { type: "text", html: `<p class="lead">Say you need to reward a player in 5 different places in your game: finishing a level, killing a boss, finding a secret… Copying the same 4 lines 5 times is messy, and if you want to change the reward you'd have to edit all 5. A <b>function</b> is a named chunk of code you write <b>once</b> and run (\"call\") whenever you want.</p>` },

    { type: "example", title: "Worked example: define, then call", code: `local function greet()

        2: "The body: the code that will run each time the function is called.",
        4: "<code>end</code> finishes the definition.",

    { type: "box", kind: "analogy", title: "Mental model: a doorbell", html: `<p>An event is a <b>doorbell</b>. <code>:Connect(myFunction)</code> means <i>\"whenever the doorbell rings, run myFunction.\"</i> Your script connects it once, and then the function runs every time the event happens, even long after the rest of the script has finished.</p>` },
    { type: "example", title: "Worked example: a part that reacts to touch", setup: `__sim.part("Button", {Position = Vector3.new(0, 0.5, 0), Size = Vector3.new(4, 1, 4), Color = Color3.fromRGB(0, 200, 0)})

    { type: "text", html: `<h3>From "a foot" to "a player"</h3><p>When a player touches a part, <code>otherPart</code> is a body part (like <code>LeftFoot</code>). Its <b>Parent</b> is the player's <b>character</b> model, which contains a <b>Humanoid</b>: the object with <code>Health</code>, <code>WalkSpeed</code> and so on.</p>

      solution: `local Players = game:GetService("Players")

-- 1) leaderstats for each player

LESSONS.push({
  id: "l11", num: 11, tier: "Intermediate", title: "Errors & pcall", subtitle: "Handling things that can fail: error, assert, pcall, retries",
  icon: "🛡️",
  steps: [
    { type: "text", html: `<p class="lead">In a real game, things fail that aren't your fault: Roblox's save servers have a hiccup, a player leaves halfway through a function, a part gets deleted. An error <b>stops the function it happens in</b>. In this lesson you'll learn to <b>expect</b> failure and handle it like a pro.</p>` },
    { type: "predict", id: "l11-p1", prompt: "What appears in the Output?",
      code: `print("A")
local part = workspace:FindFirstChild("Missing")
print(part.Name)
print("B")`,
      options: ["A<br>B", "A<br>(red error)", "(red error) only", "A<br>nil<br>B"], answer: 1,
      explain: "Line 3 tries to index <code>nil</code>, so the script <b>stops right there</b>. \"B\" never prints. One unhandled error can break a whole feature of your game." },
    { type: "why", title: "Why use pcall?", html: `<p><code>pcall</code> (\"protected call\") runs a function in a <b>safety bubble</b>. If an error happens inside, your script <i>doesn't</i> crash. Instead you get back <code>false</code> plus the error message, and you decide what to do. You need it for: <b>saving/loading data</b> (DataStores can fail), <b>web requests</b>, <b>purchases</b>, and any code that touches objects that might disappear.</p>` },
    { type: "example", title: "Worked example: pcall", code: `local ok, result = pcall(function()
    return 10 * 2
end)
print(ok, result)

local ok2, err = pcall(function()
    local part = nil
    return part.Name
end)
print(ok2, err)
print("The script is still running!")`,
      notes: {
        1: "<code>pcall(fn)</code> runs <code>fn</code> safely. It returns <b>two</b> things: did it succeed (<code>true</code>/<code>false</code>), and then either the return value or the error message.",
        4: "Success: <code>true 20</code>.",
        8: "This line errors…",
        10: "…but pcall catches it: <code>false</code> plus the message.",
        11: "The script keeps running. That's the whole point."
      }, run: true },
    { type: "example", title: "Worked example: raising your own errors with error() and assert()", code: `local function buyItem(price, coins)
    if type(price) ~= "number" then
        error("price must be a number")
    end
    assert(coins >= price, "Not enough coins!")
    return coins - price
end

print(pcall(buyItem, 50, 100))
print(pcall(buyItem, 500, 100))
print(pcall(buyItem, "free", 100))`,
      notes: {
        3: "<code>error(message)</code> stops the function on purpose. <b>Why?</b> To refuse bad input loudly instead of carrying on with broken data.",
        5: "<code>assert(condition, message)</code> is a shortcut: \"if this isn't true, error with this message\". Great for checking assumptions.",
        9: "You can pass the function and its arguments straight to pcall: <code>pcall(fn, arg1, arg2)</code>.",
        10: "Fails the assert: <code>false</code> + \"Not enough coins!\"",
        11: "Fails the type check."
      }, run: true },
    { type: "predict", id: "l11-p2", prompt: "What does this print?",
      code: `local ok, value = pcall(function()
    error("boom")
    return 5
end)
