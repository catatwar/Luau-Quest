      options: ["true false", "false false", "false true", "Error, script stops"], answer: 1,
      explain: "<code>error</code> stops the function before <code>return 5</code>, so ok is false. But <code>value</code> isn't nil: it holds the <b>error message</b> (\"...: boom\"), so <code>value == nil</code> is false." },
    { type: "text", html: `<h3>The retry pattern</h3><p>Roblox's own servers (DataStores especially) sometimes fail for a second. Pros <b>retry</b> a few times with a short wait before giving up. In this sandbox, the DataStore below is set to fail the first 2 times.</p>` },
    { type: "example", title: "Worked example: retry with pcall", setup: `__sim.failDataStore(2)`,
      code: `local DataStoreService = game:GetService("DataStoreService")
local store = DataStoreService:GetDataStore("PlayerData")

local function getWithRetry(key)
    for attempt = 1, 3 do
        local ok, result = pcall(function()
            return store:GetAsync(key)
        end)
        if ok then
            return true, result
        end
        warn("Attempt " .. attempt .. " failed: " .. tostring(result))
        task.wait(1)
    end
    return false, nil
end

local ok, data = getWithRetry("Player_1")
print("Loaded?", ok)`,
      notes: {
        5: "Try up to 3 times.",
        6: "Wrap the risky call in pcall.",
        9: "It worked, so return straight away (this also exits the loop).",
        12: "<code>warn</code> prints in orange. Use it for problems that aren't crashes.",
        13: "Wait a moment before retrying. Hammering a failing server instantly doesn't help.",
        16: "All attempts failed. Report it so the caller can decide what to do."
      }, run: true },
    { type: "code", id: "l11-make", title: "Make: a safe divide",
      task: `Write <code>safeDivide(a, b)</code> that uses <code>error()</code> if <code>b</code> is 0 (message: <code>"Can't divide by zero"</code>). Then call it with <b>pcall</b> twice, with <code>(10, 2)</code> and <code>(5, 0)</code>, and print a friendly message for each: <code>Result: 5</code> or <code>Failed: ...</code>. The script must not crash.`,
      starter: `local function safeDivide(a, b)

end

`,
      checks: [
        { label: "Uses error()", test: function (r, c) { return code_(c, /\berror\s*\(/); } },
        { label: "Uses pcall", test: function (r, c) { return code_(c, /pcall\s*\(/); } },
        { label: "Prints Result: 5", test: function (r) { return printed(r, /Result:?\s*5\b/); } },
        { label: "Prints a Failed message mentioning zero", test: function (r) { return printed(r, /Failed.*zero/i); } },
        { label: "No uncaught errors", test: noErr }

      hints: ["Inside: <code>if b == 0 then error(\"Can't divide by zero\") end</code>, then <code>return a / b</code>.", "<code>local ok, res = pcall(safeDivide, 10, 2)</code>, then <code>if ok then print(\"Result: \" .. res) else print(\"Failed: \" .. res) end</code>"],
      solution: `local function safeDivide(a, b)
    if b == 0 then
        error("Can't divide by zero")
    end
    return a / b
end

for _, pair in ipairs({{10, 2}, {5, 0}}) do
    local ok, res = pcall(safeDivide, pair[1], pair[2])

    end
end` },
    { type: "box", kind: "tip", title: "xpcall and stack traces", html: `<p><code>xpcall(fn, handler)</code> is like pcall but calls <code>handler(err)</code> when something fails. Pair it with <code>debug.traceback</code> to log <i>where</i> the error happened: <code>xpcall(fn, function(e) warn(debug.traceback(e)) end)</code>.</p>` },
    { type: "box", kind: "warn", title: "Don't pcall everything", html: `<p>pcall hides errors, and hidden errors are hard to find. Use it around things that <b>can fail for reasons outside your code</b> (data saving, web calls, purchases, teleports). For your own logic bugs, you <i>want</i> the red error so you can fix the code.</p>` },
    { type: "quiz", id: "l11-q", title: "Check your understanding", questions: [
      { q: "What does <code>pcall</code> return when the function errors?", options: ["nil", "false and the error message", "true and nil", "It crashes"], answer: 1, explain: "First value: success (false). Second: the error message." },
      { q: "Which situation most needs pcall?", options: ["print(\"hi\")", "Adding two numbers", "Loading a player's saved data from a DataStore", "Creating a local variable"], answer: 2, explain: "DataStore calls go over the network to Roblox's servers and can fail through no fault of yours." },
      { q: "<code>assert(x > 0, \"bad\")</code> when x is -1:", options: ["Prints bad", "Errors with message bad", "Returns false", "Nothing"], answer: 1, explain: "assert raises an error with the message if the condition is falsy." },
      { q: "Why wait between retries?", options: ["To look professional", "Instant retries usually hit the same temporary problem; a short wait gives the server time to recover and respects rate limits", "Lua requires it", "It's slower on purpose"], answer: 1, explain: "Backing off is kinder to the service and more likely to succeed." }
    ] },
    { type: "reflect", id: "l11-r", prompt: "Explain when you <i>should</i> and <i>shouldn't</i> use pcall, with one example of each.", model: "Use pcall around calls that can fail for outside reasons, like DataStore GetAsync/SetAsync, HTTP requests or MarketplaceService, so one failure doesn't crash your system and you can retry or warn. Don't wrap your own logic (math, property changes) in pcall just to hide errors, because hidden bugs are much harder to find and fix." }
  ]
});

    { type: "text", html: `<p class="lead">A Roblox game runs on <b>one server</b> (Roblox's computer) and on <b>every player's device</b> (each one is a <b>client</b>). Knowing which side your code runs on is the difference between a working game and an exploitable or broken one.</p>
<table class="tbl"><tr><th>Script type</th><th>Runs on</th><th>Put it in</th><th>Use it for</th></tr>
<tr><td><b>Script</b></td><td>Server</td><td>ServerScriptService (or Workspace)</td><td>Game rules, money, damage, saving data: anything that must be trusted</td></tr>
<tr><td><b>LocalScript</b></td><td>One player's device</td><td>StarterPlayerScripts, StarterGui, StarterCharacterScripts</td><td>GUI, camera, keyboard and mouse input, local effects</td></tr>
<tr><td><b>ModuleScript</b></td><td>Whoever <code>require</code>s it</td><td>ReplicatedStorage (shared) or ServerScriptService (server-only)</td><td>Reusable code (next lesson)</td></tr></table>

    { type: "text", html: `<h3>RemoteEvents: how the client asks the server for something</h3><p>A <b>RemoteEvent</b> (usually kept in ReplicatedStorage so both sides can see it) is a one-way message: <code>remote:FireServer(...)</code> on the client triggers <code>remote.OnServerEvent</code> on the server. <b>Roblox automatically adds the player who sent it as the first argument</b>, and that's the only argument you can fully trust.</p>` },

__sim.at(9, function() local h = game.Players.Hax __sim.log("Hax has " .. #h.Inventory:GetChildren() .. " item(s), " .. h.leaderstats.Coins.Value .. " coins") local a = game.Players.Ana __sim.log("Ana has " .. #a.Inventory:GetChildren() .. " item(s), " .. a.leaderstats.Coins.Value .. " coins") end)`,
      task: `Write the server handler for <code>BuyItem</code>. Players start with 100 coins and an <code>Inventory</code> folder. The server's price list is given. Rules:
<ul><li>Use the <b>server's</b> price and ignore anything else the client sends.</li><li>Ignore items that don't exist or aren't strings.</li><li>Only buy if they can afford it. Then subtract the price and add a <code>StringValue</code> named after the item to their Inventory.</li><li><b>Rate limit:</b> at most one purchase per player per second (use a table <code>lastBuy[player]</code>).</li></ul>
<p class="small">The simulation: Ana buys a Sword legitimately. Hax tries to buy the 500-coin Crown by sending a price of −1000, then tries a fake item and a number, then spams 5 Potions in the same instant. Expected: <b>Ana has 1 item and 40 coins. Hax has 1 item (one Potion) and 90 coins.</b></p>`,
      starter: `local ReplicatedStorage = game:GetService("ReplicatedStorage")
local buyItem = ReplicatedStorage.BuyItem

local PRICES = {
    Sword = 60,
    Potion = 10,
    Crown = 500,
}
local lastBuy = {}

buyItem.OnServerEvent:Connect(function(player, itemName)
    -- your checks here
end)`,
      checks: [
        { label: "Ana ends with 1 item and 40 coins", test: function (r) { return logged(r, /Ana has 1 item\(s\), 40 coins/); } },
        { label: "Hax ends with exactly 1 item and 90 coins", test: function (r) { return logged(r, /Hax has 1 item\(s\), 90 coins/); } },
        { label: "Uses typeof or type to check the item name", test: function (r, c) { return code_(c, /typeof\s*\(\s*itemName\s*\)|type\s*\(\s*itemName\s*\)/); } },
        { label: "No errors (fake items must not crash the handler)", test: noErr }
      ],
      hints: ["Start with guard clauses: <code>if typeof(itemName) ~= \"string\" then return end</code>, then <code>local price = PRICES[itemName]</code> and <code>if not price then return end</code>.", "Rate limit: <code>local now = os.clock()</code>, <code>if lastBuy[player] and now - lastBuy[player] &lt; 1 then return end</code>, <code>lastBuy[player] = now</code>.", "Afford check, then <code>coins.Value -= price</code> and create <code>Instance.new(\"StringValue\")</code> with <code>Name = itemName</code>, parented to <code>player.Inventory</code>."],
      solution: `local ReplicatedStorage = game:GetService("ReplicatedStorage")
local buyItem = ReplicatedStorage.BuyItem

local PRICES = {
    Sword = 60,
    Potion = 10,
    Crown = 500,
}
local lastBuy = {}

buyItem.OnServerEvent:Connect(function(player, itemName)
    -- 1) type check: the client can send anything
    if typeof(itemName) ~= "string" then return end
    -- 2) does it exist? (price comes from the SERVER)
    local price = PRICES[itemName]
    if not price then return end
    -- 3) rate limit
    local now = os.clock()
    if lastBuy[player] and now - lastBuy[player] < 1 then return end
    lastBuy[player] = now
    -- 4) can they afford it?
    local coins = player.leaderstats.Coins
    if coins.Value < price then return end
    -- 5) do it
    coins.Value -= price
    local item = Instance.new("StringValue")
    item.Name = itemName
    item.Parent = player.Inventory
    print(player.Name .. " bought " .. itemName)
end)

game:GetService("Players").PlayerRemoving:Connect(function(player)
    lastBuy[player] = nil -- clean up (the Tags & Clean-up lesson explains why)
end)` },
    { type: "example", title: "Worked example: RemoteFunction (ask and get an answer)",
      setup: `local rf = Instance.new("RemoteFunction") rf.Name = "GetShopPrices" rf.Parent = game.ReplicatedStorage`,
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") end)
__sim.at(2, function() __sim.clientInvoke(game.ReplicatedStorage.GetShopPrices, "Ana") end)`,
      code: `local getPrices = game.ReplicatedStorage.GetShopPrices
local PRICES = {Sword = 60, Potion = 10}

getPrices.OnServerInvoke = function(player)
    return PRICES
end`,
      notes: {
        4: "A <b>RemoteFunction</b> is a two-way question: the client calls <code>InvokeServer()</code> and <b>waits</b> for the answer. On the server, you <i>assign</i> a function to <code>OnServerInvoke</code> (you don't Connect it).",
        5: "Whatever you return goes back to the client. <b>Why use it?</b> When the client needs information from the server, like shop prices or its own stats."
      }, run: true },
    { type: "box", kind: "warn", title: "Never use InvokeClient on the server", html: `<p>The server <i>could</i> ask a client a question with <code>InvokeClient</code>, but an exploiter can simply never answer, leaving your server code stuck forever. Use RemoteEvents for server→client messages.</p>` },
    { type: "quiz", id: "l12-q", title: "Check your understanding", questions: [
      { q: "Where should the code that gives coins live?", options: ["LocalScript in StarterGui", "Script on the server", "Either works", "In the Toolbox"], answer: 1, explain: "Money must be decided by the server. Client changes don't replicate, and the client can't be trusted." },
      { q: "On the server, what is the first parameter of an OnServerEvent handler?", options: ["The first value the client sent", "The Player who fired it (added automatically by Roblox)", "The RemoteEvent", "nil"], answer: 1, explain: "Roblox inserts the sending player. Everything after it comes from the client." },
      { q: "Which is a GOOD way to handle damage from a sword?", options: ["Client sends 'damage = 50' and the server applies it", "The server checks the attacker has the sword, is close enough to the target and isn't on cooldown, then applies the server's damage value", "LocalScript lowers the target's health", "Trust the client if they're VIP"], answer: 1, explain: "Validate everything on the server, with server-side numbers." },
      { q: "Players.LocalPlayer in a server Script is…", options: ["The first player", "nil (it only exists on clients)", "The server owner", "Every player"], answer: 1, explain: "The server has no 'local' player. It serves everyone." },
      { q: "When should you use a RemoteFunction instead of a RemoteEvent?", options: ["Always", "When the client needs an answer back from the server", "When the server needs an answer from the client", "Never"], answer: 1, explain: "Client→server questions with an answer. Avoid server→client InvokeClient." }
    ] },
    { type: "reflect", id: "l12-r", prompt: "Explain to a friend why you can't just let a LocalScript add coins when a player clicks \"Buy\". What should happen instead?", model: "LocalScripts run on the player's device, which the player controls, and their changes don't replicate to the server anyway. Exploiters can run any code they like there. Instead, the client fires a RemoteEvent with only the item name. The server checks the type, looks up the real price itself, checks the player can afford it and isn't spamming, then changes the coins and gives the item." }
  ]
});

LESSONS.push({
  id: "l13", num: 13, tier: "Intermediate", title: "ModuleScripts", subtitle: "Sharing and organizing code with require()",
  icon: "📚",
  steps: [
    { type: "text", html: `<p class="lead">As games grow, you'll want the same functions and settings in many scripts. Copy-pasting means fixing every bug 10 times. A <b>ModuleScript</b> is a script that <b>returns a value</b> (usually a table of functions or settings), and any other script can load it with <code>require()</code>.</p>` },
    { type: "why", title: "Why use ModuleScripts?", html: `<ul><li><b>No duplicate code</b>: write a function once and use it everywhere.</li><li><b>One place for settings</b>: put round length, prices and damage values in a Config module, so balancing your game means editing one file.</li><li><b>Share between server and client</b>: a module in ReplicatedStorage can be required by both.</li><li><b>Organization</b>: big games are mostly modules, with a few small scripts that start everything up.</li></ul>` },
    { type: "code", id: "l13-ex", title: "Investigate: a module and a script", free: true,
      files: [{ parent: "ReplicatedStorage", name: "GameConfig", starter: `local GameConfig = {}

GameConfig.ROUND_LENGTH = 60
GameConfig.START_COINS = 100

function GameConfig.formatCoins(amount)
    return amount .. " 🪙"
end

return GameConfig` }],
      mainLabel: "ServerScriptService.Script",
      task: `This exercise has <b>two files</b>: click the tabs to switch between them. The ModuleScript builds a table and <code>return</code>s it. The Script <code>require</code>s it and uses what's inside. Run it, then change <code>START_COINS</code> in the module and run again.`,
      starter: `local ReplicatedStorage = game:GetService("ReplicatedStorage")
local GameConfig = require(ReplicatedStorage.GameConfig)

print("Round length: " .. GameConfig.ROUND_LENGTH)
print(GameConfig.formatCoins(GameConfig.START_COINS))`,
      checks: [{ label: "Runs without errors", test: noErr }] },
    { type: "predict", id: "l13-p1", prompt: "Two scripts require the same module. How many times does <code>\"Module loading!\"</code> print?",
      setup: `__sim.module(game.ReplicatedStorage, "Counter", function()
  print("Module loading!")
  local M = {count = 0}
  function M.add() M.count += 1 return M.count end
  return M
end)`,
      code: `local Counter1 = require(game.ReplicatedStorage.Counter)
local Counter2 = require(game.ReplicatedStorage.Counter)
Counter1.add()
Counter2.add()
print(Counter1.count, Counter1 == Counter2)`,
      options: ["Twice, then 1 false", "Once, then 2 true", "Once, then 1 true", "Twice, then 2 true"], answer: 1,
      explain: "A module's code runs <b>only the first time</b> it's required. After that, every <code>require</code> returns the <b>same table</b>. That's why modules are great for shared state, like a list of active players that several scripts need." },
    { type: "code", id: "l13-make", title: "Make: a utility module",
      files: [{ parent: "ReplicatedStorage", name: "MathUtils", starter: `local MathUtils = {}

-- round(n, decimals): round(3.14159, 2) -> 3.14

-- lerp(a, b, t): blend from a to b; lerp(0, 10, 0.5) -> 5

-- formatTime(seconds): formatTime(75) -> "1:15", formatTime(9) -> "0:09"

return MathUtils`, solution: `local MathUtils = {}

function MathUtils.round(n, decimals)
    local m = 10 ^ (decimals or 0)
    return math.floor(n * m + 0.5) / m
end

function MathUtils.lerp(a, b, t)
    return a + (b - a) * t
end

function MathUtils.formatTime(seconds)
    local mins = math.floor(seconds / 60)
    local secs = seconds % 60
    return string.format("%d:%02d", mins, secs)
end

return MathUtils` }],
      mainLabel: "ServerScriptService.Script",
      task: `Fill in the <b>MathUtils</b> module tab with three functions: <code>round</code>, <code>lerp</code> and <code>formatTime</code>. The Script tab already tests them.<br><span class="small">Tip: <code>string.format("%d:%02d", mins, secs)</code> pads seconds to 2 digits.</span>`,
      starter: `local MathUtils = require(game.ReplicatedStorage.MathUtils)

print(MathUtils.round(3.14159, 2))
print(MathUtils.lerp(0, 10, 0.5))
print(MathUtils.formatTime(75))
print(MathUtils.formatTime(9))`,
      checks: [
        { label: "round(3.14159, 2) gives 3.14", test: function (r) { return P(r)[0] === "3.14"; } },
        { label: "lerp(0, 10, 0.5) gives 5", test: function (r) { return P(r)[1] === "5"; } },
        { label: "formatTime(75) gives 1:15", test: function (r) { return P(r)[2] === "1:15"; } },
        { label: "formatTime(9) gives 0:09", test: function (r) { return P(r)[3] === "0:09"; } }
      ],
      hints: ["Functions in a module look like <code>function MathUtils.lerp(a, b, t) return a + (b - a) * t end</code>.", "Rounding to decimals: multiply by <code>10 ^ decimals</code>, round, then divide back.", "formatTime: <code>math.floor(seconds / 60)</code> minutes and <code>seconds % 60</code> seconds."],
      solution: `local MathUtils = require(game.ReplicatedStorage.MathUtils)

print(MathUtils.round(3.14159, 2))
print(MathUtils.lerp(0, 10, 0.5))
print(MathUtils.formatTime(75))
print(MathUtils.formatTime(9))` },
    { type: "box", kind: "tip", title: "Where to put modules", html: `<ul><li><b>ReplicatedStorage</b>: shared code that both server and client need (config, utilities, shared types).</li><li><b>ServerScriptService / ServerStorage</b>: server-only code (data saving, anti-cheat, admin tools). <b>Clients can't see these</b>, so secrets stay safe.</li></ul>` },
    { type: "box", kind: "new", title: "Beta: export (Nov 2026)", html: `<p>Studio has a new beta feature that lets modules write <code>export function foo()</code> instead of building and returning a table. It's still in beta, so learn the classic <code>local M = {} ... return M</code> pattern first. That's what nearly all existing code uses.</p>` },
    { type: "quiz", id: "l13-q", title: "Check your understanding", questions: [
      { q: "What must a ModuleScript do at the end?", options: ["print something", "return exactly one value (usually a table)", "call require", "Nothing"], answer: 1, explain: "Otherwise you'll get \"Module code did not return exactly one value\"." },
      { q: "A module is required by 5 scripts. How many times does its top-level code run (on the same machine)?", options: ["5", "1", "0", "Every frame"], answer: 1, explain: "Once. The result is cached and shared." },
      { q: "Where should an anti-cheat module go?", options: ["ReplicatedStorage", "ServerScriptService or ServerStorage", "StarterGui", "Workspace"], answer: 1, explain: "Server-only places, so exploiters can't read how it works." },
      { q: "Best reason to make a Config module?", options: ["It runs faster", "All your tweakable numbers live in one place", "Roblox requires it", "It hides code from players"], answer: 1, explain: "Balancing and changing your game becomes a one-file edit." }
    ] },
    { type: "reflect", id: "l13-r", prompt: "Explain why requiring a module twice gives you the <i>same</i> table, and one way you could use that on purpose.", model: "require runs the module's code only the first time, caches the returned value, and hands the same table to everyone after that. You can use that for shared state, e.g. a PlayerData module whose table holds every player's loaded data, so the shop script and the saving script both see the same data." }
  ]
});

LESSONS.push({
  id: "l14", num: 14, tier: "Intermediate", title: "OOP with Metatables", subtitle: "Classes, objects, self, and inheritance",
  icon: "🧬",
  steps: [
    { type: "text", html: `<p class="lead">Your game has 30 enemies. Each one has its own health and name, but they all <b>behave</b> the same way (take damage, die, drop loot). <b>Object-Oriented Programming (OOP)</b> lets you write that behaviour once in a <b>class</b>, then create as many <b>objects</b> as you need, each with its own data.</p>` },
    { type: "why", title: "Why use OOP?", html: `<ul><li>Keeps <b>data and the functions that use it together</b> (an enemy's health next to its TakeDamage).</li><li>Make <b>many independent copies</b> easily: <code>Enemy.new("Goblin")</code>, <code>Enemy.new("Orc")</code>.</li><li>Share and extend behaviour with <b>inheritance</b> (a Boss is an Enemy with extra moves).</li><li>It's how most big Roblox games, and popular community modules, are organized.</li></ul>` },
    { type: "example", title: "Worked example: methods, the colon, and self", code: `local dog = {Name = "Rex", Energy = 3}

function dog:Bark()
    print(self.Name .. " says woof!")
    self.Energy -= 1
end

dog:Bark()
dog:Bark()
print(dog.Energy)`,
      notes: {
        3: "<code>function dog:Bark()</code> with a <b>colon</b> automatically adds a hidden first parameter called <code>self</code>.",
        4: "<code>self</code> is <b>whichever table the method was called on</b>, so the same code can work for any dog.",
        8: "<code>dog:Bark()</code> is shorthand for <code>dog.Bark(dog)</code>: the colon passes the table in as <code>self</code>.",
        10: "Energy went 3 → 2 → 1."
      }, run: true },
    { type: "predict", id: "l14-p1", prompt: "Oops: a dot instead of a colon. What happens?",
      code: `local cat = {Name = "Tom"}
function cat:Meow()
    print(self.Name .. " meows")
end
cat.Meow()`,
      options: ["Tom meows", "Error: self is nil, so self.Name can't be indexed", "nil meows", "Nothing"], answer: 1,
      explain: "With a dot, nothing is passed in, so <code>self</code> is nil. Rule: <b>define with <code>:</code>, call with <code>:</code></b>." },
    { type: "example", title: "Worked example: metatables and __index", code: `local defaults = {Speed = 16, Color = "Grey"}
local myCar = {Color = "Red"}

setmetatable(myCar, {__index = defaults})

print(myCar.Color)
print(myCar.Speed)
print(myCar.Wings)`,
      notes: {
        4: "A <b>metatable</b> changes how a table behaves. <code>__index</code> says: \"if a key is missing here, look in <i>this other table</i> instead.\"",
        6: "myCar has its own Color, so this prints Red.",
        7: "myCar has no Speed, so Lua checks <code>defaults</code>: 16. <b>This fallback lookup is the trick that makes classes work.</b>",
        8: "Not in either table, so nil."
      }, run: true },
    { type: "example", title: "Worked example: a class", code: `local Enemy = {}
Enemy.__index = Enemy

function Enemy.new(name, health)
    local self = setmetatable({}, Enemy)
    self.Name = name
    self.Health = health
    return self
end

function Enemy:TakeDamage(amount)
    self.Health = math.max(self.Health - amount, 0)
    print(self.Name .. " has " .. self.Health .. " HP")
    if self.Health == 0 then
        self:Die()
    end
end

function Enemy:Die()
    print(self.Name .. " was defeated!")
end

local goblin = Enemy.new("Goblin", 30)
local orc = Enemy.new("Orc", 80)
goblin:TakeDamage(20)
orc:TakeDamage(20)
goblin:TakeDamage(20)`,
      notes: {
        1: "The <b>class</b> table holds the shared methods.",
        2: "<code>Enemy.__index = Enemy</code>: objects whose metatable is Enemy will look up missing keys (the methods!) in Enemy.",
        4: "The <b>constructor</b>: by convention it's called <code>.new</code> with a dot, because there's no object yet.",
        5: "Make a fresh table for this object and link it to the class.",
        6: "Each object stores <b>its own</b> data.",
        10: "Methods use <code>:</code>, and <code>self</code> is the specific enemy.",
        14: "Methods can call other methods on self.",
        22: "Two separate objects…",
        24: "…with separate health. Damaging the goblin doesn't touch the orc."
      }, run: true },
    { type: "predict", id: "l14-p2", prompt: "Using the same Enemy class pattern, what prints?",
      code: `local Coin = {}
Coin.__index = Coin
function Coin.new(value) return setmetatable({Value = value}, Coin) end
function Coin:Double() self.Value *= 2 end

local a = Coin.new(5)
local b = Coin.new(5)
a:Double()
a:Double()
print(a.Value, b.Value, a.Double == b.Double)`,
      options: ["20 20 false", "20 5 true", "10 5 false", "20 5 false"], answer: 1,
      explain: "Each object has its own <code>Value</code> (a is doubled twice, b untouched), but they <b>share</b> the same Double function from the class, so <code>a.Double == b.Double</code> is true. Methods aren't copied per object, which saves memory." },
    { type: "code", id: "l14-make", title: "Make: a Door class", showWorld: true,
      setup: `__sim.part("FrontDoor", {Position = Vector3.new(-6, 5, 0), Size = Vector3.new(4, 10, 1), Color = Color3.fromRGB(140, 90, 50)})
__sim.part("BackDoor", {Position = Vector3.new(6, 5, 0), Size = Vector3.new(4, 10, 1), Color = Color3.fromRGB(140, 90, 50)})`,
      task: `Write a <code>Door</code> class:
<ul><li><code>Door.new(part)</code> stores the part and <code>IsOpen = false</code>.</li><li><code>:Open()</code> sets the part's Transparency to 0.8, CanCollide to false and IsOpen to true.</li><li><code>:Close()</code> does the reverse.</li><li><code>:Toggle()</code> calls Open or Close depending on IsOpen.</li></ul>
Then create doors for <code>workspace.FrontDoor</code> and <code>workspace.BackDoor</code>, toggle the front door <b>once</b> and the back door <b>twice</b>, and print each door's IsOpen.`,
      starter: `local Door = {}
Door.__index = Door

function Door.new(part)

end

-- Open, Close, Toggle methods


-- create the two doors and test them
`,
      checks: [
        { label: "Uses setmetatable", test: function (r, c) { return code_(c, /setmetatable\s*\(/); } },
        { label: "Has Open, Close and Toggle methods", test: function (r, c) { return code_(c, /function\s+Door:Open/) && code_(c, /function\s+Door:Close/) && code_(c, /function\s+Door:Toggle/); } },
        { label: "FrontDoor ends open (see-through)", test: function (r) { return parts_(r).some(function (p) { return p.n === "FrontDoor" && p.t > 0.5; }); } },
        { label: "BackDoor ends closed (solid)", test: function (r) { return parts_(r).some(function (p) { return p.n === "BackDoor" && p.t === 0; }); } },
        { label: "Prints true and false", test: function (r) { return printed(r, /\btrue\b/) && printed(r, /\bfalse\b/); } },
        { label: "No errors", test: noErr }
      ],
      hints: ["Constructor: <code>local self = setmetatable({}, Door)</code>, <code>self.Part = part</code>, <code>self.IsOpen = false</code>, <code>return self</code>.", "<code>function Door:Open() self.Part.Transparency = 0.8 self.Part.CanCollide = false self.IsOpen = true end</code>", "<code>function Door:Toggle() if self.IsOpen then self:Close() else self:Open() end end</code>"],
      solution: `local Door = {}
Door.__index = Door

function Door.new(part)
    local self = setmetatable({}, Door)
    self.Part = part
    self.IsOpen = false
    return self
end

function Door:Open()
    self.Part.Transparency = 0.8
    self.Part.CanCollide = false
    self.IsOpen = true
end

function Door:Close()
    self.Part.Transparency = 0
    self.Part.CanCollide = true
    self.IsOpen = false
end

function Door:Toggle()
    if self.IsOpen then
        self:Close()
    else
        self:Open()
    end
end

local front = Door.new(workspace.FrontDoor)
local back = Door.new(workspace.BackDoor)
front:Toggle()
back:Toggle()
back:Toggle()
print(front.IsOpen, back.IsOpen)` },
    { type: "example", title: "Worked example: inheritance", code: `local Enemy = {}
Enemy.__index = Enemy
function Enemy.new(name, hp)
    return setmetatable({Name = name, Health = hp}, Enemy)
end
function Enemy:Attack() print(self.Name .. " attacks!") end

local Boss = setmetatable({}, {__index = Enemy})
Boss.__index = Boss
function Boss.new(name, hp)
    local self = Enemy.new(name, hp)
    return setmetatable(self, Boss)
end
function Boss:Enrage() print(self.Name .. " is ENRAGED!") end

local dragon = Boss.new("Dragon", 500)
dragon:Attack()
dragon:Enrage()`,
      notes: {
        8: "The Boss class falls back to Enemy for anything it doesn't define itself.",
        11: "Reuse the parent's constructor to set up the shared fields…",
        12: "…then switch the object's metatable to Boss.",
        17: "Boss has no Attack, so the lookup goes object → Boss → Enemy and finds it. <b>Why?</b> You get all the Enemy behaviour for free and only write what's different."
      }, run: true },
    { type: "box", kind: "tip", title: "Other metamethods", html: `<p><code>__tostring</code> controls what <code>print(obj)</code> shows. <code>__add</code>, <code>__eq</code> and <code>__lt</code> let objects use <code>+ == &lt;</code>. <code>__newindex</code> runs when a new key is set (useful for read-only tables). <code>__call</code> lets you call a table like a function. Roblox's own Vector3 and CFrame use these internally.</p>` },
    { type: "quiz", id: "l14-q", title: "Check your understanding", questions: [
      { q: "What does <code>Class.__index = Class</code> do?", options: ["Nothing", "Makes objects with this metatable look up missing keys (methods) in Class", "Copies all methods into each object", "Makes the class read-only"], answer: 1, explain: "It's the link that lets objects find shared methods." },
      { q: "<code>obj:Method(5)</code> is the same as…", options: ["obj.Method(5)", "obj.Method(obj, 5)", "Method(obj)", "obj:Method(obj, 5)"], answer: 1, explain: "The colon passes the object as the first argument (self)." },
      { q: "Why is the constructor written <code>Enemy.new</code> (dot) not <code>Enemy:new</code>?", options: ["It must be", "Convention: there's no object yet, so there's no meaningful self", "Colons don't work with new", "Performance"], answer: 1, explain: "You call it on the class itself. Using a dot makes that clear." },

LESSONS.push({

    { type: "text", html: `<p class="lead">A <b>Vector3</b> is a point or a direction in 3D. A <b>CFrame</b> (\"coordinate frame\") is a position <b>plus a rotation</b>: where something is <i>and which way it faces</i>. Nearly every advanced mechanic uses them: aiming, projectiles, teleporting, doors that swing, cameras, NPCs that chase you.</p>` },

    { type: "example", title: "Worked example: facing things with lookAt", code: `local turretPos = Vector3.new(0, 5, 0)

LESSONS.push({
  id: "l16", num: 16, tier: "Advanced", title: "RunService, Tweens & task", subtitle: "Per-frame code, smooth animation, and running things at the same time",
  icon: "⏱️",
  steps: [
    { type: "text", html: `<p class="lead">So far we've timed things with <code>task.wait</code>. For smooth movement, timers and animation you need three more tools: <b>RunService</b> (run code every frame), <b>TweenService</b> (animate properties smoothly) and the <b>task library</b> (run several things at once).</p>` },
    { type: "why", title: "Why RunService.Heartbeat?", html: `<p><code>Heartbeat</code> fires <b>every frame</b> (about 60 times a second) and passes <code>dt</code>, the seconds since the last frame. Use it for things that must update constantly: moving platforms, custom physics, cooldown bars, checking distances. <b>Multiply speeds by dt</b> so movement looks the same whether the frame rate is 30 or 240.</p>` },
    { type: "example", title: "Worked example: a moving platform with dt", showWorld: true, timeLimit: 6,
      setup: `__sim.part("Platform", {Position = Vector3.new(0, 5, 0), Size = Vector3.new(6, 1, 6), Color = Color3.fromRGB(80, 160, 255)})`,
      code: `local RunService = game:GetService("RunService")
local platform = workspace.Platform
local SPEED = 4 -- studs per second
local elapsed = 0

local connection
connection = RunService.Heartbeat:Connect(function(dt)
    elapsed += dt
    platform.Position += Vector3.new(SPEED * dt, 0, 0)
    if elapsed >= 3 then
        connection:Disconnect()
        print("Stopped at X =", math.round(platform.Position.X))
    end
end)`,
      notes: {
        3: "Speed per <b>second</b>, not per frame.",
        6: "Keep the connection so you can stop it later.",
        7: "<code>dt</code> is how much time passed since the last frame (about 1/60 s in Roblox; the sandbox runs at 30 fps).",
        9: "Distance = speed × time. After 3 seconds it has moved 4 × 3 = 12 studs, at <i>any</i> frame rate.",
        11: "<code>:Disconnect()</code> stops it. <b>Always disconnect per-frame code you no longer need</b>, or it runs forever."
      }, run: true },
    { type: "predict", id: "l16-p1", prompt: "One player's PC runs at 30 FPS and another's at 120 FPS. With this code, how far does the part move in 1 second on each?",
      norun: true,
      code: `RunService.Heartbeat:Connect(function(dt)
    part.Position += Vector3.new(1, 0, 0) -- no dt!
end)`,
      options: ["1 stud on both", "30 studs vs 120 studs: faster PCs move it 4× further", "Both 60 studs", "It doesn't move"], answer: 1,
      explain: "Without <code>dt</code>, it moves 1 stud <b>per frame</b>, so the frame rate decides the speed. Multiply by dt to make it \"studs per second\"." },
    { type: "example", title: "Worked example: TweenService", showWorld: true,
      setup: `__sim.part("Door", {Position = Vector3.new(0, 5, 0), Size = Vector3.new(6, 10, 1), Color = Color3.fromRGB(160, 110, 60)})`,
      code: `local TweenService = game:GetService("TweenService")
local door = workspace.Door

local info = TweenInfo.new(
    2,                          -- seconds
    Enum.EasingStyle.Quad,      -- shape of the motion
    Enum.EasingDirection.Out    -- slow down at the end
)
local goal = {
    Position = door.Position + Vector3.new(0, 10, 0),
    Transparency = 0.5,
}

local tween = TweenService:Create(door, info, goal)
tween:Play()
tween.Completed:Wait()
print("Door finished opening")`,
      notes: {
        4: "<code>TweenInfo</code> describes <b>how</b> to animate: duration, easing style and direction. Other options include repeats and reversing.",
        9: "The <b>goal</b>: a table of property = final value. Numbers, Vector3s, CFrames, Color3s and UDim2s can all be tweened.",
        14: "<code>Create</code> builds the animation, and <code>:Play()</code> starts it. <b>Why tween?</b> Smooth movement with no loop to write, and Roblox handles it efficiently.",
        16: "<code>Completed:Wait()</code> pauses until it finishes. (The sandbox jumps straight to the end result: in Studio you'd see it glide.)"
      }, run: true },
    { type: "text", html: `<h3>Doing two things at once: task.spawn</h3><p>A <code>while</code> loop blocks everything after it. <code>task.spawn(fn)</code> starts a function in a <b>new thread</b> that runs alongside the rest of your code. Whenever one thread waits, the others get a turn.</p>` },
    { type: "predict", id: "l16-p2", prompt: "In what order do the lines print? (Check the timestamps after you run it.)",
      code: `task.spawn(function()
    for i = 1, 3 do
        print("Spinner", i)
        task.wait(1)
    end
end)

print("Main starts")
task.wait(1.5)
print("Main done")`,
      options: ["Main starts, Main done, Spinner 1, 2, 3", "Spinner 1, Main starts, Spinner 2, Main done, Spinner 3", "Spinner 1, 2, 3, Main starts, Main done", "Main starts, Spinner 1, Spinner 2, Spinner 3, Main done"], answer: 1,
      explain: "task.spawn runs the new thread <b>immediately</b> until its first wait (Spinner 1), then the main code continues (Main starts). After that they take turns by time: Spinner 2 at 1.0s, Main done at 1.5s, Spinner 3 at 2.0s." },
    { type: "box", kind: "tip", title: "The task library", html: `<ul><li><code>task.wait(t)</code>: pause this thread.</li><li><code>task.spawn(fn, ...)</code>: run now in a new thread.</li><li><code>task.delay(t, fn, ...)</code>: run fn after t seconds, without blocking. <b>Why?</b> \"Respawn this coin in 10 seconds\" while the script carries on.</li><li><code>task.defer(fn)</code>: run very soon, after the current code finishes.</li><li><code>task.cancel(thread)</code>: stop a spawned or delayed thread.</li></ul>` },
    { type: "code", id: "l16-make", title: "Make: alarm light + countdown", timeLimit: 8,
      setup: `__sim.part("Alarm", {Position = Vector3.new(0, 8, 0), Size = Vector3.new(2, 2, 2), Color = Color3.fromRGB(80, 0, 0)})

      task: `Use <code>task.spawn</code> to blink <code>workspace.Alarm</code> between bright red <code>Color3.fromRGB(255, 0, 0)</code> and dark <code>Color3.fromRGB(80, 0, 0)</code> every <b>0.5 seconds</b>, while the <b>main</b> code counts down <code>3, 2, 1</code> (1 second apart) and then prints <code>BOOM</code>. Stop blinking after BOOM (hint: a shared boolean).`,
      starter: `local alarm = workspace.Alarm
local running = true

`,
      checks: [
        { label: "Uses task.spawn", test: function (r, c) { return code_(c, /task\.spawn\s*\(/); } },
        { label: "Prints 3, 2, 1, BOOM", test: function (r) { return P(r).join(",").indexOf("3,2,1,BOOM") >= 0; } },
        { label: "Alarm blinks while counting (several color changes before BOOM)", test: function (r) {
            var boomT = (r.lines.filter(function (l) { return l.kind === "print" && /BOOM/.test(l.text); })[0] || {}).t;
            return boomT && r.lines.filter(function (l) { return /Alarm is now/.test(l.text) && l.t < boomT; }).length >= 4; } },
        { label: "Blinking stops after BOOM", test: function (r) {
            var boomT = (r.lines.filter(function (l) { return l.kind === "print" && /BOOM/.test(l.text); })[0] || {}).t;
            return boomT && r.lines.filter(function (l) { return /Alarm is now/.test(l.text) && l.t > boomT + 0.6; }).length === 0; } },
        { label: "No errors", test: noErr }
      ],
      hints: ["<code>task.spawn(function() while running do ... end end)</code>", "Inside the loop: set red, <code>task.wait(0.5)</code>, set dark, <code>task.wait(0.5)</code>.", "Main: <code>for i = 3, 1, -1 do print(i) task.wait(1) end print(\"BOOM\") running = false</code>"],
      solution: `local alarm = workspace.Alarm

    { type: "quiz", id: "l16-q", title: "Check your understanding", questions: [
      { q: "Why multiply movement by dt in Heartbeat?", options: ["It's faster", "So speed is per second, not per frame, and the same on every device", "Roblox requires it", "To slow it down"], answer: 1, explain: "Frame rates vary between devices. dt keeps the motion consistent." },
      { q: "Best tool to smoothly slide a door open over 1 second?", options: ["A while loop with task.wait(1)", "TweenService", "Heartbeat with no dt", "Changing Position once"], answer: 1, explain: "Tweens are designed for exactly this." },
      { q: "What does task.delay(5, respawnCoin) do?", options: ["Freezes the script for 5 seconds then respawns", "Schedules respawnCoin in 5 seconds and lets the script continue right away", "Respawns 5 coins", "Errors"], answer: 1, explain: "It doesn't block. Perfect for \"later\" actions." },
      { q: "What happens if you never Disconnect a Heartbeat connection for something that's finished?", options: ["Nothing", "It keeps running every frame forever, wasting performance (a leak)", "Roblox disconnects it after 5s", "Error"], answer: 1, explain: "Clean up connections you don't need." }
    ] },
    { type: "reflect", id: "l16-r", prompt: "When would you use Heartbeat, a Tween, or a while loop with task.wait? Give one game example of each.", model: "Heartbeat for things that must update every frame and react to changing conditions, like a homing projectile following a moving target. A Tween for a fixed animation from A to B, like a door sliding open or a UI panel fading in. A while + task.wait loop for slow repeating game logic, like a round timer ticking every second or giving coins every 60 seconds." }
  ]

__sim.part("Crate", {Position = Vector3.new(0, 2, 0), Size = Vector3.new(4, 4, 4), Color = Color3.fromRGB(150, 100, 50)})
__sim.part("HidingSpot", {Position = Vector3.new(15, 3, 0), Size = Vector3.new(2, 2, 2), Color = Color3.fromRGB(255, 200, 0)})
__sim.part("OpenSpot", {Position = Vector3.new(15, 9, 0), Size = Vector3.new(2, 2, 2), Color = Color3.fromRGB(0, 220, 120)})`,
      task: `Write <code>canSee(guard, target)</code> that returns <code>true</code> if a ray from the guard's position to the target's position hits <b>the target first</b> (not the Crate). Ignore the guard itself with RaycastParams. Then print <code>canSee(workspace.Guard, workspace.HidingSpot)</code> (behind the crate → <code>false</code>) and <code>canSee(workspace.Guard, workspace.OpenSpot)</code> (above the crate → <code>true</code>).`,
      starter: `local function canSee(guard, target)
    local origin = guard.Position
    local direction = target.Position - origin

end

print(canSee(workspace.Guard, workspace.HidingSpot))
print(canSee(workspace.Guard, workspace.OpenSpot))`,
      checks: [
        { label: "Uses workspace:Raycast", test: function (r, c) { return code_(c, /workspace:Raycast\s*\(/); } },
        { label: "Uses RaycastParams", test: function (r, c) { return code_(c, /RaycastParams\.new/); } },
        { label: "Prints false then true", test: function (r) { var p = P(r); return p[0] === "false" && p[1] === "true"; } },
        { label: "No errors", test: noErr }
      ],
      hints: ["The direction <code>target.Position - origin</code> is already exactly the right length.", "Params: <code>params.FilterDescendantsInstances = {guard}</code>.", "<code>local result = workspace:Raycast(origin, direction, params)</code>, then <code>return result ~= nil and result.Instance == target</code>."],
      solution: `local function canSee(guard, target)
    local origin = guard.Position
    local direction = target.Position - origin

    local params = RaycastParams.new()
    params.FilterType = Enum.RaycastFilterType.Exclude
    params.FilterDescendantsInstances = {guard}

end

print(canSee(workspace.Guard, workspace.HidingSpot))
print(canSee(workspace.Guard, workspace.OpenSpot))` },
    { type: "box", kind: "warn", title: "Sandbox note", html: `<p>This practice sandbox treats every part as an unrotated box when raycasting. Real Roblox handles rotated parts, meshes and terrain exactly. The API and the way you use it are identical.</p>` },
    { type: "box", kind: "tip", title: "Server-side hit validation", html: `<p>In shooting games the <b>client</b> often raycasts for instant feedback, then tells the server what it hit. The server should then do its own sanity checks: is the target within range, is there line of sight (its own raycast!), is the fire rate possible? That's the rule from the RemoteEvents lesson again: never trust the client.</p>` },

      { q: "How do you make a ray exactly 100 studs long toward a target?", options: ["(target - origin) * 100", "(target - origin).Unit * 100", "Vector3.new(100, 0, 0)", "target * 100"], answer: 1, explain: ".Unit gives length 1, then multiply by the range." },
      { q: "result.Normal is useful for…", options: ["Knowing the part's color", "Knowing which way the hit surface faces (e.g. to place a decal flat on the wall)", "The distance", "Nothing"], answer: 1, explain: "It's the surface direction at the hit point." }

  ]
});

LESSONS.push({
  id: "l18", num: 18, tier: "Advanced", title: "DataStores: Saving Data", subtitle: "Making progress survive when players leave",
  icon: "💾",
  steps: [
    { type: "text", html: `<p class="lead">Everything you've built so far resets when a player leaves. <b>DataStoreService</b> saves data on Roblox's servers, keyed by name, so coins, levels and inventory are still there next time.</p>` },
    { type: "why", title: "Why it's tricky (and why this lesson matters)", html: `<p>Saving is the feature where bugs hurt most: <b>a data-loss bug can wipe players' progress</b>. DataStore calls go over the internet, so they can <b>fail</b> or be <b>slow</b>, and they have <b>rate limits</b>. The patterns in this lesson (pcall, retries, not saving after a failed load, BindToClose) are what separate a hobby game from a reliable one.</p>` },
    { type: "studio", title: "Turn on DataStores in Studio", html: `<p>DataStores only work in Studio once the game is <b>published</b> and you've enabled <b>Game Settings → Security → Enable Studio Access to API Services</b>. (This sandbox simulates them.)</p>` },
    { type: "example", title: "Worked example: basic load and save", timeLimit: 15,
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") end)
__sim.at(2, function() game.Players.Ana.leaderstats.Coins.Value += 75 __sim.log("Ana earns 75 coins") end)
__sim.at(3, function() __sim.leave("Ana") end)
__sim.at(5, function() __sim.addPlayer("Ana") end)`,
      code: `local Players = game:GetService("Players")
local DataStoreService = game:GetService("DataStoreService")
local coinStore = DataStoreService:GetDataStore("Coins_v1")

Players.PlayerAdded:Connect(function(player)
    local leaderstats = Instance.new("Folder")
    leaderstats.Name = "leaderstats"
    leaderstats.Parent = player
    local coins = Instance.new("IntValue")
    coins.Name = "Coins"
    coins.Parent = leaderstats

    local key = "Player_" .. player.UserId
    local ok, saved = pcall(function()
        return coinStore:GetAsync(key)
    end)
    if ok then
        coins.Value = saved or 0
        print("Loaded " .. player.Name .. ": " .. coins.Value)
    else
        warn("Load failed: " .. tostring(saved))
    end
end)

Players.PlayerRemoving:Connect(function(player)
    local key = "Player_" .. player.UserId
    local ok, err = pcall(function()
        coinStore:SetAsync(key, player.leaderstats.Coins.Value)
    end)
    print(ok and ("Saved " .. player.Name) or ("Save failed: " .. tostring(err)))
end)`,
      notes: {
        3: "<code>GetDataStore(name)</code> gets (or creates) a named store. Adding <code>_v1</code> lets you start fresh later if you change your data format.",
        13: "Use the <b>UserId</b> in the key, <b>never the Name</b>: players can change their name, but their UserId never changes.",
        14: "GetAsync can fail, so wrap it in pcall.",
        18: "<code>saved or 0</code>: a brand-new player has no data (nil), so start them at 0.",
        25: "<code>PlayerRemoving</code> fires when they leave, which is the moment to save.",
        28: "<code>SetAsync(key, value)</code> overwrites what's stored."
      }, run: true },
    { type: "predict", id: "l18-p1", prompt: "Danger! The load fails (Roblox hiccup), and this code doesn't check <code>ok</code>. Ben actually has 500 coins saved. What happens when he leaves?",
      norun: true,
      code: `local ok, saved = pcall(function()
    return store:GetAsync(key)
end)
coins.Value = saved or 0   -- no check of ok!
-- ...later, on PlayerRemoving:
store:SetAsync(key, coins.Value)`,
      options: ["His 500 coins are safe", "When the load fails, saved is the error message (a string), and the code may set coins to 0 or error. If it saves 0 on leave, his 500 coins are gone forever", "Roblox restores it automatically", "Nothing is saved"], answer: 1,
      explain: "This is the #1 cause of data loss in Roblox games. <b>Rule: if loading failed, don't save over their data.</b> Mark the player as \"data not loaded\" and skip saving (or kick them with a friendly message so they can rejoin)." },
    { type: "box", kind: "tip", title: "Better saving tools", html: `<ul><li><b>Save tables, not just numbers</b>: <code>{Coins = 50, Level = 3, Inventory = {\"Sword\"}}</code>. Only strings, numbers, booleans and tables of those are allowed. No Instances, Color3s or Vector3s.</li><li><b>UpdateAsync</b> (<code>store:UpdateAsync(key, function(old) return new end)</code>) reads and writes in one safe step. It's preferred for important data because it can't accidentally overwrite a newer save.</li><li><b>game:BindToClose(fn)</b> runs when the server shuts down, so you can save everyone still in the game.</li><li><b>Defaults template</b>: merge loaded data with a default table, so old saves automatically get fields you add later.</li><li>Big games often use the community module <b>ProfileStore</b>, which adds \"session locking\" so two servers can't edit the same player's data at once.</li></ul>` },
    { type: "code", id: "l18-make", title: "Make: a data system that never loses progress", timeLimit: 30,
      setup: `__sim.seedData("PlayerData_v1", "Player_1001", {Coins = 50, Level = 2})
__sim.seedData("PlayerData_v1", "Player_1002", {Coins = 500, Level = 9})`,
      sim: `__sim.at(1, function() __sim.failDataStore(1) __sim.addPlayer("Ana") end)
__sim.at(6, function() local p = game.Players:FindFirstChild("Ana") if p and p:FindFirstChild("leaderstats") then p.leaderstats.Coins.Value += 10 __sim.log("Ana earns 10 coins") end end)
__sim.at(8, function() __sim.failDataStore(3) __sim.addPlayer("Ben") end)
__sim.at(14, function() __sim.leave("Ana") end)
__sim.at(15, function() __sim.leave("Ben") end)
__sim.at(18, function()
  local H = game:GetService("HttpService")
  __sim.log("Stored Ana = " .. H:JSONEncode(__sim.getData("PlayerData_v1", "Player_1001")))
  __sim.log("Stored Ben = " .. H:JSONEncode(__sim.getData("PlayerData_v1", "Player_1002")))
end)`,
      task: `Build a safe data system for the store <code>"PlayerData_v1"</code>, saving a <b>table</b> <code>{Coins = ..., Level = ...}</code>:
<ol><li>On join, load with <b>pcall + up to 3 attempts</b> (wait 1 second between tries). Merge the result with <code>DEFAULTS</code>. Create leaderstats Coins and Level.</li>
<li>Remember <b>whether loading succeeded</b> (e.g. <code>loaded[player] = true</code>).</li>
<li>On leave, save with pcall, <b>but only if their data loaded</b>. Then clean up the table.</li></ol>
<p class="small">The simulation: Ana's first load attempt fails, the retry succeeds, and she earns 10 coins (50 → 60). Ben's load fails <b>all 3 times</b>, so his stored 500 coins <b>must not be overwritten</b>. Expected: <b>Stored Ana = Coins 60, Stored Ben = Coins 500.</b></p>`,
      starter: `local Players = game:GetService("Players")
local DataStoreService = game:GetService("DataStoreService")
local store = DataStoreService:GetDataStore("PlayerData_v1")

local DEFAULTS = {Coins = 0, Level = 1}
local loaded = {}

local function loadData(key)
    -- try up to 3 times; return success, data
end

Players.PlayerAdded:Connect(function(player)

end)

Players.PlayerRemoving:Connect(function(player)

end)`,
      checks: [
        { label: "Ana's saved data has 60 coins", test: function (r) { return logged(r, /Stored Ana = .*"Coins":60/); } },
        { label: "Ben's data was NOT overwritten (still 500)", test: function (r) { return logged(r, /Stored Ben = .*"Coins":500/); } },
        { label: "Retries (calls GetAsync more than once for Ana)", test: function (r) { return r.lines.filter(function (l) { return /GetAsync\('Player_1001'\)/.test(l.text) || /FAILED/.test(l.text) && /1001/.test(l.text); }).length >= 2; } },
        { label: "Uses pcall", test: function (r, c) { return code_(c, /pcall\s*\(/); } },
        { label: "No uncaught errors", test: noErr }
      ],
      hints: ["loadData: <code>for attempt = 1, 3 do local ok, data = pcall(function() return store:GetAsync(key) end) if ok then return true, data end task.wait(1) end return false, nil</code>", "On join: <code>local ok, data = loadData(\"Player_\" .. player.UserId)</code>. If ok, fill a table from DEFAULTS and data: <code>for k, v in pairs(DEFAULTS) do merged[k] = (data and data[k] ~= nil) and data[k] or v end</code>, then <code>loaded[player] = true</code>.", "On leave: <code>if not loaded[player] then return end</code>, build <code>{Coins = ..., Level = ...}</code> from leaderstats, SetAsync in pcall, then <code>loaded[player] = nil</code>."],
      solution: `local Players = game:GetService("Players")
local DataStoreService = game:GetService("DataStoreService")
local store = DataStoreService:GetDataStore("PlayerData_v1")

local DEFAULTS = {Coins = 0, Level = 1}
local loaded = {}

local function loadData(key)
    for attempt = 1, 3 do
        local ok, data = pcall(function()
            return store:GetAsync(key)
        end)
        if ok then
            return true, data
        end
        warn("Load attempt " .. attempt .. " failed")
        task.wait(1)
    end
    return false, nil
end

Players.PlayerAdded:Connect(function(player)
    local ok, data = loadData("Player_" .. player.UserId)

    local merged = {}
    for k, v in pairs(DEFAULTS) do
        if data and data[k] ~= nil then merged[k] = data[k] else merged[k] = v end
    end

    local leaderstats = Instance.new("Folder")
    leaderstats.Name = "leaderstats"
    for _, stat in ipairs({"Coins", "Level"}) do
        local v = Instance.new("IntValue")
        v.Name = stat
        v.Value = merged[stat]
        v.Parent = leaderstats
    end
    leaderstats.Parent = player

    if ok then
        loaded[player] = true
    else
        warn(player.Name .. "'s data failed to load. It will NOT be saved this session.")
    end
end)

Players.PlayerRemoving:Connect(function(player)
    if not loaded[player] then return end
    local stats = player.leaderstats
    local toSave = {Coins = stats.Coins.Value, Level = stats.Level.Value}
    local ok, err = pcall(function()
        store:SetAsync("Player_" .. player.UserId, toSave)
    end)
    if not ok then warn("Save failed: " .. tostring(err)) end
    loaded[player] = nil
end)

game:BindToClose(function()
    for _, player in ipairs(Players:GetPlayers()) do
        -- save everyone still in the server (same code as PlayerRemoving)
    end
end)` },
    { type: "quiz", id: "l18-q", title: "Check your understanding", questions: [
      { q: "Best key for a player's data?", options: ["player.Name", "\"Player_\" .. player.UserId", "player.DisplayName", "A random number"], answer: 1, explain: "UserIds are permanent. Names can change." },
      { q: "Loading a player's data failed after all retries. What should you do when they leave?", options: ["Save their current (default) data", "Skip saving so their real data isn't overwritten", "Delete their key", "Save twice"], answer: 1, explain: "Saving defaults over real data is exactly how progress gets wiped." },
      { q: "Which value can you NOT save directly in a DataStore?", options: ["{Coins = 5}", "\"hello\"", "A Part (Instance)", "true"], answer: 2, explain: "Instances and Roblox types like Color3 or Vector3 must be converted to plain data (e.g. {r, g, b})." },
      { q: "What does game:BindToClose do?", options: ["Closes the game", "Runs your function when the server shuts down, giving you time to save", "Kicks players", "Locks the DataStore"], answer: 1, explain: "On shutdown, PlayerRemoving might not finish saving for everyone, so BindToClose covers it." },
      { q: "Why is UpdateAsync preferred over SetAsync for important data?", options: ["It's shorter", "It reads and writes in one step, based on the current stored value, avoiding overwrites from stale data", "It never fails", "It's free"], answer: 1, explain: "It gets the latest value and lets you decide the new one in one safe step." }
    ] },
    { type: "reflect", id: "l18-r", prompt: "List the steps of a safe save/load system and the specific bug that each step prevents.", model: "1) pcall around GetAsync/SetAsync stops a failed request from crashing the script. 2) Retries with waits get past temporary outages. 3) Tracking whether loading succeeded, and skipping the save if not, prevents overwriting real data with defaults. 4) Keying by UserId stops data getting lost when players change their names. 5) A defaults merge makes old saves get new fields. 6) BindToClose saves players when the server shuts down. 7) Cleaning up the loaded table on leave prevents memory leaks." }
  ]
});

LESSONS.push({
  id: "l19", num: 19, tier: "Advanced", title: "Tags, Attributes & Clean-up", subtitle: "CollectionService, Attributes, and avoiding memory leaks",
  icon: "🏷️",
  steps: [
    { type: "text", html: `<p class="lead">Beginners put one script inside every kill brick. With 200 kill bricks, that's 200 copies of the same code to update. Pros <b>tag</b> the parts and handle them all from <b>one</b> script. They also store per-object settings in <b>Attributes</b>, and they clean up after themselves.</p>` },
    { type: "why", title: "Why tags and attributes?", html: `<ul><li><b>Tags (CollectionService)</b>: label any instances (\"KillBrick\", \"Coin\", \"Door\"). One script finds them all with <code>GetTagged</code> and reacts to new ones with <code>GetInstanceAddedSignal</code>. Fix a bug once and every brick gets the fix.</li><li><b>Attributes</b>: custom properties on any instance (<code>Damage = 25</code>, <code>Locked = true</code>). You can edit them in the Properties window <b>without changing code</b>. Builders and designers love this.</li></ul>
<p class="small">In Studio: select a part, and in Properties scroll to <b>Tags</b> and <b>Attributes</b> to add them with ⊕.</p>` },
    { type: "example", title: "Worked example: one script for every damage brick", showWorld: true, timeLimit: 10,
      setup: `local function mk(n, x, dmg) local p = __sim.part(n, {Position = Vector3.new(x, 0.5, 0), Size = Vector3.new(6, 1, 6), Color = Color3.fromRGB(255, 60 + dmg, 0), Material = Enum.Material.Neon}) p:AddTag("DamageBrick") p:SetAttribute("Damage", dmg) end
mk("Spikes", -10, 25) mk("Lava", 0, 100) mk("Nettles", 10, 5)`,
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") end)
__sim.at(2, function() __sim.touch(workspace.Nettles, "Ana") end)
__sim.at(3, function() __sim.touch(workspace.Spikes, "Ana") end)
__sim.at(4, function() local p = Instance.new("Part") p.Name = "NewTrap" p.Anchored = true p.Position = Vector3.new(20, 0.5, 0) p:SetAttribute("Damage", 10) p.Parent = workspace p:AddTag("DamageBrick") __sim.log("A NewTrap is added at runtime") end)
__sim.at(5, function() __sim.touch(workspace.NewTrap, "Ana") end)`,
      code: `local CollectionService = game:GetService("CollectionService")

local function setupBrick(brick)
    brick.Touched:Connect(function(hit)
        local humanoid = hit.Parent:FindFirstChild("Humanoid")
        if humanoid then
            local damage = brick:GetAttribute("Damage") or 10
            humanoid:TakeDamage(damage)
            print(brick.Name .. " hit for " .. damage .. ", health: " .. humanoid.Health)
        end
    end)
end

for _, brick in ipairs(CollectionService:GetTagged("DamageBrick")) do
    setupBrick(brick)
end
CollectionService:GetInstanceAddedSignal("DamageBrick"):Connect(setupBrick)`,
      notes: {
        3: "One function that sets up <b>any</b> brick.",
        7: "<code>:GetAttribute(\"Damage\")</code> reads this brick's own setting. <code>or 10</code> is a fallback if someone forgot to set it.",
        8: "<code>Humanoid:TakeDamage(n)</code> lowers Health (and respects force fields, unlike setting Health directly).",
        14: "<code>GetTagged</code> returns every instance with the tag <b>right now</b>.",
        17: "…and this catches bricks <b>tagged later</b> (spawned by code, or streamed in). Without this line, NewTrap wouldn't work."
      }, run: true },
    { type: "text", html: `<h3>Memory leaks: the silent game-killer</h3><p>A <b>leak</b> is something that keeps using memory or CPU after you're done with it. Long-running servers gradually get laggier until they crash. Most common causes:</p>
<ul><li><b>Connections that are never disconnected</b>, especially to things that live forever (Heartbeat, Players.PlayerAdded, another object's events).</li><li><b>Tables keyed by player that are never cleared</b> when the player leaves.</li><li><b>Instances created but never Destroyed</b>, like bullets and effects. Use <code>Debris:AddItem(obj, seconds)</code> or <code>:Destroy()</code>.</li></ul>
<p class="small">Good news: <code>:Destroy()</code> automatically disconnects the destroyed object's <b>own</b> events.</p>` },
    { type: "predict", id: "l19-p1", prompt: "The part is destroyed at 1 second. Does the Heartbeat code keep running?", timeLimit: 3,
      setup: `__sim.part("Spinner", {Position = Vector3.new(0, 5, 0)})`,
      code: `local RunService = game:GetService("RunService")
local part = workspace.Spinner
local frames = 0

RunService.Heartbeat:Connect(function()
    frames += 1
end)

task.wait(1)
part:Destroy()
local before = frames
task.wait(1)
print("Still running?", frames > before)`,
      options: ["false: Destroy stops it", "true: the connection is on RunService, not the part, so it keeps running forever (a leak)", "Error", "It runs twice as fast"], answer: 1,
      explain: "Destroying the part only cleans up connections on <b>the part's own events</b>. Heartbeat belongs to RunService, which lives forever. Save the connection and <code>:Disconnect()</code> it, for example in <code>part.Destroying</code>." },
    { type: "code", id: "l19-make", title: "Make: tagged heal pads with per-player cooldowns", timeLimit: 12,
      setup: `local function mk(n, x, amt) local p = __sim.part(n, {Position = Vector3.new(x, 0.5, 0), Size = Vector3.new(6, 1, 6), Color = Color3.fromRGB(0, 220, 120), Material = Enum.Material.Neon}) p:AddTag("HealPad") p:SetAttribute("HealAmount", amt) end
mk("SmallHeal", -8, 10) mk("BigHeal", 8, 50)`,
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") __sim.addPlayer("Ben") end)
__sim.at(1.5, function() game.Workspace.Ana.Humanoid.Health = 20 game.Workspace.Ben.Humanoid.Health = 20 __sim.log("Ana and Ben are hurt (20 HP)") end)
__sim.at(2, function() __sim.touch(workspace.SmallHeal, "Ana") end)
__sim.at(2.2, function() __sim.touch(workspace.SmallHeal, "Ana", "RightFoot") end)
__sim.at(2.3, function() __sim.touch(workspace.SmallHeal, "Ben") end)
__sim.at(3, function() __sim.touch(workspace.BigHeal, "Ana") end)
__sim.at(7.5, function() __sim.touch(workspace.BigHeal, "Ana") end)
__sim.at(8, function() __sim.leave("Ben") end)
__sim.at(9, function() __sim.log("Ana HP = " .. workspace.Ana.Humanoid.Health) end)`,
      task: `Make every part tagged <code>"HealPad"</code> heal by its <code>HealAmount</code> attribute. Each <b>player</b> has a 5-second cooldown (across all pads), stored in a table <code>lastHeal[player]</code>. Clear the player's entry on <code>PlayerRemoving</code>, then print <code>Cleaned up Ben</code>.<br><span class="small">Expected: Ana heals 10 at 2s (→30); her touch at 2.2s and the BigHeal at 3s are on cooldown; she heals 50 at 7.5s (→80). Ben heals 10 (his own cooldown).</span>`,
      starter: `local CollectionService = game:GetService("CollectionService")
local Players = game:GetService("Players")
local COOLDOWN = 5
local lastHeal = {}

`,
      checks: [
        { label: "Ana ends at 80 HP", test: function (r) { return logged(r, /Ana HP = 80\b/); } },
        { label: "Uses GetTagged and GetAttribute", test: function (r, c) { return code_(c, /GetTagged\s*\(/) && code_(c, /GetAttribute\s*\(/); } },
        { label: "Cleans up on PlayerRemoving", test: function (r, c) { return code_(c, /PlayerRemoving/) && printed(r, /Cleaned up Ben/); } },
        { label: "No errors", test: noErr }
      ],
      hints: ["Per pad: <code>pad.Touched:Connect(function(hit) ... end)</code>. Get the player with <code>Players:GetPlayerFromCharacter(hit.Parent)</code>.", "Cooldown: <code>local now = os.clock()</code>, <code>if lastHeal[player] and now - lastHeal[player] &lt; COOLDOWN then return end</code>.", "Heal: <code>humanoid.Health = math.min(humanoid.Health + amount, humanoid.MaxHealth)</code>."],
      solution: `local CollectionService = game:GetService("CollectionService")
local Players = game:GetService("Players")
local COOLDOWN = 5
local lastHeal = {}

local function setupPad(pad)
    pad.Touched:Connect(function(hit)
        local character = hit.Parent
        local player = Players:GetPlayerFromCharacter(character)
        local humanoid = character:FindFirstChild("Humanoid")
        if not player or not humanoid then return end

type Item = {
    Name: string,
    Price: number,
    Rarity: "Common" | "Rare" | "Legendary",
}

local function formatPrice(item: Item): string
    return item.Name .. " costs " .. item.Price
end

local function findCheapest(items: {Item}): Item?
    local best: Item? = nil
    for _, item in items do
        if best == nil or item.Price < best.Price then
            best = item
        end
    end
    return best
end

      starter: `local Players = game:GetService("Players")

        { label: "Status shows an intermission countdown", test: function (r) { return logged(r, /Status: .*Intermission.*\d/i); } },
        { label: "Status shows the round timer", test: function (r) { return logged(r, /Status: .*Round.*\d/i); } },
        { label: "Ana: 2 wins, 50 coins", test: function (r) { return r.world && r.world.players.some(function (p) { return p.n === "Ana" && JSON.stringify(p.stats) === '[["Wins","2"],["Coins","50"]]'; }); } },
        { label: "Ben: 1 win, 25 coins", test: function (r) { return r.world && r.world.players.some(function (p) { return p.n === "Ben" && JSON.stringify(p.stats) === '[["Wins","1"],["Coins","25"]]'; }); } },
        { label: "Cleo: 1 win, 25 coins (respawned for round 2)", test: function (r) { return r.world && r.world.players.some(function (p) { return p.n === "Cleo" && JSON.stringify(p.stats) === '[["Wins","1"],["Coins","25"]]'; }); } },

      solution: `local Players = game:GetService("Players")
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local Config = require(ReplicatedStorage.Config)
local Status = ReplicatedStorage.Status

local function intermission()
    for t = Config.INTERMISSION, 1, -1 do
        Status.Value = "Intermission: " .. t
        task.wait(1)
    end
end

local function playRound()
    local alive = {}
    local connections = {}

    -- 1) gather living players and teleport them
    for _, player in ipairs(Players:GetPlayers()) do
        local character = player.Character
        local humanoid = character and character:FindFirstChild("Humanoid")
        if humanoid and humanoid.Health > 0 then
            alive[player] = true
            character:PivotTo(workspace.Arena.CFrame + Vector3.new(0, 5, 0))
            table.insert(connections, humanoid.Died:Connect(function()
                alive[player] = nil
                print(player.Name .. " is out!")
            end))
        end
    end

    -- 2) round timer
    for t = Config.ROUND_LENGTH, 1, -1 do
        Status.Value = "Round: " .. t
        task.wait(1)
    end

    -- 3) reward survivors
    for player in pairs(alive) do
        local stats = player:FindFirstChild("leaderstats")
        if stats then
            stats.Wins.Value += 1
            stats.Coins.Value += Config.WIN_REWARD
            print(player.Name .. " survived!")
        end
    end

    -- 4) clean up
    for _, connection in ipairs(connections) do
        connection:Disconnect()
    end
end

for round = 1, Config.ROUNDS_TO_PLAY do
    intermission()
    playRound()
end
Status.Value = "Game over!"` },

    { type: "deep", title: "Patterns: Lua's mini search language", html: `<p><code>find</code>, <code>match</code> and <code>gsub</code> understand <b>patterns</b>: <code>%d</code> = a digit, <code>%a</code> = a letter, <code>%s</code> = a space, <code>+</code> = one or more. So <code>(\"Level 12\"):match(\"%d+\")</code> gives \"12\", and <code>(\"a-b-c\"):gsub(\"-\", \" \")</code> replaces dashes with spaces. To search for a special character literally, pass <code>true</code> as the 4th argument to find: <code>s:find(\".\", 1, true)</code>. Later, <code>s:split(\" \")</code> (Luau) breaks a string into a table of words, which is perfect for chat commands.</p>` },

LESSONS.push({
  id: "think", tier: "Beginner", title: "Think Like a Programmer", subtitle: "Algorithms, breaking problems down, and tracing code in your head",
  icon: "🧠",
  steps: [
    { type: "text", html: `<p class="lead">Most of programming isn't typing, it's <b>thinking clearly</b>. Computers do <i>exactly</i> what you say, in order, with zero common sense. This lesson teaches the three thinking skills every developer uses: <b>breaking problems into steps</b>, <b>planning before coding</b>, and <b>tracing</b> code in your head.</p>` },
    { type: "box", kind: "analogy", title: "The robot sandwich", html: `<p>Tell a robot \"make a sandwich\" and nothing happens. It doesn't know what that means. You have to say: open the bag, take out 2 slices, put them on the plate, open the jar… A list of exact steps like this is an <b>algorithm</b>. Code is just an algorithm written in a language the computer understands.</p>` },
    { type: "text", html: `<h3>Skill 1: Decomposition (breaking it down)</h3><p>Big ideas like \"make an obby\" are too vague to code. Break them into smaller and smaller pieces until each one is something you know how to write:</p>
<pre class="mini">Make a lava floor that kills players
 ├─ Notice when something touches the lava      → an event
 ├─ Check if the thing is part of a player       → FindFirstChild("Humanoid")
 └─ If it is, set their health to 0              → if + a property</pre>
<p>When a task feels impossible, it usually just hasn't been broken down enough yet.</p>` },
    { type: "text", html: `<h3>Skill 2: Plan in plain words first (pseudocode)</h3><p>Before coding, write the steps as <b>comments</b> in normal language. Then turn each comment into a line or two of code. Pros do this all the time. It separates <i>what</i> to do from <i>how</i> to write it.</p>` },
    { type: "example", title: "Worked example: from plan to code",
      goals: { 1: "Plan: write the steps as comments", 6: "Store the facts", 9: "Do the math", 12: "Show the result" },
      code: `-- PLAN: buy as many potions as possible
-- 1. The player has some coins, potions have a price
-- 2. Work out how many they can afford (whole potions only)
-- 3. Take the cost out of their coins
-- 4. Tell them what happened
local coins = 50
local price = 12

local bought = math.floor(coins / price)
coins = coins - bought * price

print("You bought " .. bought .. " potions")
print("Coins left: " .. coins)`,
      notes: {
        1: "The plan comes first, in plain words. Each numbered step will become code.",
        6: "Step 1 becomes variables.",
        9: "Step 2: 50 ÷ 12 = 4.16…, so <code>math.floor</code> rounds down to 4. You can't buy 0.16 of a potion.",
        10: "Step 3: 4 × 12 = 48 spent, 2 left.",
        12: "Step 4: tell the player."
      }, run: true },
    { type: "text", html: `<h3>Skill 3: Tracing with a memory table</h3><p>Tracing means running code <b>in your head</b> to predict exactly what it does. It's the #1 skill for finding bugs. Researchers found beginners trace much better with a simple strategy:</p>
<ol><li>Make a table with one column per variable.</li><li>Read <b>one line</b>. What does it change?</li><li>Write the new value in the table (cross out the old one).</li><li>Move to the next line. Never skip ahead or guess.</li></ol>
<p>The table remembers the values so your brain doesn't have to.</p>` },
    { type: "trace", id: "think-t1", title: "Your first memory table",
      prompt: "Fill in the value of each variable <b>after</b> each line runs.",
      code: `local coins = 10
local price = 4
coins = coins - price
price = price * 2
coins = coins - price
print(coins, price)`,
      table: [["After line", "coins", "price"], ["1", "10!", "-"], ["2", "10", "4"], ["3", "6", "4"], ["4", "6", "8"], ["5", "-2", "8"]],
      explain: "Line 5 uses the <b>new</b> price (8), not the original 4. Values change over time, which is exactly why tracing line by line matters." },
    { type: "predict", id: "think-p1", prompt: "A classic trap. Trace it carefully: what prints?",
      code: `local a = 1
local b = 2
a = b
b = a
print(a, b)`,
      options: ["2 1", "2 2", "1 2", "1 1"], answer: 1,
      explain: "Line 3 sets a to 2, so the 1 is gone forever. Line 4 copies a (now 2) into b. Both are 2. To swap two values you need a <b>temporary</b> variable to hold one of them." },
    { type: "fill", id: "think-f1", title: "Swap correctly",
      prompt: "Fill in the blanks so the values really swap and it prints <code>2 1</code>.",
      code: `local a = 1
local b = 2
local temp = [[a]]
a = [[b]]
b = [[temp]]
print(a, b)`,
      explain: "temp remembers the old a, so it isn't lost when a is overwritten. (Luau also has a shortcut: <code>a, b = b, a</code> swaps in one line.)" },
    { type: "trace", id: "think-t2", title: "Trace the damage",
      prompt: "A player takes hits. Fill in the table.",
      code: `local hp = 100
local dmg = 15
hp -= dmg * 2
dmg = dmg + 5
hp -= dmg
print(hp)`,
      table: [["After line", "hp", "dmg"], ["1", "100!", "-"], ["2", "100", "15"], ["3", "70", "15"], ["4", "70", "20"], ["5", "50", "20"]],
      explain: "Line 3 does the multiplication first (15 × 2 = 30) and subtracts it. Line 5 uses the updated dmg of 20." },
    { type: "code", id: "think-c1", title: "Make: plan, then code",
      task: `Turn this plan into code, one step at a time. Keep the plan comments, and write the code under each one.`,
      starter: `-- PLAN: a vending machine
-- 1. The player has 20 coins and a soda costs 7 coins

-- 2. Work out how many sodas they can afford

-- 3. Work out how many coins are left

-- 4. Print "Sodas: ___" and "Coins left: ___"
`,
      checks: [
        { label: "Prints Sodas: 2", test: function (r) { return printed(r, /Sodas:?\s*2$/); } },
        { label: "Prints Coins left: 6", test: function (r) { return printed(r, /Coins left:?\s*6$/); } },
        { label: "Uses math.floor and variables (no typed-in answers)", test: function (r, c) { return code_(c, /math\.floor/) && !code_(c, /print\s*\(\s*"Sodas:?\s*2"/); } }
      ],
      hints: ["Step 1: <code>local coins = 20</code> and <code>local price = 7</code>.", "Step 2: <code>local sodas = math.floor(coins / price)</code>. Step 3: <code>local left = coins - sodas * price</code>."],
      solution: `-- PLAN: a vending machine
-- 1. The player has 20 coins and a soda costs 7 coins
local coins = 20
local price = 7
-- 2. Work out how many sodas they can afford
local sodas = math.floor(coins / price)
-- 3. Work out how many coins are left
local left = coins - sodas * price
-- 4. Print "Sodas: ___" and "Coins left: ___"
print("Sodas: " .. sodas)
print("Coins left: " .. left)` },
    { type: "box", kind: "tip", title: "When you're stuck, try this", html: `<ol><li><b>Say the problem out loud</b> in one sentence.</li><li><b>Break it down</b> until each piece is small.</li><li><b>Solve one piece</b> and test it with a print before moving on.</li><li><b>Trace</b> the part that's wrong with a memory table.</li><li>Still stuck? <b>Explain your code line by line</b> to someone (or a rubber duck!). You'll often spot the bug mid-sentence.</li></ol>` },
    { type: "quiz", id: "think-q", title: "Check your understanding", questions: [
      { q: "What's an algorithm?", options: ["A type of variable", "An exact, ordered list of steps to solve a problem", "A Roblox service", "A kind of error"], answer: 1, explain: "Code is an algorithm written in a programming language." },
      { q: "Best first step for \"make a door that opens for VIPs\"?", options: ["Start typing code", "Break it into smaller steps (detect the player, check VIP, open the door)", "Copy a free model", "Ask for a script"], answer: 1, explain: "Decomposition turns a vague goal into code-sized pieces." },
      { q: "What is pseudocode?", options: ["Broken code", "The plan written in plain language, often as comments", "Fake Roblox code", "Code that runs faster"], answer: 1, explain: "Plan the what, then write the how." },
      { q: "When tracing, what should you do?", options: ["Guess the final answer", "Go one line at a time and update a table of variable values", "Read only the last line", "Skip the math"], answer: 1, explain: "Line by line, writing values down, is what makes tracing reliable." }
    ] },
    { type: "reflect", id: "think-r", prompt: "Explain in your own words why <code>a = b; b = a</code> doesn't swap two variables, and how a temporary variable fixes it.", model: "After a = b, a's original value is overwritten and lost, so b = a just copies the same value back: both end up equal. A temp variable saves a's original value first (temp = a), then a = b, then b = temp puts the saved value into b." },
    { type: "studio", title: "Studio mission: plan first", html: `<p>Before your next Studio script, write the whole plan as numbered comments first. Only then write code under each comment. Notice how much easier it is to know what to type.</p>` }
  ]
});
