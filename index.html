<script>
/* ===== Luau Quest app ===== */
(function () {
  "use strict";
  var $ = function (s, e) { return (e || document).querySelector(s); };
  var $$ = function (s, e) { return Array.prototype.slice.call((e || document).querySelectorAll(s)); };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
  function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------------- state ---------------- */
  var KEY = "luau-quest-v2";
  function fresh() {
    return { done: {}, wrong: {}, code: {}, refl: {}, seen: {}, xp: 0, daily: {}, streak: { count: 0, last: "" }, lessons: {}, badges: {},
      missions: {}, stats: { runs: 0, predRight: 0, bugs: 0, puzzles: 0, perfect: 0, reviewed: 0, deep: 0 }, settings: { sound: true, theme: "auto", goal: 50 } };
  }
  var S = fresh();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) S = Object.assign(fresh(), JSON.parse(raw));
    else {
      var old = localStorage.getItem("rbx-luau-course-v1");
      if (old) { var o = JSON.parse(old); ["done", "code", "refl", "wrong", "seen"].forEach(function (k) { if (o[k]) S[k] = o[k]; }); }
    }
  } catch (e) {}
  S.stats = Object.assign(fresh().stats, S.stats || {});
  S.settings = Object.assign(fresh().settings, S.settings || {});
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function dayStr(d) { d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function todayXP() { return S.daily[dayStr()] || 0; }
  function streakNow() {
    var y = new Date(); y.setDate(y.getDate() - 1);
    return (S.streak.last === dayStr() || S.streak.last === dayStr(y)) ? S.streak.count : 0;
  }
  function levelInfo() {
    var lv = 1; while (S.xp >= 50 * lv * (lv + 1)) lv++;
    var base = 50 * (lv - 1) * lv, next = 50 * lv * (lv + 1);
    return { lv: lv, into: S.xp - base, need: next - base };
  }
  function addXP(n, anchor) {
    if (!n) return;
    var before = levelInfo().lv;
    S.xp += n;
    var t = dayStr();
    S.daily[t] = (S.daily[t] || 0) + n;
    if (S.streak.last !== t) {
      var y = new Date(); y.setDate(y.getDate() - 1);
      S.streak.count = S.streak.last === dayStr(y) ? S.streak.count + 1 : 1;
      S.streak.last = t;
    }
    save();
    if (anchor) floatXP(n, anchor);
    var after = levelInfo().lv;
    if (after > before) { toast("⬆️", "Level up! You're now level " + after); sfx("level"); }

    rail.appendChild(el('<section class="panel hide-m"><h3>Tools</h3><div class="quick"><a href="#/ideas"><span>💡</span>Project ideas to build</a><a href="#/practice"><span>🔁</span>Daily practice (10 questions)</a><a href="#/dict"><span>📖</span>Code Dictionary</a><a href="#/play"><span>🧪</span>Playground</a></div></section>'));
    var curNode = $(".node.cur");
    if (curNode && !fresh) setTimeout(function () { curNode.scrollIntoView({ block: "center", behavior: "smooth" }); }, 200);
  }
  function showLesson(id) {
    var L = lessonById(id);
    if (!L) { location.hash = "#/"; return; }
    startPlayer({ lesson: L, screens: buildScreens(L, true), exitHash: "#/" });
  }
  function showPractice() {
    var started = LESSONS.filter(function (l) { return isDone(l.id) || requiredIds(l).some(function (i) { return S.done[i]; }); });
    var maxNum = started.length ? Math.max.apply(null, started.map(function (l) { return l.num; })) + 1 : 0;
    var pool = allQuestions(maxNum).filter(function (p) { return p.lesson.num >= 1; });
    if (pool.length < 3) {
      shell("#/practice");
      main.appendChild(el('<div class="pagehead"><h1>Practice</h1><p>Practice mixes questions from every lesson you\'ve started, and brings back the ones you got wrong more often.</p></div>'));
      main.appendChild(el('<div class="panel" style="display:flex;gap:16px;align-items:center">' + bit("think", "") .replace("<svg", '<svg width="80" height="80"') + '<div><b>Nothing to practice yet.</b><p class="small" style="margin:4px 0 10px">Finish Lesson 1 and come back. Questions unlock as you learn.</p><a class="bb green sm" href="#/lesson/l1">Go to lesson 1</a></div></div>'));
      return;
    }
    var qs = pickReview(pool, 10).map(function (p) { return { kind: "q", q: p.q, qid: p.id, from: p.lesson, warm: false }; });
    var L = { id: "__practice", title: "Daily practice", subtitle: "10 mixed questions from your lessons", icon: "🔁", tier: "Practice", num: 0 };
    var screens = [{ kind: "intro" }].concat(qs).concat([{ kind: "end" }]);
    SCREENS.intro_practice = true;
    startPlayer({ lesson: L, screens: screens, review: true, exitHash: "#/" });
  }
  var playState = { code: null, opt: {} };
  function openPlayground(code, opt) { playState = { code: code, opt: opt || {} }; location.hash = "#/play"; }
  function showPlay() {
    shell("#/play");
    main.appendChild(el('<div class="pagehead"><h1>Playground</h1><p>Write anything and run it. The world starts with a Baseplate and a SpawnLocation. Turn on simulated players to test touch events: Ana and Ben join, and Ana steps on a part named <code>Pad</code>.</p></div>'));
    var w = el('<div><label class="mission" style="margin:0 0 12px"><input type="checkbox" class="simck"> Simulate players (Ana joins at 1s and touches Pad at 3s; Ben joins at 2s)</label><div class="edh"></div><div class="tbar"><button class="bb green sm run">▶ Run</button><button class="linkbtn clr">Clear</button></div><div class="outwrap"></div></div>');
    main.appendChild(w);
    var opt = playState.opt;
    var ed = makeEditor($(".edh", w), playState.code || S.code.__play || 'print("Hello from the playground!")\n', go);
    function go() {
      S.code.__play = ed.get(); save();
      var o = Object.assign({}, opt);
      if ($(".simck", w).checked) {
        o.setup = (o.setup || "") + '\nif not workspace:FindFirstChild("Pad") then __sim.part("Pad", {Position = Vector3.new(0, 0.5, 8), Size = Vector3.new(6, 1, 6)}) end';
        o.sim = (o.sim || "") + '\n__sim.at(1, function() __sim.addPlayer("Ana") end) __sim.at(2, function() __sim.addPlayer("Ben") end) __sim.at(3, function() __sim.touch(workspace.Pad, "Ana") end)';
      }
      renderResult($(".outwrap", w), runCode(ed.get(), o), o);
    }
    $(".run", w).onclick = go;
    $(".clr", w).onclick = function () { ed.set(""); };
    playState = { code: null, opt: {} };
  }
  function showDict() {
    shell("#/dict");
    var cats = []; DICT.forEach(function (d) { if (cats.indexOf(d.cat) < 0) cats.push(d.cat); });
    main.appendChild(el('<div class="pagehead"><h1>Code Dictionary</h1><p>Every code item in the course: what it does, <b>why you\'d use it</b>, an example you can run, and the classic mistake. ' + DICT.length + " entries.</p></div>"));
    var w = el('<div><div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><input class="search" style="flex:1;min-width:220px" type="search" placeholder="Search, e.g. FindFirstChild, debounce, save data, sprint…" aria-label="Search the dictionary"><select class="search catsel" style="width:auto;flex:none" aria-label="Topic"></select></div><div class="dlist"></div></div>');
    main.appendChild(w);
    var curCat = "All", catSel = $(".catsel", w), list = $(".dlist", w), search = $("input.search", w);
    ["All"].concat(cats).forEach(function (c) { var n = c === "All" ? DICT.length : DICT.filter(function (d) { return d.cat === c; }).length; catSel.appendChild(el('<option value="' + esc(c) + '">' + (c === "All" ? "All topics" : esc(c)) + " (" + n + ")</option>")); });
    catSel.onchange = function () { curCat = catSel.value; draw(); };
    function splitEx(ex) {
      var show = [], sim = [];
      ex.split("\n").forEach(function (l) { if (/^\s*(for .*do )?__sim\.(at|shutdown)/.test(l)) sim.push(l); else show.push(l); });
      return { code: show.join("\n"), opt: { sim: sim.length ? sim.join("\n") : null, timeLimit: 10 } };
    }
    function shortWhy(t) { var s = t.replace(/<[^>]+>/g, ""); var i = s.indexOf(". "); return i > 0 && i < 140 ? s.slice(0, i + 1) : s.slice(0, 140) + (s.length > 140 ? "…" : ""); }
    function draw() {
      var q = search.value.toLowerCase().trim(); list.innerHTML = ""; var n = 0;
      DICT.forEach(function (d) {
        if (curCat !== "All" && d.cat !== curCat) return;
        if (q && (d.name + " " + d.what + " " + d.why + " " + d.cat).toLowerCase().indexOf(q) < 0) return;
        n++;
        var sp = splitEx(d.ex);
        var e = el('<details class="dent"><summary><span class="dn">' + esc(d.name) + '</span><span class="dc">' + esc(d.cat) + '</span><span class="dw">' + shortWhy(d.why) + '</span></summary><div class="body"><p style="margin-top:0"><b>What it does:</b> ' + d.what + '</p><div class="aside why" style="margin:10px 0"><div class="at">🧠 Why and when you\'d use it</div>' + d.why + "</div>" + codeBlock(sp.code) + (sp.opt.sim ? '<p class="small">The sandbox simulates players and events for this example.</p>' : "") + (d.mistake ? '<div class="aside warn" style="margin:10px 0"><div class="at">⚠️ Common mistake</div>' + d.mistake + "</div>" : "") + '<div class="tbar"><button class="bb sm green">▶ Run example</button><button class="bb sm ghost">Open in Playground</button>' + (d.lesson && lessonById(d.lesson) ? '<a class="linkbtn" href="#/lesson/' + d.lesson + '">Learn it in lesson ' + lessonById(d.lesson).num + "</a>" : "") + '</div><div class="outwrap"></div></div></details>');
        var bs = $$(".bb", e);
        bs[0].onclick = function () { renderResult($(".outwrap", e), runCode(sp.code, sp.opt), sp.opt); };
        bs[1].onclick = function () { openPlayground(sp.code, sp.opt); };
        list.appendChild(e);
      });
      if (!n) list.appendChild(el('<p class="small">No matches. Try another word, like "loop", "player" or "save".</p>'));
    }
    search.oninput = draw; draw();
  }
  function showIdeas() {
    shell("#/ideas");
    main.appendChild(el('<div class="pagehead"><h1>Project ideas</h1><p>The fastest way to get good is to <b>build small things and finish them</b>. Each idea lists the lessons it uses and the first steps to start. Pick one that matches what you\'ve learned so far, build it in Roblox Studio, then add a stretch goal.</p></div>'));
    var levels = [["s", "Starter", "Uses World 1 skills"], ["b", "Builder", "Adds World 2 skills"], ["p", "Pro", "Uses World 3 skills"]];
    var sel = el('<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><select class="search lvsel" style="width:auto" aria-label="Difficulty"><option value="">All difficulties (' + IDEAS.length + ')</option>' + levels.map(function (l) { return '<option value="' + l[0] + '">' + l[1] + " (" + IDEAS.filter(function (i) { return i.lvl === l[0]; }).length + ")</option>"; }).join("") + '</select><label class="mission" style="margin:0;padding:8px 14px"><input type="checkbox" class="ready"> Only ideas I\'m ready for</label></div>');
    main.appendChild(sel);
    var grid = el('<div class="ideas-grid"></div>'); main.appendChild(grid);
    function ready(i) { return i.uses.every(function (id) { return isDone(id); }); }
    function draw() {
      var lv = $(".lvsel", sel).value, onlyReady = $(".ready", sel).checked;
      grid.innerHTML = "";
      IDEAS.filter(function (i) { return (!lv || i.lvl === lv) && (!onlyReady || ready(i)); }).forEach(function (i) {
        var L = levels.filter(function (l) { return l[0] === i.lvl; })[0];
        grid.appendChild(el('<article class="idea"><span class="lvlpill ' + i.lvl + '">' + L[1] + (ready(i) ? " · ready ✓" : "") + "</span><h3>" + i.icon + " " + esc(i.name) + "</h3><p style=\"margin:0\">" + i.pitch + '</p><div class="uses">' + i.uses.map(function (id) { var l = lessonById(id); return l ? '<a href="#/lesson/' + id + '">' + esc(l.title) + "</a>" : ""; }).join("") + '</div><div><b style="font-size:.9rem">First steps</b><ol>' + i.steps.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ol></div><div class="stretch"><b>Stretch goal:</b> ' + i.stretch + "</div></article>"));
      });
      if (!grid.children.length) grid.appendChild(el('<p class="small">No ideas match yet. Finish a few more lessons, or turn off the filter.</p>'));
    }
    $(".lvsel", sel).onchange = draw; $(".ready", sel).onchange = draw; draw();
  }
  function showMe() {
    shell("#/me");
    var lv = levelInfo(), lessonsDone = Object.keys(S.lessons).filter(function (k) { return S.lessons[k].done && lessonById(k); }).length;
    main.appendChild(el('<div class="pagehead"><h1>Your profile</h1><p>Progress is saved in this browser on this device.</p></div>'));
    main.appendChild(el('<div class="statgrid"><div class="fact y"><div class="fv">' + S.xp + '</div><div class="fl">total XP</div></div><div class="fact b"><div class="fv">Lv ' + lv.lv + '</div><div class="fl">level</div></div><div class="fact"><div class="fv">🔥 ' + streakNow() + '</div><div class="fl">day streak</div></div><div class="fact g"><div class="fv">' + lessonsDone + " / " + LESSONS.length + '</div><div class="fl">lessons done</div></div><div class="fact"><div class="fv">' + S.stats.predRight + '</div><div class="fl">correct predictions</div></div><div class="fact"><div class="fv">' + S.stats.runs + '</div><div class="fl">programs run</div></div></div>'));
    main.appendChild(el('<h2 style="margin:0 0 12px">Badges</h2>'));
    main.appendChild(el('<div class="badges-grid">' + BADGES.map(function (b) { return '<div class="bdg' + (S.badges[b.id] ? " got" : "") + '"><div class="bi">' + b.icon + "</div><div><b>" + b.name + "</b><span>" + b.desc + (S.badges[b.id] ? " ✓" : "") + "</span></div></div>"; }).join("") + "</div>"));
    var set = el('<section class="panel settings" style="margin-top:28px;max-width:520px"><h3>Settings</h3><label>Sound effects <input type="checkbox" class="snd"></label><label>Theme <select class="thm"><option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Daily goal <select class="gl"><option value="20">Casual (20 XP)</option><option value="50">Regular (50 XP)</option><option value="100">Serious (100 XP)</option><option value="200">Intense (200 XP)</option></select></label><div style="margin-top:14px"><button class="bb sm lava rst">Reset all progress</button></div></section>');
    main.appendChild(set);
    $(".snd", set).checked = S.settings.sound; $(".thm", set).value = S.settings.theme; $(".gl", set).value = String(S.settings.goal);
    $(".snd", set).onchange = function (e) { S.settings.sound = e.target.checked; save(); sfx("ok"); };
    $(".thm", set).onchange = function (e) { S.settings.theme = e.target.value; save(); applyTheme(); };
    $(".gl", set).onchange = function (e) { S.settings.goal = +e.target.value; save(); };
    $(".rst", set).onclick = function () { if (confirm("Erase all XP, badges, progress and saved code? This can't be undone.")) { S = fresh(); save(); showMe(); } };
  }

  /* ---------------- router ---------------- */
  function route() {
    var h = location.hash || "#/";
    var m = h.match(/^#\/lesson\/(\w+)/);
    if (m) showLesson(m[1]);
    else if (h === "#/practice" || h === "#/review") showPractice();
    else if (h === "#/dict") showDict();
    else if (h === "#/play") showPlay();
    else if (h === "#/me") showMe();
    else if (h === "#/ideas") showIdeas();
    else showHome();
  }
  /* ---------------- no zooming, no overscroll ---------------- */
  (function lockZoom() {
    var opts = { passive: false };
    document.addEventListener("wheel", function (e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, opts);
    document.addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && /^(=|\+|-|_|0)$/.test(e.key)) e.preventDefault(); }, opts);
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, opts); });
    document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, opts);
    var lastTap = 0;
    document.addEventListener("touchend", function (e) { var now = Date.now(); if (now - lastTap < 300 && !(e.target.closest && e.target.closest("input,textarea,select"))) e.preventDefault(); lastTap = now; }, opts);
  })();
  window.addEventListener("hashchange", route);
  document.addEventListener("DOMContentLoaded", function () { applyTheme(); route(); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  window.__app = { highlight: highlight, runCode: runCode, S: function () { return S; } };
})();

</script>
</body>
</html>
