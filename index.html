LESSONS.push({
  id: "loops2", tier: "Beginner", title: "Loop Patterns", subtitle: "Counting, totals, searching, building strings and nested loops",
  icon: "🔂",
  steps: [
    { type: "text", html: `<p class="lead">Almost every loop you'll ever write is one of a handful of <b>patterns</b>. Learn to recognize them and you can solve most loop problems by picking the right one.</p>
<table class="tbl"><tr><th>Pattern</th><th>What it does</th><th>Game example</th></tr>
<tr><td><b>Counter</b></td><td>Counts how many times something is true</td><td>How many players are alive?</td></tr>
<tr><td><b>Accumulator</b></td><td>Adds things up into a total</td><td>Total coins from all chests</td></tr>
<tr><td><b>Best-so-far</b></td><td>Keeps the biggest or smallest value</td><td>The high score</td></tr>
<tr><td><b>Search</b></td><td>Stops when it finds what it's looking for</td><td>Find the first free spawn</td></tr>
<tr><td><b>Builder</b></td><td>Builds up a string or a list</td><td>\"Ana, Ben, Cleo\"</td></tr>
<tr><td><b>Nested</b></td><td>A loop inside a loop: rows × columns</td><td>A grid or wall of bricks</td></tr></table>` },
    { type: "example", title: "Worked example: counter and accumulator",
      goals: { 1: "Set up: start the counter and total at 0", 4: "Repeat: loop over every number", 5: "Update: only when the condition is true", 10: "Use the result after the loop" },
      code: `local evenCount = 0
local total = 0

for n = 1, 10 do
    if n % 2 == 0 then
        evenCount += 1
        total += n
    end
end

print("Even numbers:", evenCount)
print("Their total:", total)`,
      notes: {
        1: "Counters and totals <b>start at 0 before the loop</b>. Put them inside the loop by mistake and they reset every time!",
        5: "<code>n % 2 == 0</code> is true for even numbers: no remainder when divided by 2.",
        6: "<b>Counter</b>: +1 each time the condition is true.",
        7: "<b>Accumulator</b>: + the value itself. 2+4+6+8+10 = 30.",
        11: "Use the results <b>after</b> the loop finishes."
      }, run: true },
    { type: "trace", id: "loops2-t1", title: "Trace the accumulator",
      prompt: "Fill in <code>i</code> and <code>total</code> at each moment.",
      code: `local total = 0
for i = 1, 4 do
    total = total + i * 2
end
print(total)`,
      table: [["Moment", "i", "total"], ["Before the loop", "-", "0!"], ["After pass 1", "1!", "2"], ["After pass 2", "2!", "6"], ["After pass 3", "3!", "12"], ["After pass 4", "4!", "20"]],
      explain: "Each pass adds i × 2: 2, then 4, then 6, then 8. The total grows 2 → 6 → 12 → 20." },
    { type: "example", title: "Worked example: search with break, and best-so-far",
      code: `-- SEARCH: the first number above 50 that divides by 7
local found = nil
for n = 51, 100 do
    if n % 7 == 0 then
        found = n
        break
    end
end
print("Found:", found)

-- BEST-SO-FAR: highest of 6 dice rolls
local best = 0
for roll = 1, 6 do
    local value = math.random(1, 6)
    if value > best then
        best = value
    end
end
print("Best roll:", best)`,
      notes: {
        2: "Start as nil: \"not found yet\".",
        6: "<code>break</code> stops the loop as soon as we find it. No point checking the rest.",
        9: "If nothing matched, found would still be nil, so code using it should check.",
        12: "Best-so-far starts at a value that anything will beat.",
        15: "Only replace it when the new value is <b>better</b>."
      }, run: true },
    { type: "fill", id: "loops2-f1", title: "Builder pattern: join with dashes",
      prompt: "Build the string <code>1-2-3-4-5</code>: add each number, and a dash after every number except the last.",
      code: `local text = ""
for i = 1, 5 do
    text = text .. [[i]]
    if i < [[5]] then
        text = text .. "-"
    end
end
print(text)`,
      explain: "The builder starts empty and grows each pass. The if stops a dash appearing after the last number. (For tables, <code>table.concat(list, \"-\")</code> does this in one line.)" },
    { type: "text", html: `<h3>Nested loops: loops inside loops</h3><p>The inner loop runs <b>completely</b> for <b>every single pass</b> of the outer loop. A loop of 4 rows containing a loop of 6 columns runs the inner code 4 × 6 = 24 times. That's how you build grids, walls and floors.</p>` },
    { type: "predict", id: "loops2-p1", prompt: "How many times does <code>count += 1</code> run?",
      code: `local count = 0
for row = 1, 3 do
    for col = 1, 4 do
        count += 1
    end
end
print(count)`,
      options: ["7", "12", "4", "3"], answer: 1,
      explain: "For each of the 3 rows, the inner loop runs 4 times: 3 × 4 = 12." },
    { type: "example", title: "Worked example: a checkerboard wall", showWorld: true,
      goals: { 1: "Outer loop: one pass per row", 2: "Inner loop: one pass per brick in the row", 3: "Build one brick", 12: "Pick a color with %" },
      code: `for row = 1, 4 do

end`,
      notes: {
        1: "4 rows…",
        2: "…each with 6 bricks: 24 bricks total.",
        5: "<b>col</b> controls left-right (X) and <b>row</b> controls height (Y). Using both loop variables places every brick in its own spot.",
        10: "<code>(row + col) % 2</code> flips between 0 and 1 as you step across or up, which gives the checkerboard. Look at the side view!"
      }, run: true },
    { type: "code", id: "loops2-c1", title: "Make: FizzBuzz (the classic)",
      task: `Loop from 1 to 15. For each number print <code>FizzBuzz</code> if it divides by both 3 and 5, <code>Fizz</code> if it divides by 3, <code>Buzz</code> if it divides by 5, otherwise the number itself.
<p class="small">This is a famous interview question. The trick is the <b>order</b> of the checks.</p>`,
      starter: `for i = 1, 15 do

end`,
      checks: [
        { label: "Prints the right 15 lines", test: function (r) { return outIs(r, ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]); } },
        { label: "Uses %", test: function (r, c) { return code_(c, /%/); } }
      ],
      hints: ["Divides by 3 means <code>i % 3 == 0</code>.", "Check <b>both</b> first: <code>if i % 3 == 0 and i % 5 == 0 then</code>. Otherwise 15 would print just Fizz."],
      solution: `for i = 1, 15 do
    if i % 3 == 0 and i % 5 == 0 then

    elseif i % 3 == 0 then
        print("Fizz")
    elseif i % 5 == 0 then
        print("Buzz")
    else
        print(i)
    end
end` },
    { type: "code", id: "loops2-c2", title: "Make: a brick pyramid", showWorld: true,
      task: `Use nested loops to build a pyramid of <b>5 levels</b>. Level 1 (bottom) has 5 bricks, level 2 has 4… level 5 has 1. Each brick is <code>Vector3.new(4, 2, 2)</code>. Shift each level right by 2 studs so it's centered.
<p class="small">Hint: the number of bricks on a level is <code>6 - level</code>.</p>`,
      starter: `for level = 1, 5 do
    local bricks = 6 - level
    for i = 1, bricks do
        -- make one brick at the right X and Y
    end
end`,

<tr><td>false</td><td>false</td><td>false</td><td>false</td><td>true</td></tr></table>

<tr><td>X is not a valid member of Y</td><td>Wrong name or capital letters, or the child hasn't loaded yet (use WaitForChild)</td></tr>
<tr><td>Infinite yield possible on WaitForChild</td><td>Waiting for something that never appears: probably the wrong name or path</td></tr>
<tr><td>'end' expected / unexpected symbol</td><td>A missing <code>end</code>, bracket or quote, usually just <i>above</i> the reported line</td></tr></table>` },

<tr><td><b>UserInputService</b></td><td>Listening to any raw input: \"a key was pressed\"</td></tr>
<tr><td><b>ContextActionService</b></td><td>Binding an <i>action</i> to keys, with an automatic mobile button</td></tr>
<tr><td><b>Input Action System</b> (new in 2026)</td><td>Cross-platform controls: one action, many bindings (keyboard, gamepad, touch), set up in the Input Action Manager</td></tr></table>` },

UserInputService.InputBegan:Connect(function(input, gameProcessed)

        4: "<code>gameProcessed</code> is true when Roblox already used the input, for example while the player is <b>typing in chat</b>. Without this check, typing \"hello\" would trigger your E key! (Look at the 2-second press in the Output.)",
        6: "Compare <code>input.KeyCode</code> with an <code>Enum.KeyCode</code>."
      }, run: true },
    { type: "predict", id: "input-p1", prompt: "A player types the word <b>\"queen\"</b> in chat. With the gameProcessed check removed, what happens?",
      norun: true,
      code: `UserInputService.InputBegan:Connect(function(input, gameProcessed)
    if input.KeyCode == Enum.KeyCode.Q then
        print("Use ability")
    end
end)`,
      options: ["Nothing", "\"Use ability\" prints, because the Q in queen counts as a key press", "Error", "The chat breaks"], answer: 1,
      explain: "Every key typed in chat still fires InputBegan, with <code>gameProcessed = true</code>. Always ignore processed input for gameplay keys." },
    { type: "example", title: "Worked example: ContextActionService sprint",
      setup: `__sim.asClient("Ana")`, chunkName: "StarterPlayerScripts.LocalScript",
      sim: `__sim.at(1, function() __sim.key("LeftShift", 2) end)
__sim.at(1.5, function() __sim.log("WalkSpeed = " .. workspace.Ana.Humanoid.WalkSpeed) end)
__sim.at(3.5, function() __sim.log("WalkSpeed = " .. workspace.Ana.Humanoid.WalkSpeed) end)`,
      code: `local ContextActionService = game:GetService("ContextActionService")
local player = game:GetService("Players").LocalPlayer

local function sprint(actionName, inputState, inputObject)
    local humanoid = player.Character and player.Character:FindFirstChild("Humanoid")
    if not humanoid then return end
    if inputState == Enum.UserInputState.Begin then
        humanoid.WalkSpeed = 28

end

ContextActionService:BindAction("Sprint", sprint, true, Enum.KeyCode.LeftShift, Enum.KeyCode.ButtonL3)`,
      notes: {

        7: "<b>Begin</b> = key pressed down, <b>End</b> = released. That's perfect for \"hold to sprint\".",
        14: "<code>BindAction(name, function, createTouchButton, ...keys)</code>. <code>true</code> makes an on-screen button for mobile players. You can list several keys (here Shift <b>and</b> a gamepad stick click). Use <code>UnbindAction(\"Sprint\")</code> to turn it off."

    { type: "text", html: `<h3>The Input Action System (2026)</h3><p>Roblox's newest input framework <b>was fully released in June 2026</b>. Instead of checking devices in code, you create three kinds of objects:</p>
<ul><li><b>InputContext</b>: a group of actions you can switch on or off together (\"OnFoot\", \"Driving\", \"Menu\").</li><li><b>InputAction</b>: one thing the player wants to do (\"Sprint\", \"Jump\").</li><li><b>InputBinding</b>: one way to trigger it (LeftShift, a gamepad button, a touch button).</li></ul>
<p>You usually build these in Studio with the <b>Input Action Manager</b> (Window → Input → Input Action Manager), but you can create them in code too.</p>` },
    { type: "example", title: "Worked example: the Input Action System",
      setup: `__sim.asClient("Ana")`, chunkName: "StarterPlayerScripts.LocalScript",
      sim: `__sim.at(1, function() __sim.key("F", 0.5) end)
__sim.at(3, function() __sim.key("F", 0.5) end)`,
      code: `local ReplicatedStorage = game:GetService("ReplicatedStorage")

local context = Instance.new("InputContext")
context.Name = "OnFoot"
context.Parent = ReplicatedStorage

local wave = Instance.new("InputAction")
wave.Name = "Wave"
wave.Parent = context

local keyboard = Instance.new("InputBinding")
keyboard.KeyCode = Enum.KeyCode.F
keyboard.Parent = wave

local gamepad = Instance.new("InputBinding")
gamepad.KeyCode = Enum.KeyCode.ButtonY
gamepad.Parent = wave

wave.Pressed:Connect(function()
    print("Wave!")
end)
wave.Released:Connect(function()
    print("Stop waving")
    context.Enabled = false
    print("OnFoot controls disabled")
end)`,
      notes: {
        3: "The context groups related actions. Turning <code>context.Enabled</code> off disables all of them at once. That's great for cutscenes and menus.",
        7: "One action: the <i>verb</i> the player performs. Its <code>Type</code> defaults to Bool (pressed or not). Other types like Direction2D are for movement sticks.",
        11: "Each binding is one way to trigger the action. Add as many as you want: keyboard, gamepad, or a touch button via <code>binding.UIButton</code>.",
        19: "<code>Pressed</code> and <code>Released</code> fire for Bool actions. <code>StateChanged</code> fires for every type, and <code>action:GetState()</code> reads the current value.",

    { type: "code", id: "input-make", title: "Make: hold-to-sprint with stamina",
      setup: `__sim.asClient("Ana")`, chunkName: "StarterPlayerScripts.LocalScript", timeLimit: 12,
      sim: `__sim.at(1, function() __sim.key("LeftShift", 1) end)
__sim.at(1.5, function() __sim.log("WalkSpeed = " .. workspace.Ana.Humanoid.WalkSpeed) end)
__sim.at(2.5, function() __sim.log("WalkSpeed = " .. workspace.Ana.Humanoid.WalkSpeed) end)
__sim.at(3, function() __sim.key("E", 0.2, true) end)
__sim.at(4, function() __sim.key("LeftShift", 5) end)
__sim.at(8.5, function() __sim.log("WalkSpeed = " .. workspace.Ana.Humanoid.WalkSpeed) end)`,
      task: `Make <b>LeftShift</b> a hold-to-sprint key (any of the three input tools is fine). While held, WalkSpeed is <b>28</b>; on release it goes back to <b>16</b>. Add <b>stamina</b>: sprinting for more than <b>3 seconds</b> in a row automatically stops the sprint (WalkSpeed back to 16), even if the key is still held.
<p class="small">The simulation holds Shift for 1 second, then for 5 seconds. Expected: 28 while held, 16 after release, and 16 at 8.5s because stamina ran out after 3 seconds.</p>`,
      starter: `local Players = game:GetService("Players")
local player = Players.LocalPlayer
local SPRINT_SPEED = 28
local WALK_SPEED = 16
local MAX_SPRINT_TIME = 3

`,
      checks: [
        { label: "Sprints at 28 while Shift is held", test: function (r) { return logged(r, /^WalkSpeed = 28$/); } },
        { label: "Back to 16 after release (2.5s)", test: function (r) { return r.lines.some(function (l) { return l.t === 2.5 && /WalkSpeed = 16/.test(l.text); }); } },
        { label: "Stamina stops the sprint (16 at 8.5s while still holding)", test: function (r) { return r.lines.some(function (l) { return l.t === 8.5 && /WalkSpeed = 16/.test(l.text); }); } },
        { label: "No errors", test: noErr }
      ],
      hints: ["Use ContextActionService like the worked example. On Begin set 28, on End set 16.", "For stamina: when sprinting starts, remember a number like <code>sprintId += 1</code> and start <code>task.delay(MAX_SPRINT_TIME, function() ... end)</code>.", "Inside the delay, only stop the sprint if the id hasn't changed (meaning it's still the same sprint): <code>if myId == sprintId then humanoid.WalkSpeed = WALK_SPEED end</code>."],
      solution: `local Players = game:GetService("Players")
local ContextActionService = game:GetService("ContextActionService")
local player = Players.LocalPlayer
local SPRINT_SPEED = 28
local WALK_SPEED = 16
local MAX_SPRINT_TIME = 3
local sprintId = 0

local function sprint(actionName, inputState)
    local humanoid = player.Character and player.Character:FindFirstChild("Humanoid")
    if not humanoid then return end

    if inputState == Enum.UserInputState.Begin then
        sprintId += 1
        local myId = sprintId
        humanoid.WalkSpeed = SPRINT_SPEED
        task.delay(MAX_SPRINT_TIME, function()
            if myId == sprintId then
                humanoid.WalkSpeed = WALK_SPEED -- out of stamina
            end
        end)
    elseif inputState == Enum.UserInputState.End then
        sprintId += 1 -- cancels the pending stamina timer
        humanoid.WalkSpeed = WALK_SPEED
    end
end

ContextActionService:BindAction("Sprint", sprint, true, Enum.KeyCode.LeftShift)` },
    { type: "deep", title: "The \"token\" trick for cancelling timers", html: `<p>The sprint solution uses a counter (<code>sprintId</code>) as a <b>token</b>. Every new sprint gets a new number. A delayed callback remembers the number it was created with, and only acts if that number is still current. This simple pattern solves a whole family of bugs: old timers, stale tweens and outdated network replies all have to check \"am I still the latest?\" You could also store the thread from <code>task.delay</code> and call <code>task.cancel(thread)</code>.</p>` },

      { q: "In the Input Action System, what is an InputBinding?", options: ["A group of actions", "One way to trigger an action (a key, a gamepad button, a touch button)", "A RemoteEvent", "A GUI"], answer: 1, explain: "Context → Action → Bindings." },
      { q: "Why add <code>true</code> as the 3rd argument of BindAction?", options: ["It makes it faster", "It creates an on-screen button so mobile players can use the action", "It's required", "It sinks input"], answer: 1, explain: "Phones have no keyboard, so CAS can make a touch button for you." }
    ] },
    { type: "reflect", id: "input-r", prompt: "Your game has walking controls and a car. Explain how InputContexts would help switch controls when a player gets into the car.", model: "Put walking actions (Sprint, Jump, Interact) in an OnFoot context and car actions (Steer, Accelerate, Exit) in a Driving context. When the player sits in the car, disable OnFoot and enable Driving; when they get out, swap back. Each context switches a whole set of actions on or off at once, so the same keys can mean different things without messy if-checks." },
    { type: "studio", title: "Studio mission: an ability key", html: `<ol><li>In <b>StarterPlayer → StarterPlayerScripts</b>, add a <b>LocalScript</b>.</li><li>Make <b>Q</b> print \"Ability!\" using UserInputService, with the gameProcessed check.</li><li>Bonus: open <b>Window → Input → Input Action Manager</b> and create the same action with a keyboard and a gamepad binding.</li></ol>` }
  ]
});

LESSONS.push({

    { type: "text", html: `<p class="lead">Swords, flashlights, potions, guns: anything a player holds is a <b>Tool</b>. A Tool usually contains a part named exactly <code>Handle</code> (where the hand grabs it). Tools live in the player's <b>Backpack</b>, and when equipped they move <b>into the character</b>.</p>

Player
 └─ Backpack         ← unequipped tools
workspace.Ana        ← the character
 └─ Sword (Tool)     ← equipped tools move here
     └─ Handle (Part)</pre>
<p>Key events: <code>Equipped</code>, <code>Unequipped</code>, and <code>Activated</code> (the player clicked or tapped while holding it).</p>` },
    { type: "why", title: "Why it matters where tool code runs", html: `<p><code>Activated</code> fires on <b>both</b> the client and the server. Cosmetic things (swing animation, sound, crosshair) can run on the client for instant feel. <b>Damage must be decided on the server</b>, or exploiters could hit anyone from anywhere.</p>` },

__sim.at(2, function() __sim.equip("Torch", "Ana") end)
__sim.at(3, function() __sim.activate("Ana") end)
__sim.at(3.2, function() __sim.activate("Ana") end)
__sim.at(5, function() __sim.activate("Ana") end)`,

    torch.Equipped:Connect(function()

    { type: "predict", id: "tools-p1", norun: true, prompt: "A sword script does damage like this in a <b>LocalScript</b>. What's wrong?",

      explain: "Damage must happen on the server. The usual setup is a client that shows the swing and a <b>server Script</b> (in the tool or in ServerScriptService) that checks hits and applies damage." },
    { type: "code", id: "tools-make", title: "Make: a fair sword",
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") __sim.addPlayer("Ben") end)
__sim.at(2, function() __sim.equip("Sword", "Ana") end)

__sim.at(6, function() __sim.log("Ben's health: " .. workspace.Ben.Humanoid.Health) end)`,
      task: `Every player gets a <b>Sword</b> (built for you below). Finish the server logic:

<p class="small">The simulation: in swing 1 the blade touches Ben twice and Ana's own hand once. It touches Ben again when not swinging, then in swing 2. Expected: <b>Ben's health 60</b>.</p>`,
      starter: `local Players = game:GetService("Players")

local template = Instance.new("Tool")
template.Name = "Sword"

h.Name = "Handle"

    -- Activated: start a swing

end)`,
      checks: [
        { label: "Ben ends at 60 health", test: function (r) { return logged(r, /Ben's health: 60\b/); } },
        { label: "Uses Activated and Touched", test: function (r, c) { return code_(c, /Activated\s*:\s*Connect/) && code_(c, /Touched\s*:\s*Connect/); } },
        { label: "Ana never hurts herself", test: function (r) { return !r.lines.some(function (l) { return /Ana died/.test(l.text); }) && r.world && r.world.players.some(function (p) { return p.n === "Ana" && p.hp === 100; }); } },
        { label: "No errors", test: noErr }
      ],
      hints: ["Activated: <code>if not sword.Enabled then return end</code>, then <code>sword.Enabled = false</code>, <code>swinging = true</code>, <code>table.clear(hitThisSwing)</code>, <code>task.wait(0.5)</code>, <code>swinging = false</code>, <code>sword.Enabled = true</code>.", "Touched: <code>if not swinging then return end</code>. Get <code>local character = hit.Parent</code> and its Humanoid. Skip it if <code>character == player.Character</code>.", "Then <code>if hitThisSwing[character] then return end</code>, set <code>hitThisSwing[character] = true</code>, and call <code>humanoid:TakeDamage(DAMAGE)</code>."],
      solution: `local Players = game:GetService("Players")

local template = Instance.new("Tool")
template.Name = "Sword"
local h = Instance.new("Part")
h.Name = "Handle"
h.Parent = template

Players.PlayerAdded:Connect(function(player)

    { type: "studio", title: "Studio mission: a working tool", html: `<ol><li>Insert a <b>Tool</b> into <b>StarterPack</b>. Inside it, add a Part named <b>Handle</b>.</li><li>Add a <b>Script</b> inside the tool that prints on <code>Activated</code>.</li><li>Press Play, press <b>1</b> to equip it, then click.</li></ol>` }
  ]

      setup: `__sim.part("Coin", {Position = Vector3.new(0, 3, 0), Size = Vector3.new(2, 2, 1), Color = Color3.fromRGB(255, 200, 0), Material = Enum.Material.Neon})`,

      code: `local Debris = game:GetService("Debris")

sound.Volume = 0.6
sound.Parent = coin

local sparkles = Instance.new("ParticleEmitter")
sparkles.Enabled = false
sparkles.Parent = coin

local collected = false
coin.Touched:Connect(function(hit)
    if collected or not hit.Parent:FindFirstChild("Humanoid") then return end
    collected = true

    sound:Play()
    sparkles:Emit(25)

    local glow = Instance.new("Highlight")

    sound.Ended:Wait()
    coin:Destroy()

        5: "Sounds play audio assets by ID. A Sound inside a <b>part</b> plays in 3D (louder when you're close). Inside SoundService it plays flat, which suits UI clicks.",

        19: "…instead, <code>:Emit(25)</code> fires a one-time burst. That's ideal for impacts and pickups.",
        21: "A <b>Highlight</b> outlines or tints a whole model, making things glow, flash or stand out through walls.",
        24: "Clean up automatically after 0.3 seconds.",
        27: "Wait for the sound to finish <b>before</b> destroying the coin. Destroying a part also destroys the sounds inside it, which would cut the audio off."

      solution: `local Debris = game:GetService("Debris")

    local character = player.Character

      code: `local PathfindingService = game:GetService("PathfindingService")

local path = PathfindingService:CreatePath({

local ok, err = pcall(function()

    local waypoints = path:GetWaypoints()

        { label: "Uses .Magnitude", test: function (r, c) { return code_(c, /\.Magnitude/); } },

      ],
      hints: ["Start with <code>local nearest, nearestDist = nil, maxDistance</code>.", "Loop <code>for _, player in ipairs(Players:GetPlayers()) do</code>, get <code>player.Character</code>, its HumanoidRootPart and Humanoid, and skip if any is missing or Health &lt;= 0.", "<code>local d = (root.Position - position).Magnitude</code>, then <code>if d &lt; nearestDist then nearest, nearestDist = player, d end</code>. Return nearest at the end."],
      solution: `local Players = game:GetService("Players")

local function getNearestPlayer(position, maxDistance)
    local nearest, nearestDist = nil, maxDistance
    for _, player in ipairs(Players:GetPlayers()) do
        local character = player.Character
        local root = character and character:FindFirstChild("HumanoidRootPart")
        local humanoid = character and character:FindFirstChild("Humanoid")
        if root and humanoid and humanoid.Health > 0 then
            local d = (root.Position - position).Magnitude
            if d < nearestDist then
                nearest, nearestDist = player, d
            end
        end

      solution: `local PathfindingService = game:GetService("PathfindingService")

    return true

  steps: [
    { type: "text", html: `<p class="lead">Roblox games earn Robux in two main ways:</p>
<table class="tbl"><tr><th></th><th>Game Pass</th><th>Developer Product</th></tr>

<tr><td>Examples</td><td>VIP, 2× coins, a special sword</td><td>500 coins, a revive, a potion</td></tr>
<tr><td>Check it with</td><td><code>UserOwnsGamePassAsync</code></td><td>The <b>ProcessReceipt</b> callback</td></tr></table>
<p>You create both on the Creator Hub (your game → <b>Monetization</b>) and use their IDs in code.</p>` },
    { type: "box", kind: "warn", title: "Monetize fairly", html: `<p>Players, often young ones, are spending real money. Be honest about what they get, follow Roblox's policies (including the rules on paid random items), and never design pay-to-win traps. Fair games get better reviews and more players, and keep players longer.</p>` },
    { type: "example", title: "Worked example: a VIP Game Pass",
      sim: `__sim.ownPass("Ana", 123456)
__sim.at(1, function() __sim.addPlayer("Ana") __sim.addPlayer("Ben") end)
__sim.at(3, function() game:GetService("MarketplaceService"):PromptGamePassPurchase(game.Players.Ben, 123456) end)
__sim.at(4, function() __sim.buyPass("Ben", 123456, true) end)`,
      code: `local Players = game:GetService("Players")
local MarketplaceService = game:GetService("MarketplaceService")
local VIP_PASS_ID = 123456

local function giveVipPerks(player)
    print("⭐ " .. player.Name .. " gets VIP perks")
    player:SetAttribute("VIP", true)
end

Players.PlayerAdded:Connect(function(player)
    local ok, owns = pcall(function()
        return MarketplaceService:UserOwnsGamePassAsync(player.UserId, VIP_PASS_ID)
    end)
    if ok and owns then
        giveVipPerks(player)
    end
end)

MarketplaceService.PromptGamePassPurchaseFinished:Connect(function(player, passId, wasPurchased)

        giveVipPerks(player)
    end
end)`,
      notes: {
        11: "<code>UserOwnsGamePassAsync</code> asks Roblox's servers, so it can fail. Use pcall.",
        14: "Owners get their perks every time they join.",
        19: "Players can also buy <b>during</b> the game (after <code>PromptGamePassPurchase</code>). This event lets you give the perk immediately, without rejoining."
      }, run: true },
    { type: "text", html: `<h3>Developer Products and ProcessReceipt</h3><p>For repeatable purchases, Roblox calls your <b>ProcessReceipt</b> function with a <b>receipt</b> (who bought what: PlayerId, ProductId, and a unique PurchaseId). Your function must give the item and return a decision:</p>
<ul><li><code>Enum.ProductPurchaseDecision.PurchaseGranted</code>: \"I gave it, we're done.\"</li><li><code>Enum.ProductPurchaseDecision.NotProcessedYet</code>: \"I couldn't do it yet, ask me again later.\" Roblox re-delivers the receipt, for example when the player rejoins.</li></ul>` },
    { type: "predict", id: "money-p1", norun: true, prompt: "A player buys 500 coins and immediately leaves. Your ProcessReceipt can't find them in the game. What should it return?",
      code: `MarketplaceService.ProcessReceipt = function(receipt)
    local player = Players:GetPlayerByUserId(receipt.PlayerId)
    if not player then
        return ???
    end
    -- grant coins...
end`,
      options: ["PurchaseGranted, because they paid, so it's done", "NotProcessedYet, so Roblox tries again when they're back and they don't lose their purchase", "nil", "error()"], answer: 1,
      explain: "Returning PurchaseGranted without giving anything means they paid and got nothing. <b>Only return PurchaseGranted after the item has definitely been given.</b>" },
    { type: "code", id: "money-make", title: "Make: a safe coin shop",
      setup: `game.Players.PlayerAdded:Connect(function(p) local ls = Instance.new("Folder") ls.Name = "leaderstats" ls.Parent = p local c = Instance.new("IntValue") c.Name = "Coins" c.Parent = ls end)`,
      sim: `__sim.at(1, function() __sim.addPlayer("Ana") __sim.addPlayer("Ben") end)

__sim.at(3, function() __sim.buyProduct("Ben", 1002, 199) end)
__sim.at(4, function() __sim.buyProduct("Cleo", 1001, 49) end)
__sim.at(6, function() __sim.addPlayer("Cleo") end)
__sim.at(7, function() __sim.redeliverReceipts() end)
__sim.at(9, function() for _, n in ipairs({"Ana", "Ben", "Cleo"}) do __sim.log(n .. " coins: " .. game.Players[n].leaderstats.Coins.Value) end end)`,
      task: `Write a <b>ProcessReceipt</b> for two coin packs: <code>PRODUCTS = {[1001] = 100, [1002] = 550}</code>.
<ul><li>Find the player with <code>Players:GetPlayerByUserId(receipt.PlayerId)</code>. If they're not in the game, return <b>NotProcessedYet</b>.</li><li>Unknown product? Return NotProcessedYet and warn.</li><li>Add the coins to <code>leaderstats.Coins</code> and return <b>PurchaseGranted</b>.</li><li><b>Never grant the same PurchaseId twice</b>: remember the processed ones in a table.</li></ul>
<p class="small">The simulation: Ana buys 100, Ben buys 550, and Cleo buys 100 while she's <b>not in the game</b>. She joins later and Roblox re-delivers her receipt. Expected: <b>Ana 100, Ben 550, Cleo 100</b>.</p>`,
      starter: `local Players = game:GetService("Players")
local MarketplaceService = game:GetService("MarketplaceService")

local PRODUCTS = {
    [1001] = 100,
    [1002] = 550,
}
local processed = {}

MarketplaceService.ProcessReceipt = function(receipt)

end`,
      checks: [
        { label: "Ana has 100 coins", test: function (r) { return logged(r, /Ana coins: 100$/); } },
        { label: "Ben has 550 coins", test: function (r) { return logged(r, /Ben coins: 550$/); } },
        { label: "Cleo gets her 100 after rejoining", test: function (r) { return logged(r, /Cleo coins: 100$/); } },
        { label: "Uses NotProcessedYet and PurchaseGranted", test: function (r, c) { return code_(c, /NotProcessedYet/) && code_(c, /PurchaseGranted/); } },
        { label: "Remembers PurchaseIds", test: function (r, c) { return code_(c, /processed\s*\[\s*receipt\.PurchaseId\s*\]/); } },
        { label: "No errors", test: noErr }
      ],
      hints: ["First: <code>if processed[receipt.PurchaseId] then return Enum.ProductPurchaseDecision.PurchaseGranted end</code> (it was already given).", "Then get the player and <code>local amount = PRODUCTS[receipt.ProductId]</code>. If either is missing, return NotProcessedYet.", "Give the coins, set <code>processed[receipt.PurchaseId] = true</code>, and return PurchaseGranted."],
      solution: `local Players = game:GetService("Players")
local MarketplaceService = game:GetService("MarketplaceService")

local PRODUCTS = {
    [1001] = 100,
    [1002] = 550,
}
local processed = {}

MarketplaceService.ProcessReceipt = function(receipt)
    -- already handled? (Roblox can deliver the same receipt again)
    if processed[receipt.PurchaseId] then
        return Enum.ProductPurchaseDecision.PurchaseGranted
    end

    local player = Players:GetPlayerByUserId(receipt.PlayerId)
    if not player then
        return Enum.ProductPurchaseDecision.NotProcessedYet
    end

    local amount = PRODUCTS[receipt.ProductId]
    if not amount then
        warn("Unknown product " .. tostring(receipt.ProductId))
        return Enum.ProductPurchaseDecision.NotProcessedYet
    end

    local coins = player:FindFirstChild("leaderstats") and player.leaderstats:FindFirstChild("Coins")
    if not coins then
        return Enum.ProductPurchaseDecision.NotProcessedYet
    end

    coins.Value += amount
    processed[receipt.PurchaseId] = true
    print("Gave " .. amount .. " coins to " .. player.Name)
    return Enum.ProductPurchaseDecision.PurchaseGranted
end` },
    { type: "deep", title: "Production-grade receipts", html: `<ul><li><b>Save first, then grant.</b> In a real game, coins live in your saved data. The official pattern records the PurchaseId in a DataStore (with UpdateAsync) and only returns PurchaseGranted once the save succeeded, so a server crash can't lose a purchase. Libraries like <b>ProfileStore</b> include ready-made receipt handling.</li><li><b>Only one</b> ProcessReceipt can exist per game: put it in a single server Script and route products from a table, never one callback per script.</li><li><b>BindReceiptHandler</b> is a newer MarketplaceService API that lets you register handlers per product (with a filter list) and return <code>Enum.ReceiptDecision.Processed</code> or <code>NotProcessedYet</code>. Unmatched receipts fall through to ProcessReceipt.</li><li>Creator Hub flags products whose ProcessReceipt handling is broken, and they can't be sold outside your game until fixed.</li><li>Purchases you make in Studio are test purchases: you aren't charged.</li></ul>` },

      { q: "When is it safe to return PurchaseGranted?", options: ["Immediately", "Only after the item has definitely been given (and ideally saved)", "When the player leaves", "Never"], answer: 1, explain: "Granting before delivery can lose the player's purchase." },
      { q: "Why track PurchaseIds?", options: ["For analytics only", "Roblox may deliver the same receipt more than once; the ID stops you granting twice", "They're needed for Game Passes", "To find the product price"], answer: 1, explain: "Purchase handling must be idempotent: the same input gives the same result." },
      { q: "Where should ProcessReceipt be defined?", options: ["In a LocalScript", "In one server Script, once for the whole game", "In every product's script", "In StarterGui"], answer: 1, explain: "There's exactly one callback. Assigning it again replaces it." }
    ] },
    { type: "reflect", id: "money-r", prompt: "Walk through what happens, step by step, when a player buys a coin pack and the server crashes right after giving the coins but before returning PurchaseGranted. How does saving the PurchaseId help?", model: "Roblox never got PurchaseGranted, so it delivers the receipt again later (e.g. when the player joins another server). If the coins weren't saved, the player lost them in the crash, so granting again is correct. If the coins AND the PurchaseId were saved together, the new server sees the PurchaseId is already processed and just returns PurchaseGranted without giving the coins twice. Saving the ID together with the reward makes it safe either way." },
    { type: "studio", title: "Studio mission: a test Game Pass", html: `<ol><li>Publish your game, then on the Creator Hub go to <b>Monetization → Passes</b> and create a pass (you don't have to put it on sale).</li><li>Copy its ID into the VIP example and make VIPs walk faster.</li><li>In Studio, call <code>PromptGamePassPurchase</code> from a button. Studio purchases are test purchases.</li></ol>` }
  ]
});

/* ---------- Go deeper: optional extra depth for existing lessons ---------- */
var DEEP = [
  { lesson: "l1", after: "l1-bug", title: "How Lua actually runs your script", html: `<p>Before running anything, Luau <b>compiles</b> the whole script into bytecode. That's why a syntax error (like a missing quote) stops the <i>entire</i> script before line 1 runs, while a runtime error (like using nil) only stops it partway through. Studio's Script Editor underlines syntax errors as you type, so check for red squiggles before you press Play.</p>` },
  { lesson: "l2", after: "l2-p3", title: "Values vs references", html: `<p>Numbers, strings and booleans are copied when you assign them: <code>local b = a</code> makes an independent copy. <b>Tables and Instances are not copied</b>. The variable holds a <i>reference</i> (an arrow pointing to the same thing):</p><pre class="mini">local t1 = {coins = 5}
local t2 = t1
t2.coins = 99
print(t1.coins) --> 99 (same table!)</pre><p>This is why changing <code>part.Color</code> through any variable that points to the part changes the real part.</p>` },
  { lesson: "l3", after: "l3-p3", title: "Why 0.1 + 0.2 isn't exactly 0.3", html: `<p>Computers store decimals in binary, which can't represent some numbers exactly. <code>print(0.1 + 0.2)</code> shows <code>0.30000000000000004</code>. So never compare decimals with <code>==</code>. Check whether they're <i>close enough</i>: <code>math.abs(a - b) &lt; 0.0001</code>. Whole numbers up to about 9 quadrillion are always exact, so coins are safe.</p>` },
  { lesson: "l4", after: "l4-p3", title: "and/or return values (and the ternary trick)", html: `<p><code>and</code>/<code>or</code> don't just return true or false. They return one of their <b>operands</b>, and stop early (\"short-circuit\"):</p><pre class="mini">print(nil or "default")   --> default
print(5 and "yes")        --> yes
local label = isVIP and "VIP" or "Player"</pre><p>Short-circuiting is why <code>if part and part.Transparency == 0</code> is safe: if part is nil, the second check never runs. Luau also has a real if-expression: <code>local label = if isVIP then "VIP" else "Player"</code>.</p>` },
  { lesson: "l5", after: "l5-p3", title: "Loop gotchas", html: `<ul><li>A numeric for loop evaluates its start, stop and step <b>once</b>: changing the stop variable inside the loop doesn't change how many times it runs.</li><li>The loop variable <code>i</code> is local to the loop and gone after <code>end</code>.</li><li>Removing items from an array while looping forward skips elements. Loop <b>backwards</b> instead: <code>for i = #t, 1, -1 do</code>.</li></ul>` },
  { lesson: "l6", after: "l6-p3", title: "Functions are values (and recursion)", html: `<p>Functions can be stored in variables and tables, passed into other functions (like <code>:Connect(fn)</code>) and returned from functions. A function can even call <b>itself</b> (recursion), which is handy for tree-shaped things like searching every descendant:</p><pre class="mini">local function countParts(obj)
    local n = obj:IsA("BasePart") and 1 or 0
    for _, child in ipairs(obj:GetChildren()) do
        n += countParts(child)
    end
    return n
end</pre>` },
  { lesson: "l7", after: "l7-p2", title: "Copying tables (shallow vs deep)", html: `<p>Because tables are references, <code>local copy = original</code> doesn't copy anything. <code>table.clone(t)</code> makes a <b>shallow</b> copy: a new outer table, but nested tables are still shared. For a full copy of nested data (like a player-data template), write a recursive deep copy. Copy your DEFAULT data template for each new player, or they'd all share one table!</p>` },
  { lesson: "l8", after: "l8-bug", title: "Why set Parent last?", html: `<p>When an Instance is parented into the game, Roblox starts tracking it: replicating it to clients, running physics, firing ChildAdded. If you set Parent <b>first</b> and then change 10 properties, each change is another update to process and replicate. Setting properties first and Parent <b>last</b> does it all in one go. It's also why <code>Instance.new("Part", workspace)</code> (the parent argument) is discouraged for things you then configure.</p>` },
  { lesson: "l9", after: "l9-p2", title: "Each event handler runs in its own thread", html: `<p>When an event fires, Roblox runs each connected function in a <b>new thread</b>. That's why <code>task.wait</code> inside a Touched handler doesn't freeze the rest of your game, and why a debounce is needed: several touches can be \"inside\" the same handler at once, each in its own thread. Modern Roblox uses <b>deferred events</b>, so handlers run slightly after the event happens rather than instantly in the middle of other code.</p>` },
  { lesson: "l11", after: "l11-p2", title: "Error objects and error levels", html: `<p><code>error()</code> can throw <b>any value</b>, including a table: <code>error({code = "NO_COINS", need = 50})</code>. pcall then returns that table, so callers can react to specific error codes instead of parsing strings. <code>error(msg, 2)</code> blames the line that <i>called</i> your function, which is useful in modules to point at the caller's mistake.</p>` },
  { lesson: "l12", after: "l12-make", title: "Rate limiting properly: the token bucket", html: `<p>A one-second cooldown blocks legitimate fast actions. A <b>token bucket</b> is fairer: each player has a bucket of, say, 5 tokens that refills at 1 per second. Each request spends a token, and an empty bucket means the request is ignored. Short bursts are allowed, but spam isn't. Also use <b>UnreliableRemoteEvent</b> for frequent, cosmetic-only messages (like aim direction), where a few lost packets don't matter.</p>` },
  { lesson: "l13", after: "l13-p1", title: "Organizing a big project", html: `<p>Common structure: a few \"bootstrap\" Scripts that require <b>service modules</b> (DataService, ShopService, RoundService) on the server and <b>controller modules</b> on the client. Shared config and types go in ReplicatedStorage. Avoid two modules requiring each other (a <b>cyclic require</b>), which errors. Pass dependencies in, or split shared code into a third module.</p>` },
  { lesson: "l14", after: "l14-p2", title: "rawget, __newindex and read-only tables", html: `<p><code>__newindex</code> runs when you set a key that doesn't exist yet. Use it to log changes or block them, which makes read-only config tables possible. <code>rawget(t, k)</code> and <code>rawset(t, k, v)</code> skip metamethods entirely. Luau also has <code>table.freeze(t)</code> for making a table read-only in one line.</p>` },
  { lesson: "l15", after: "l15-p2", title: "What's inside a CFrame?", html: `<p>A CFrame is 12 numbers: a position (x, y, z) plus a 3×3 <b>rotation matrix</b>, whose columns are the RightVector, UpVector and −LookVector. Multiplying CFrames multiplies these matrices, which is why order matters (rotate-then-move ≠ move-then-rotate). You'll rarely touch the raw numbers, but knowing that \"CFrame = position + three direction arrows\" makes everything click.</p>` },
  { lesson: "l16", after: "l16-p2", title: "Heartbeat vs PreRender vs PreSimulation", html: `<p>RunService has several per-frame events. <b>Heartbeat</b> (after physics) is the general-purpose choice on server and client. <b>PreRender</b> (formerly RenderStepped) runs on the client right before drawing, for camera and visual-only updates. <b>PreSimulation</b> runs before physics, for applying forces. Keep per-frame code tiny: anything that runs 60 times a second multiplies its cost.</p>` },
  { lesson: "l17", after: "l17-p1", title: "Other spatial queries", html: `<p>Rays are thin lines. To ask \"what's inside this area?\", use <code>workspace:GetPartBoundsInBox(cframe, size, overlapParams)</code>, <code>GetPartBoundsInRadius(position, radius, params)</code>, or <code>GetPartsInPart(part)</code> for exact shapes. <code>workspace:Spherecast</code> and <code>Blockcast</code> sweep a shape along a line, which suits thick projectiles. All of these take filter params, just like raycasts.</p>` },
  { lesson: "l18", after: "l18-p1", title: "Limits, budgets and session locking", html: `<ul><li>Each key can store up to <b>4 MB</b>, and keys must be 50 characters or fewer.</li><li>Requests have a per-server <b>budget</b> that refills over time (<code>DataStoreService:GetRequestBudgetForRequestType</code>). Don't save on every coin pickup: save on leave, on BindToClose, and every few minutes (autosave).</li><li><b>Session locking</b>: if a player hops servers quickly, the old server might still be saving while the new one loads, and the stale data can overwrite the new. Libraries like ProfileStore lock a player's data to one server at a time.</li></ul>` },
  { lesson: "l19", after: "l19-p1", title: "The cleanup-bag pattern (Janitor/Trove)", html: `<p>Big systems create lots of connections, instances and threads. A <b>cleanup bag</b> object collects them: <code>bag:Add(connection)</code>, <code>bag:Add(part)</code>, and later one <code>bag:Destroy()</code> disconnects and destroys everything. Community libraries like Janitor and Trove do this, and you can write a tiny one yourself with what you learned in the OOP lesson.</p>` },
  { lesson: "l20", after: "l20-p1", title: "Generics and type functions", html: `<p>Generic functions work with any type while keeping it checked: <code>local function first&lt;T&gt;(list: {T}): T? return list[1] end</code>. Studio's New Type Solver also supports <b>type functions</b> (functions that compute types) and much better inference. Even without annotations, <code>--!strict</code> catches a surprising number of mistakes on its own.</p>` }
];

})();

/* ---------- Basics ---------- */
{ name: "print(...)", cat: "Basics", lesson: "l1", what: "Writes values to the Output window, separated by spaces.",

{ name: "warn(...)", cat: "Basics", lesson: "l11", what: "Like print, but shows in orange as a warning.",
  why: "Flag problems that aren't crashes (\"data failed to load, retrying…\") so they stand out in a busy Output.",
  ex: 'warn("Low on memory!")\nprint("normal message")' },

  why: "Explain <b>why</b> code exists (\"debounce because Touched fires per limb\"), or temporarily disable a line while testing.",
  ex: '-- Give the starting bonus\nlocal coins = 100 -- new players start rich\n--[[\nprint("this whole block is ignored")\n]]\nprint(coins)' },

{ name: "if / elseif / else / end", cat: "Logic", lesson: "l4", what: "Runs code only when a condition is true. Only the first matching branch runs.",

  ex: 'local hp = 25\nif hp <= 0 then\n    print("Dead")\nelseif hp < 30 then\n    print("Low health!")\nelse\n    print("Fine")\nend', mistake: "Putting looser checks before stricter ones (>= 50 before >= 90) means the strict branch never runs." },

  why: "The questions inside every if and while.",
  ex: 'print(5 == 5, 5 ~= 3, 2 < 1, "a" == "A")', mistake: "Using <code>=</code> (store) instead of <code>==</code> (compare), or <code>!=</code> (not Lua)." },
{ name: "and / or / not", cat: "Logic", lesson: "l4", what: "Combine or flip conditions. <code>a or b</code> also returns the first truthy value, which makes a handy default.",
  why: "Combined rules (\"has key AND level 5\"); defaults (<code>local dmg = attr or 10</code>); toggles (<code>open = not open</code>).",
  ex: 'local hasKey, level = true, 7\nprint(hasKey and level >= 5)\nlocal saved = nil\nprint(saved or 0)\nprint(not true)' },

  ex: 'if 0 then print("0 is truthy!") end\nlocal found = workspace:FindFirstChild("Nope")\nif not found then print("Not found, safely handled") end' },

  why: "Calculations (damage, distance), lookups (findPlayer), success flags (<code>return true, data</code>). Also used for early exits in guard clauses.",
  ex: 'local function minMax(a, b)\n    return math.min(a, b), math.max(a, b)\nend\nlocal lo, hi = minMax(9, 4)\nprint(lo, hi)' },
{ name: "function(...) end (anonymous)", cat: "Functions", lesson: "l6", what: "A function without a name, created inline.",
  why: "Event handlers and pcall bodies: <code>part.Touched:Connect(function(hit) ... end)</code>.",
  ex: 'local double = function(n) return n * 2 end\nprint(double(21))\nlocal ok, v = pcall(function() return 5 end)\nprint(ok, v)' },
{ name: "... (varargs) / select", cat: "Functions", what: "Accept any number of arguments.",
  why: "Utility functions like a custom log(...) that forwards everything to print.",
  ex: 'local function log(...)\n    print("[LOG]", ...)\n    print("got " .. select("#", ...) .. " args")\nend\nlog("a", 1, true)' },
{ name: "scope & closures", cat: "Functions", lesson: "l10", what: "Locals live inside the block they're created in. Inner functions remember the variables around them (closures).",
  why: "Each call to setupCoin(coin) gets its own debounce variable, so objects don't interfere with each other.",
  ex: 'local function makeCounter()\n    local n = 0\n    return function() n += 1 return n end\nend\nlocal a, b = makeCounter(), makeCounter()\nprint(a(), a(), b())' },

/* ---------- Tables ---------- */
{ name: "{ } array", cat: "Tables", lesson: "l7", what: "An ordered list, indexed from 1.",
  why: "Lists of things: spawn points, inventory, the queue of players waiting.",
  ex: 'local spawns = {"Red", "Blue", "Green"}\nprint(spawns[1], #spawns)\nprint(spawns[math.random(#spawns)])' },
{ name: "{ key = value } dictionary", cat: "Tables", lesson: "l7", what: "Values stored under names (keys). Keys can be strings, numbers, even Players or Instances.",
  why: "Prices, settings, stats, and per-player data (<code>data[player] = {...}</code>).",
  ex: 'local stats = {Health = 100, Speed = 16}\nstats.Speed += 4\nstats["Jump"] = 50\nprint(stats.Speed, stats.Jump)' },
{ name: "table.insert / table.remove", cat: "Tables", lesson: "l7", what: "Add to (the end, or a position) or remove from an array.",
  why: "Inventory add/remove, queues, keeping track of spawned objects.",
  ex: 'local q = {"Ana"}\ntable.insert(q, "Ben")\ntable.insert(q, 1, "Zed")\nprint(table.concat(q, ", "))\nprint("removed", table.remove(q, 1))' },
{ name: "table.find / table.sort / table.concat / table.clear", cat: "Tables", what: "Find a value's index, sort, join into a string, empty a table.",
  why: "Check whether an item is owned, rank a leaderboard, show a list as text, reset state.",
  ex: 'local scores = {40, 90, 10}\ntable.sort(scores, function(a, b) return a > b end)\nprint(table.concat(scores, " > "))\nprint(table.find({"Sword", "Bow"}, "Bow"))' },
{ name: "# (length)", cat: "Tables", lesson: "l7", what: "The number of items in an array (or characters in a string).",
  why: "Count players, coins left, or loop up to the end.",
  ex: 'print(#{"a", "b", "c"}, #"hello")', mistake: "# doesn't count dictionary keys. Loop with pairs and count instead." },
{ name: "table as a set: t[x] = true", cat: "Tables", lesson: "l21", what: "Use the keys as members: add with true, remove with nil, check with t[x].",
  why: "Who's still alive in a round, who has already claimed a reward. Faster than searching a list.",
  ex: 'local alive = {}\nalive["Ana"] = true\nalive["Ben"] = true\nalive["Ana"] = nil\nfor name in pairs(alive) do print(name, "is alive") end' },

/* ---------- Instances ---------- */
{ name: "game / workspace / script", cat: "Instances", lesson: "l8", what: "<code>game</code> is the root of everything; <code>workspace</code> is the 3D world; <code>script</code> is the running script itself.",
  why: "The starting points for finding anything in your game. <code>script.Parent</code> gets the object the script is inside.",
  ex: 'print(game.Name, workspace.Name)\nprint(script:GetFullName(), script.Parent)' },
{ name: "Instance.new(className)", cat: "Instances", lesson: "l8", what: "Creates a new object (Part, Folder, IntValue, Sound…).",
  why: "Spawn things from code: coins, projectiles, leaderstats, effects, generated levels.",
  ex: 'local p = Instance.new("Part")\np.Anchored = true\np.Position = Vector3.new(0, 5, 0)\np.Parent = workspace\nprint(p.ClassName, p.Name)', mistake: "Forgetting <code>.Parent = workspace</code>, so it never appears." },
{ name: ".Parent", cat: "Instances", lesson: "l8", what: "The object this one sits inside. Setting it moves the object; setting it to nil removes it from the game.",
  why: "Put new parts into the world, move items into a player's backpack, find the character from a body part (<code>hit.Parent</code>).",
  ex: 'local f = Instance.new("Folder")\nf.Name = "Stuff"\nf.Parent = workspace\nlocal p = Instance.new("Part")\np.Parent = f\nprint(p.Parent, p.Parent.Parent)' },
{ name: ".Name / :GetFullName()", cat: "Instances", what: "The object's name / its full path from the top of the tree.",
  why: "Find things by name, identify what touched something, debug where an object lives.",
  ex: 'local p = Instance.new("Part", workspace)\np.Name = "Lava"\nprint(p.Name, p:GetFullName())' },
{ name: ":Destroy()", cat: "Instances", lesson: "l8", what: "Permanently removes an object and everything inside it, and disconnects its events.",
  why: "Remove collected coins, expired bullets, old maps. Prevents memory leaks.",
  ex: 'local p = Instance.new("Part", workspace)\np.Name = "Temp"\np:Destroy()\nprint(workspace:FindFirstChild("Temp"))', mistake: "Trying to set Parent after Destroy errors (the Parent is locked)." },
{ name: ":Clone()", cat: "Instances", what: "Makes a copy of an object (and its children). The copy has no Parent until you set one.",
  why: "Spawn copies of a template: enemies from ServerStorage, maps, tools to give players.",
  ex: 'local t = Instance.new("Part")\nt.Name = "Coin"\nfor i = 1, 3 do\n    local c = t:Clone()\n    c.Position = Vector3.new(i * 5, 3, 0)\n    c.Anchored = true\n    c.Parent = workspace\nend\nprint(#workspace:GetChildren())' },
{ name: ":IsA(className)", cat: "Instances", what: "True if the object is that class, or inherits from it (Part :IsA(\"BasePart\") is true).",
  why: "Filter GetChildren/GetDescendants results to just parts, or just scripts.",
  ex: 'local p = Instance.new("Part")\nprint(p:IsA("Part"), p:IsA("BasePart"), p:IsA("Model"))' },
{ name: "Properties: Position, Size, Color, Anchored, CanCollide, Transparency, Material", cat: "Instances", lesson: "l8", what: "The settings that control how a part looks and behaves.",
  why: "Change the world from code: open doors (Transparency + CanCollide), lava (Color + Neon), platforms (Anchored).",
  ex: 'local p = Instance.new("Part")\np.Size = Vector3.new(8, 1, 8)\np.Position = Vector3.new(0, 10, 0)\np.Color = Color3.fromRGB(255, 80, 0)\np.Material = Enum.Material.Neon\np.Anchored = true\np.CanCollide = true\np.Transparency = 0.2\np.Parent = workspace\nprint(p.Material, p.Color)' },
{ name: "Color3.fromRGB / BrickColor.new", cat: "Instances", lesson: "l8", what: "Make colors from red/green/blue values (0–255), or from named BrickColors.",
  why: "Team colors, damage flashes, rainbow effects (<code>Color3.fromHSV</code>).",
  ex: 'local c = Color3.fromRGB(0, 170, 255)\nprint(c, BrickColor.new("Bright red"))\nprint(Color3.fromHSV(0.5, 1, 1))' },
{ name: "Enum.X.Y", cat: "Instances", lesson: "l8", what: "Fixed lists of options built into Roblox: Materials, easing styles, key codes…",
  why: "Some properties only accept specific choices. Enums give you the exact valid value (with autocomplete).",
  ex: 'print(Enum.Material.Neon, Enum.EasingStyle.Quad)\nlocal p = Instance.new("Part")\np.Material = Enum.Material.Wood\nprint(p.Material.Name)' },

/* ---------- Finding things ---------- */
{ name: "obj.ChildName", cat: "Finding Things", lesson: "l8", what: "Gets a child by name using a dot.",
  why: "Quick access to things you <i>know</i> exist (workspace.Baseplate).",
  ex: 'print(workspace.Baseplate.Size)', mistake: "Errors if the child doesn't exist (yet). Use FindFirstChild or WaitForChild when unsure." },
{ name: ":FindFirstChild(name)", cat: "Finding Things", lesson: "l8", what: "Returns the child with that name, or nil. It never errors.",
  why: "Safely check whether something exists: <code>hit.Parent:FindFirstChild(\"Humanoid\")</code> in every touch handler.",
  ex: 'local x = workspace:FindFirstChild("Dragon")\nif x then print("found") else print("no dragon, no crash") end' },
{ name: ":WaitForChild(name)", cat: "Finding Things", lesson: "l12", what: "Waits until a child exists, then returns it.",
  why: "Things that load in later: GUIs in PlayerGui, objects replicating to the client, a character's parts. Essential in LocalScripts.",
  ex: 'task.delay(1, function()\n    local f = Instance.new("Folder")\n    f.Name = "LateFolder"\n    f.Parent = workspace\nend)\nlocal f = workspace:WaitForChild("LateFolder")\nprint("Got it at", os.clock())', mistake: "Waiting for something that never appears gives an \"Infinite yield possible\" warning." },
{ name: ":GetChildren() / :GetDescendants()", cat: "Finding Things", lesson: "l8", what: "Array of direct children / of everything nested inside.",
  why: "Loop over every coin in a folder, every part in a model, every player.",
  ex: 'local f = Instance.new("Folder", workspace)\nfor i = 1, 3 do Instance.new("Part", f) end\nprint(#f:GetChildren(), #workspace:GetDescendants())' },
{ name: ":FindFirstChildOfClass / :FindFirstChildWhichIsA / :FindFirstAncestor", cat: "Finding Things", what: "Find by class instead of name, or search upward through parents.",
  why: "Find the Humanoid regardless of its name; find the Model a part belongs to.",
  ex: 'local m = Instance.new("Model", workspace)\nm.Name = "Car"\nlocal p = Instance.new("Part", m)\nprint(p:FindFirstAncestorOfClass("Model"), m:FindFirstChildWhichIsA("BasePart"))' },
{ name: "game:GetService(name)", cat: "Finding Things", lesson: "l9", what: "Gets one of Roblox's services (Players, ReplicatedStorage, TweenService…).",
  why: "The official, reliable way to reach services. Do it once at the top of a script.",
  ex: 'local Players = game:GetService("Players")\nlocal TweenService = game:GetService("TweenService")\nprint(Players.Name, TweenService.Name)' },

/* ---------- Events ---------- */
{ name: "event:Connect(fn)", cat: "Events", lesson: "l9", what: "Runs fn every time the event fires. Returns a connection.",
  why: "React to things happening: touches, players joining, clicks, value changes. Events are how games respond.",
  ex: 'local p = Instance.new("Part", workspace)\np.Name = "Pad"\np.Touched:Connect(function(hit)\n    print(hit.Name .. " touched the pad")\nend)\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.touch(workspace.Pad, "Ana") end)',
  sim: '', mistake: "<code>:Connect(handler())</code> calls the function instead of passing it." },
{ name: "connection:Disconnect()", cat: "Events", lesson: "l16", what: "Stops a connected function from running again.",
  why: "One-time listeners, cleaning up per-frame code, preventing memory leaks.",
  ex: 'local RunService = game:GetService("RunService")\nlocal n = 0\nlocal c\nc = RunService.Heartbeat:Connect(function()\n    n += 1\n    if n == 10 then c:Disconnect() print("stopped after 10 frames") end\nend)' },
{ name: "event:Once(fn) / event:Wait()", cat: "Events", what: "Once: connect for just the next firing. Wait: pause until the event fires and get its arguments.",
  why: "\"When the first player joins, start the game\" or \"wait until this tween finishes\".",
  ex: 'local Players = game:GetService("Players")\nPlayers.PlayerAdded:Once(function(p) print("First player:", p.Name) end)\nlocal p = Players.PlayerAdded:Wait()\nprint("Waited for", p.Name)\n' + PLAYER_SIM },
{ name: "BasePart.Touched", cat: "Events", lesson: "l9", what: "Fires when another part touches this one, and passes that other part.",
  why: "Kill bricks, coins, checkpoints, speed pads, doors that open when you walk in.",
  ex: 'local lava = Instance.new("Part", workspace)\nlava.Name = "Lava"\nlava.Touched:Connect(function(hit)\n    local h = hit.Parent:FindFirstChild("Humanoid")\n    if h then h.Health = 0 end\nend)\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.touch(workspace.Lava, "Ana") end)' },
{ name: "debounce", cat: "Events", lesson: "l9", what: "A boolean (or a time) that blocks an event handler from running again too soon.",
  why: "Touched fires many times per step. Without a debounce, one coin pays out 20 times.",
  ex: 'local pad = Instance.new("Part", workspace)\npad.Name = "Pad"\nlocal busy = false\npad.Touched:Connect(function()\n    if busy then return end\n    busy = true\n    print("Activated!")\n    task.wait(2)\n    busy = false\nend)\n' + PLAYER_SIM + '\nfor i = 1, 4 do __sim.at(1 + i * 0.3, function() __sim.touch(workspace.Pad, "Ana") end) end' },
{ name: "GetPropertyChangedSignal / .Changed", cat: "Events", what: "Fires when a property changes (Changed on a Value object passes the new value).",
  why: "Update a GUI when coins change, react when a door's attribute flips, detect a health change.",
  ex: 'local v = Instance.new("IntValue")\nv.Changed:Connect(function(new) print("Coins are now", new) end)\nv.Value = 10\nv.Value = 25' },
{ name: "ClickDetector.MouseClick / ProximityPrompt.Triggered", cat: "Events", what: "Fire when a player clicks a part, or holds/presses the \"E\" prompt near it. Both pass the Player.",
  why: "Buttons, shops, doors, NPC conversations. ProximityPrompt is the modern cross-platform choice.",
  ex: 'local door = Instance.new("Part", workspace)\ndoor.Name = "Door"\nlocal prompt = Instance.new("ProximityPrompt", door)\nprompt.ActionText = "Open"\nprompt.Triggered:Connect(function(player)\n    print(player.Name .. " opened the door")\nend)\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.prompt(workspace.Door.ProximityPrompt, "Ana") end)' },

/* ---------- Players ---------- */
{ name: "Players.PlayerAdded / PlayerRemoving", cat: "Players", lesson: "l9", what: "Fire when a player joins or leaves, passing the Player.",
  why: "Set up leaderstats and load data on join; save data and clean up on leave.",
  ex: 'local Players = game:GetService("Players")\nPlayers.PlayerAdded:Connect(function(p) print("Hi", p.Name) end)\nPlayers.PlayerRemoving:Connect(function(p) print("Bye", p.Name) end)\n' + PLAYER_SIM + '\n__sim.at(3, function() __sim.leave("Ana") end)' },
{ name: "player.CharacterAdded / player.Character", cat: "Players", what: "The player's avatar Model in workspace, and the event that fires each time it (re)spawns.",
  why: "Apply things on every spawn (speed boosts, tools), and teleport players.",
  ex: 'local Players = game:GetService("Players")\nPlayers.PlayerAdded:Connect(function(p)\n    p.CharacterAdded:Connect(function(char)\n        char:WaitForChild("Humanoid").WalkSpeed = 24\n        print(p.Name .. " spawned with speed 24")\n    end)\nend)\n' + PLAYER_SIM },
{ name: "Players:GetPlayerFromCharacter(model)", cat: "Players", lesson: "l10", what: "Turns a character model into its Player (or nil).",
  why: "In Touched handlers: you get a body part, and you need the Player to give coins or check leaderstats.",
  ex: 'local Players = game:GetService("Players")\nlocal pad = Instance.new("Part", workspace)\npad.Name = "Pad"\npad.Touched:Connect(function(hit)\n    local player = Players:GetPlayerFromCharacter(hit.Parent)\n    if player then print("Player:", player.Name, player.UserId) end\nend)\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.touch(workspace.Pad, "Ana") end)' },
{ name: "Humanoid (Health, WalkSpeed, JumpPower, TakeDamage, Died)", cat: "Players", lesson: "l9", what: "The object inside a character that handles health and movement.",
  why: "Damage, healing, speed boosts, detecting deaths in rounds.",
  ex: 'local Players = game:GetService("Players")\nPlayers.PlayerAdded:Connect(function(p)\n    p.CharacterAdded:Connect(function(char)\n        local h = char:WaitForChild("Humanoid")\n        h.Died:Connect(function() print(p.Name .. " died") end)\n        h:TakeDamage(30)\n        print("Health", h.Health, "Speed", h.WalkSpeed)\n    end)\nend)\n' + PLAYER_SIM },
{ name: "leaderstats", cat: "Players", lesson: "l10", what: "A Folder named exactly \"leaderstats\" inside a Player. The value objects inside it appear on the leaderboard.",
  why: "Shows coins, wins and kills to everyone with zero UI work.",
  ex: 'game:GetService("Players").PlayerAdded:Connect(function(p)\n    local ls = Instance.new("Folder")\n    ls.Name = "leaderstats"\n    ls.Parent = p\n    local wins = Instance.new("IntValue")\n    wins.Name = "Wins"\n    wins.Value = 3\n    wins.Parent = ls\nend)\n' + PLAYER_SIM },
{ name: "IntValue / NumberValue / StringValue / BoolValue", cat: "Players", lesson: "l10", what: "Objects that hold one value in .Value, with a Changed event.",
  why: "leaderstats, shared state that clients can read (a round Status), and values builders can edit.",
  ex: 'local status = Instance.new("StringValue")\nstatus.Changed:Connect(print)\nstatus.Value = "Intermission"\nstatus.Value = "Round starting!"' },
{ name: "model:PivotTo(cframe)", cat: "Players", lesson: "l21", what: "Moves a whole model (all its parts) to a CFrame.",
  why: "Teleport players, place spawned buildings, move vehicles.",
  ex: 'game:GetService("Players").PlayerAdded:Connect(function(p)\n    p.CharacterAdded:Connect(function(char)\n        char:PivotTo(CFrame.new(50, 10, 0))\n        print("Teleported to", char.HumanoidRootPart.Position)\n    end)\nend)\n' + PLAYER_SIM },

/* ---------- Time & tasks ---------- */
{ name: "task.wait(seconds)", cat: "Time & Tasks", lesson: "l5", what: "Pauses the current thread for that many seconds (minimum one frame).",
  why: "Timers, countdowns, cooldowns, slowing loops down so they don't freeze the game.",
  ex: 'for i = 3, 1, -1 do\n    print(i)\n    task.wait(1)\nend\nprint("Go!")', mistake: "Using the deprecated <code>wait()</code> instead." },
{ name: "task.spawn(fn, ...)", cat: "Time & Tasks", lesson: "l16", what: "Runs a function right away in a new thread, so the current code keeps going.",
  why: "Run a loop (blinking light, game timer) while other code continues.",
  ex: 'task.spawn(function()\n    for i = 1, 3 do print("background", i) task.wait(1) end\nend)\nprint("main keeps going")' },
{ name: "task.delay(seconds, fn, ...)", cat: "Time & Tasks", lesson: "l16", what: "Runs fn after a delay, without pausing the current code.",
  why: "\"Respawn this coin in 10 seconds\", \"remove this effect in 2 seconds\".",
  ex: 'task.delay(2, function() print("2 seconds later") end)\nprint("right now")' },
{ name: "task.defer / task.cancel", cat: "Time & Tasks", what: "defer: run soon, after the current code. cancel: stop a scheduled thread.",
  why: "Cancel a pending respawn if the round ends; defer work until after the current event finishes.",
  ex: 'local t = task.delay(1, function() print("never runs") end)\ntask.cancel(t)\ntask.defer(function() print("deferred") end)\nprint("first")' },
{ name: "os.clock() / os.time()", cat: "Time & Tasks", lesson: "l12", what: "os.clock: precise seconds since start (good for measuring). os.time: real-world time in seconds.",
  why: "Cooldowns (<code>now - lastUse &lt; 1</code>), measuring how long code takes, daily rewards (os.time).",
  ex: 'local last = os.clock()\ntask.wait(1.5)\nprint("Elapsed:", os.clock() - last)' },

/* ---------- Errors ---------- */
{ name: "pcall(fn, ...)", cat: "Errors", lesson: "l11", what: "Runs a function safely: returns success plus either the results or the error message.",
  why: "Wrap anything that can fail for outside reasons: DataStores, HTTP, purchases, teleports.",
  ex: 'local ok, err = pcall(function()\n    local x = nil\n    return x.Name\nend)\nprint(ok, err)\nprint("still running")' },
{ name: "error(msg) / assert(cond, msg)", cat: "Errors", lesson: "l11", what: "Raise an error on purpose / raise one if a condition is false.",
  why: "Refuse bad input loudly in your own functions and modules, so bugs show up early.",
  ex: 'local function setSpeed(s)\n    assert(type(s) == "number", "speed must be a number")\n    print("speed", s)\nend\nsetSpeed(20)\nprint(pcall(setSpeed, "fast"))' },
{ name: "xpcall + debug.traceback", cat: "Errors", what: "Like pcall but calls a handler with the error, so you can capture where it happened.",
  why: "Logging errors with full context in bigger systems.",
  ex: 'xpcall(function()\n    error("something broke")\nend, function(e)\n    warn("Caught: " .. tostring(e))\nend)' },

/* ---------- Client/Server ---------- */
{ name: "Script vs LocalScript", cat: "Client/Server", lesson: "l12", what: "Script runs on the server (trusted); LocalScript runs on a player's device (untrusted).",
  why: "Game rules, money and saving go on the server; UI, camera and input go on the client.",
  ex: '-- Server Script: decides things\nprint("I am the server: I control coins, damage and saving")\n-- LocalScript: shows things\n-- (UI, camera, input, local effects)' },
{ name: "RemoteEvent (FireServer / OnServerEvent / FireClient)", cat: "Client/Server", lesson: "l12", what: "One-way messages between client and server. The server's handler always gets the Player first.",
  why: "Client asks for an action (buy, attack, use an ability); server tells clients to show something (an effect, a notification).",
  ex: 'local re = Instance.new("RemoteEvent")\nre.Name = "Attack"\nre.Parent = game.ReplicatedStorage\nre.OnServerEvent:Connect(function(player, target)\n    if typeof(target) ~= "string" then return end\n    print(player.Name .. " attacks " .. target)\n    re:FireAllClients(player.Name, "hit")\nend)\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.clientFire(game.ReplicatedStorage.Attack, "Ana", "Goblin") end)',
  mistake: "Trusting values the client sends (prices, damage). Always validate." },
{ name: "RemoteFunction (InvokeServer / OnServerInvoke)", cat: "Client/Server", lesson: "l12", what: "Client asks the server a question and waits for the answer.",
  why: "Fetch data from the server: shop stock, your own stats, whether an action is allowed.",
  ex: 'local rf = Instance.new("RemoteFunction")\nrf.Name = "GetLevel"\nrf.Parent = game.ReplicatedStorage\nrf.OnServerInvoke = function(player)\n    return 7\nend\n' + PLAYER_SIM + '\n__sim.at(2, function() __sim.clientInvoke(game.ReplicatedStorage.GetLevel, "Ana") end)',
  mistake: "Using InvokeClient on the server: an exploiter can make it hang forever." },
{ name: "BindableEvent", cat: "Client/Server", what: "Like a RemoteEvent, but between scripts on the <b>same</b> side.",
  why: "Let separate server scripts talk: \"round ended\" announced to the shop, the music and the stats scripts.",
  ex: 'local be = Instance.new("BindableEvent")\nbe.Event:Connect(function(winner) print("Round over! Winner:", winner) end)\nbe:Fire("Ana")' },
{ name: "Players.LocalPlayer", cat: "Client/Server", lesson: "l12", what: "In LocalScripts: the player on this device. On the server it's nil.",
  why: "Client code uses it to find its own GUI, character and stats.",
  ex: '__sim.asClient("Ana") -- sandbox only: pretend this is Ana\'s device\nlocal player = game:GetService("Players").LocalPlayer\nprint("I am", player.Name)\nprint("My GUI folder:", player:WaitForChild("PlayerGui"))' },
{ name: "ReplicatedStorage / ServerStorage / ServerScriptService", cat: "Client/Server", lesson: "l13", what: "ReplicatedStorage: visible to server and clients. ServerStorage and ServerScriptService: server only.",
  why: "Put remotes and shared modules where both sides can see them; keep secrets, maps and server logic hidden from exploiters.",
  ex: 'local RS = game:GetService("ReplicatedStorage")\nlocal SS = game:GetService("ServerStorage")\nprint(RS.Name, SS.Name)' },
{ name: "ScreenGui / TextLabel / TextButton", cat: "Client/Server", lesson: "l12", what: "On-screen UI. GUIs in StarterGui are copied into each player's PlayerGui.",
  why: "Health bars, shops, timers, menus.",
  ex: 'local gui = Instance.new("ScreenGui")\ngui.Parent = game.StarterGui\nlocal label = Instance.new("TextLabel")\nlabel.Text = "Round: 10"\nlabel.Parent = gui\n__sim.asClient("Ana") -- sandbox only: Ana joins, this is her device\nlocal myLabel = game.Players.LocalPlayer.PlayerGui.ScreenGui.TextLabel\nmyLabel.Text = "Round: 9"\nprint(myLabel.Text)' },

/* ---------- Modules ---------- */
{ name: "ModuleScript + require()", cat: "Modules", lesson: "l13", what: "A ModuleScript returns a value (usually a table); require() runs it once and returns that value to every caller.",
  why: "Share code and settings between scripts, avoid copy-paste, organize big projects.",
  ex: '-- (this example builds a module in code, just for the demo)\nlocal m = __sim.module(game.ReplicatedStorage, "Greeter", function()\n    local M = {}\n    function M.hello(n) return "Hello, " .. n end\n    return M\nend)\nlocal Greeter = require(game.ReplicatedStorage.Greeter)\nprint(Greeter.hello("Ana"))' },

/* ---------- OOP ---------- */
{ name: "method : and self", cat: "OOP", lesson: "l14", what: "<code>obj:Method()</code> passes obj as <code>self</code>. Define methods with <code>function T:Method()</code>.",
  why: "Write behaviour once that works on whichever object it's called on.",
  ex: 'local dog = {Name = "Rex"}\nfunction dog:Speak() print(self.Name .. " barks") end\ndog:Speak()' },
{ name: "setmetatable / __index", cat: "OOP", lesson: "l14", what: "Attach a metatable that changes a table's behaviour; __index provides a fallback for missing keys.",
  why: "The foundation of classes in Luau, and also defaults and inheritance.",
  ex: 'local defaults = {Speed = 16}\nlocal t = setmetatable({}, {__index = defaults})\nprint(t.Speed)' },
{ name: "Class pattern (.new + __index)", cat: "OOP", lesson: "l14", what: "<code>Class.__index = Class</code> plus a constructor that returns <code>setmetatable({...}, Class)</code>.",
  why: "Many objects with their own data and shared behaviour: enemies, doors, weapons, round managers.",
  ex: 'local Enemy = {}\nEnemy.__index = Enemy\nfunction Enemy.new(name) return setmetatable({Name = name, HP = 50}, Enemy) end\nfunction Enemy:Hit(d) self.HP -= d print(self.Name, self.HP) end\nEnemy.new("Goblin"):Hit(20)\nEnemy.new("Orc"):Hit(5)' },
{ name: "__tostring / __add / __eq", cat: "OOP", lesson: "l14", what: "Metamethods that customize printing, + and ==.",
  why: "Nicer debugging output, and math-like custom types.",
  ex: 'local Money = {}\nMoney.__index = Money\nMoney.__tostring = function(m) return "$" .. m.v end\nMoney.__add = function(a, b) return setmetatable({v = a.v + b.v}, Money) end\nlocal a = setmetatable({v = 5}, Money)\nprint(a + a)' },

/* ---------- 3D Math ---------- */
{ name: "Vector3.new(x, y, z)", cat: "3D Math", lesson: "l8", what: "A 3D point or direction. Y is up.",
  why: "Positions, sizes, velocities, offsets.",
  ex: 'local a = Vector3.new(1, 2, 3)\nprint(a, a.X, a + Vector3.new(0, 10, 0))' },
{ name: ".Magnitude / .Unit", cat: "3D Math", lesson: "l15", what: "Length of a vector / the same direction with length 1.",
  why: "Distance checks (\"close enough to open?\"), directions for projectiles and movement.",
  ex: 'local from, to = Vector3.new(0, 0, 0), Vector3.new(3, 4, 0)\nprint((to - from).Magnitude, (to - from).Unit)' },
{ name: "Vector3:Dot / :Cross / :Lerp", cat: "3D Math", what: "Dot: how aligned two directions are. Cross: a perpendicular direction. Lerp: blend between two points.",
  why: "Is the enemy in front of me (Dot &gt; 0)? Smooth movement between points (Lerp).",
  ex: 'local forward = Vector3.new(0, 0, -1)\nlocal toEnemy = Vector3.new(0, 0, -5).Unit\nprint("In front?", forward:Dot(toEnemy) > 0)\nprint(Vector3.new(0, 0, 0):Lerp(Vector3.new(10, 0, 0), 0.25))' },
{ name: "CFrame.new / part.CFrame", cat: "3D Math", lesson: "l15", what: "Position + rotation. Setting part.CFrame moves and rotates at once.",
  why: "Precise placement, teleporting, building systems, moving relative to facing.",
  ex: 'local p = Instance.new("Part", workspace)\np.Anchored = true\np.CFrame = CFrame.new(0, 10, 0)\nprint(p.Position, p.CFrame.LookVector)' },
{ name: "CFrame.Angles(rx, ry, rz)", cat: "3D Math", lesson: "l15", what: "A rotation (in radians) around the X, Y and Z axes.",
  why: "Spin parts, angle ramps, aim turrets, open doors on a hinge.",
  ex: 'local p = Instance.new("Part", workspace)\np.Anchored = true\np.Size = Vector3.new(8, 1, 2)\np.CFrame = CFrame.new(0, 5, 0) * CFrame.Angles(0, 0, math.rad(30))\nprint(p.Orientation)' },
{ name: "CFrame * CFrame (relative offset)", cat: "3D Math", lesson: "l15", what: "Apply the right-hand transform relative to the left one.",
  why: "Spawn a bullet 3 studs in front of the gun, place a door 5 studs to the right of a wall, wherever it's facing.",
  ex: 'local gun = CFrame.new(0, 5, 0) * CFrame.Angles(0, math.rad(90), 0)\nlocal muzzle = gun * CFrame.new(0, 0, -3)\nprint(muzzle.Position)' },
{ name: "CFrame.lookAt(from, to) / LookVector", cat: "3D Math", lesson: "l15", what: "A CFrame at <i>from</i> facing <i>to</i>; LookVector is its forward direction.",
  why: "Turrets and NPCs facing targets, cameras, aiming projectiles.",
  ex: 'local cf = CFrame.lookAt(Vector3.new(0, 0, 0), Vector3.new(10, 0, 0))\nprint(cf.LookVector, cf.RightVector)' },
{ name: "cf:Inverse() / :ToObjectSpace / :Lerp", cat: "3D Math", what: "Undo a transform / express one CFrame relative to another / blend between CFrames.",
  why: "Welding offsets, \"where is the target relative to me?\", smooth camera movement.",
  ex: 'local a = CFrame.new(10, 0, 0)\nlocal b = CFrame.new(15, 2, 0)\nprint(a:ToObjectSpace(b).Position)\nprint(a:Lerp(b, 0.5).Position)' },
{ name: "UDim2.new / fromScale / fromOffset", cat: "3D Math", what: "GUI size and position: a scale (fraction of the screen) plus an offset (pixels) for X and Y.",
  why: "UI that fits every screen: fromScale(0.5, 0.1) is half the width and a tenth of the height.",
  ex: 'print(UDim2.fromScale(0.5, 0.1))\nprint(UDim2.new(0, 200, 0, 50))' },

/* ---------- Physics / raycast ---------- */
{ name: "workspace:Raycast(origin, direction, params)", cat: "Raycasting", lesson: "l17", what: "Shoots an invisible line and returns the first hit (Instance, Position, Normal, Distance), or nil.",

{ name: "RaycastParams", cat: "Raycasting", lesson: "l17", what: "Options for a raycast: FilterType (Exclude/Include) and FilterDescendantsInstances.",
